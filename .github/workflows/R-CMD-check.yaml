name: R-CMD-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      # Ordinary CI is isolated from LLM providers. Live benchmarks require an
      # explicit CLI opt-in and credentials supplied outside this workflow.
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      METASALMON_LLM_API_KEY: ""
      CHAPI_API_KEY: ""
      METASALMON_RUN_THEME_A_INTEGRITY: "false"
      # Run the suite under a non-C ambient collation. Generating `en_US.UTF-8`
      # was not enough on its own: R takes its collator from the startup locale
      # (ICU on Linux), so a later `Sys.setlocale("LC_COLLATE", ...)` did not
      # change sort order and the differential guards still found no contrast.
      #
      # This also makes CI the harder environment rather than the easier one.
      # Every canonical-bytes path in the package claims to be independent of
      # locale; running the suite under a locale that actually collates
      # differently is what tests that claim instead of assuming it.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Read by test-parity-register-guard.R; see the checkout step below.
      METASALMONPY_PATH: ${{ github.workspace }}/.metasalmonpy-sibling

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `test-parity-register-guard.R` compares this repo's register against
      # metasalmonpy's and SKIPS when the sibling is absent -- which it always
      # was here, so the guard has never actually run in CI and drift stayed
      # invisible while every run went green. Checking the sibling out lets it
      # run for real. Both repositories are public, so the default token reads
      # it; if metasalmonpy ever goes private this step fails loudly rather
      # than returning the guard to a silent skip.
      #
      # RETIREMENT CONDITION: drop this step and the env var below if the two
      # registers ever stop being independently edited files.
      - name: Check out metasalmonpy so the register guard can run
        uses: actions/checkout@v4
        with:
          repository: salmon-data-mobilization/metasalmonpy
          path: .metasalmonpy-sibling
          ref: main

      # The byte-reproducibility guards compare an ordering under C collation
      # against a contrasting locale, and skip when none is installed. A default
      # runner has only C/POSIX, so those tests were passing vacuously: the
      # guards protecting the package's canonical bytes gave no CI signal at all.
      # `en_US.UTF-8` supplies the contrasting collation; `fr_FR.UTF-8` supplies
      # the non-English `LC_TIME` the HTTP-date parser test needs.
      - name: Generate contrasting locales
        run: |
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8
          sudo update-locale
          locale -a | grep -E 'en_US|fr_FR' || true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::rcmdcheck
            any::dataone
            any::datapack
            any::XML
          needs: check

      - name: Replay Theme A evidence
        run: Rscript scripts/theme-a-benchmark.R replay

      - name: Run full provider-isolated test suite
        run: Rscript -e 'devtools::test(reporter = "summary", stop_on_failure = TRUE)'

      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning", check_dir = "check")'
