name: Theme A offline integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/theme-a-integrity.yaml"
      - "DESCRIPTION"
      - "scripts/theme-a-benchmark.R"
      - "tests/testthat/test-theme-a-benchmark.R"
      - "tests/testthat/test-semantic-review-packet.R"
      - "tests/testthat/helper-semantic-review.R"
      - "tests/testthat/fixtures/theme-a/**"
      - "tests/testthat/fixtures/semantic-review/v1/**"
      - "notes/evidence/theme-a/historical-observations-v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/theme-a-integrity.yaml"
      - "DESCRIPTION"
      - "scripts/theme-a-benchmark.R"
      - "tests/testthat/test-theme-a-benchmark.R"
      - "tests/testthat/test-semantic-review-packet.R"
      - "tests/testthat/helper-semantic-review.R"
      - "tests/testthat/fixtures/theme-a/**"
      - "tests/testthat/fixtures/semantic-review/v1/**"
      - "notes/evidence/theme-a/historical-observations-v1.json"

permissions:
  contents: read

concurrency:
  group: theme-a-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Replay versioned Theme A fixtures
        run: Rscript scripts/theme-a-benchmark.R replay

      - name: Check replay and packet conformance
        run: Rscript -e 'devtools::test(filter = "theme-a-benchmark|semantic-review-packet", reporter = "summary", stop_on_failure = TRUE)'
