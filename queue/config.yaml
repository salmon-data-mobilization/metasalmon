# metasalmon hub queue configuration
#
# The values the `hub` client and the render-and-check guard read, and nothing
# else. Anything describing one piece of work belongs in an item file under
# `queue/items/`, not here. The protocol these values parameterise is
# in `HUB.md` at the repository root; the reasoning is in section 9 of
# `knowledge/plans/2026-09-04-salmon-science-foundry-concrete-plan.md`.
#
# There is no GitHub Project and no GitHub API call in this system. A claim is
# a plain `git push` of an orphan commit to a ref under `claim_ref_prefix`.
#
# Item-file field conventions, including how an `evidence` pointer resolves and
# what `venue` means, are documented once in `queue/README.md`. They are not
# repeated here, because the client does not read them and a second copy of a
# convention is the defect this queue exists to remove.

# ---------------------------------------------------------------------------
# Where claims live
# ---------------------------------------------------------------------------

# The locks repository, created by Brett 2026-09-10: public, empty of code, and
# holding nothing but claim refs. Public because the queue it locks is already
# public, because claim commits are authored as `hub-agent
# <token@agents.invalid>` so no personal identity reaches the history, and
# because on the Free plan branch protection is available for public
# repositories and not for private ones, which is what lets the
# compare-and-swap be enforced by the server rather than only by this client.
#
# `hub doctor` fails loudly on an unreachable remote rather than treating it as
# an empty queue: an agent that reads "nobody holds it" from a missing
# repository will claim work somebody else is already doing.
#
# This value was a `PLACEHOLDER` until 2026-09-10, and the instruction here was
# to stop and report rather than use the queue. That instruction is gone
# because its retirement condition was met: the repository exists and this is
# its push URL. An agent reads this value and uses it.
#
# The client still detects a placeholder by the literal `PLACEHOLDER` prefix,
# and that detection now serves one caller: the race test in
# `scripts/tests/test_hub_claim.sh`, whose fixture sets a placeholder
# `locks_repo` and points the run at a throwaway remote with `HUB_LOCKS_URL`.
# Against a real value that override is not a convenience, it is refused:
# `hub doctor` fails when it is set and every push command refuses, because an
# environment variable that outranks a configured push target can redirect
# every claim, heartbeat, release and handoff at an arbitrary remote. So do not
# reach for `HUB_LOCKS_URL` here; change this line if the target really moved.
#
# Retires when: the client stops honouring `HUB_LOCKS_URL`, which needs the
# race test to build its throwaway remote some other way. Until then a
# replacement placeholder must keep the `PLACEHOLDER` prefix or the detection
# silently stops working.
#
# One thing that had to be learned by running it. GitHub makes the first branch
# pushed to an empty repository the default branch, and a default branch cannot
# be deleted. So in a fresh locks repository the very first claim ever made
# becomes undeletable, and stays the repository's HEAD. `main` therefore holds
# a README and exists precisely so that a claim ref never becomes the default.
# Proved and fixed 2026-09-10, before any real claim was taken.
#
# Retires when: nothing. A locks repository always needs a default branch that
# is not a claim.
locks_repo: https://github.com/salmon-data-mobilization/hub-locks.git

# The claim ref namespace inside `locks_repo`. An orphan commit can never
# fast-forward an existing ref, so a first push here succeeds if and only if
# nobody holds the item; every later record (heartbeat, release, handoff,
# reclaim) is a child of the tip that was read, so it succeeds if and only if
# nobody appended in between.
claim_ref_prefix: refs/heads/claim/

# ---------------------------------------------------------------------------
# Timing. Every value below is a guess. None of them was measured, because
# nothing has been claimed yet. Each carries the observation that would set it
# properly and the point at which to look. A constant whose retirement
# condition is "never" is the anti-pattern this bundle names.
# ---------------------------------------------------------------------------

# How long an interactive claim (a session with Brett or another human in the
# loop) stays valid without a heartbeat.
# Calibrate on: the 90th percentile of elapsed time from claim to release over
#   the first twenty recorded interactive claims, rounded up.
# Revisit: at twenty recorded claims, or 2026-12-01, whichever comes first, and
#   write the measured distribution into the S15 card rather than only changing
#   the number.
lease_hours_interactive: 4

# How long an unattended batch claim stays valid without a heartbeat. Longer
# than the interactive lease because nobody is watching to release it early.
# Calibrate on: the longest run that finished successfully unattended, plus the
#   margin needed so that no successful run was ever reclaimed under it.
# Revisit: the same twenty-claim mark. If any successful unattended run has
#   been reclaimed mid-flight, this number is already wrong and the evidence
#   for raising it is that reclaim.
lease_hours_batch: 12

# How often a live holder appends a heartbeat commit.
# Calibrate on: the longest gap between tool calls observed in a healthy run.
#   This value has to exceed that comfortably, or a healthy agent looks dead.
#   Too short is not free either: every heartbeat is a push, and a queue of
#   chatty holders turns the locks repository into a busy one.
# Revisit: on the first false reclaim, and otherwise at the twenty-claim mark.
heartbeat_minutes: 30

# How long after a missed heartbeat another agent may reclaim the item.
# Calibrate on: the count of reclaims that turned out to have taken work away
#   from a live holder. The target is zero. If it stays zero over twenty
#   claims, this is a candidate to shorten, because the cost of it being too
#   long is a queue that stalls silently on a crashed agent.
# Revisit: at the twenty-claim mark, with the false-reclaim count recorded
#   either way, including when it is zero.
reclaim_grace_minutes: 60

# How many times one item may be reclaimed from an abandoned lease in a rolling
# 24 hours. The client enforces this on the reclaim path and reads it with no
# default, because a default would be a second home for the constant.
#
# Calibration: a guess. An item reclaimed twice in a day is not a lease problem,
# it is an item nobody can finish, and the right response is a human looking at
# it rather than a third attempt. Revisit when any item hits the limit: the
# first one that does is the evidence.
# Retires when: reclaims stop happening, or the limit has been hit enough times
# to be set from what was observed rather than from this reasoning.
max_reclaims_per_item_per_day: 1

# How many items one agent identity may hold at once.
#
# This file is the ONLY home of this number, as of 2026-09-09. `HUB.md` used to
# carry a second copy and the client read this one, so the policy file's copy
# was the stale one by construction; it was deleted rather than corrected.
# `HUB.md` now cites the key by name and states no value.
#
# It is worth recording why, because it happened inside the fix for it: this
# key read 2 while `HUB.md` read 1, for the length of the build, which is the
# restatement failure the queue exists to remove, reproduced in the queue's own
# configuration by two agents who could not see each other.
# Retires when: nothing. One home is the end state, not a step toward one.
#
# Calibrate on: whether the ready queue is ever the thing waiting. Section 9.2
#   measured the real bottleneck as the production of `ready`, which only Brett
#   can do, so raising this before the ready queue backs up buys nothing and
#   costs held items nobody is working.
# Revisit: when more than five items sit in `ready` for a week with an idle
#   agent, which is the first evidence that this cap rather than promotion is
#   the constraint.
max_concurrent_claims: 1

# ---------------------------------------------------------------------------
# Members. The eight hub member repositories, from the ruled allowlist in
# `knowledge/domains/salmon-data-ecosystem.md`.
#
# That card is the home of this fact and this list is a machine-readable copy
# of it, which is exactly the shape of restatement this design exists to
# remove. It is here because the client needs the list without parsing prose,
# and it is safe only because the render-and-check guard compares the two and
# fails when they disagree. When they disagree, the card wins and this list is
# the copy that is wrong. Membership follows from this hub sequencing that
# repository's work (Brett, ruled 2026-08-24); it is not decided here.
#
# Retires when: the client reads the allowlist from the card directly and this
# block can be deleted without the client losing anything.
#
# `forge` is load-bearing, not decoration. The standing authorization in
# section 9.5 covers pushes to these repositories on GitHub and to the locks
# repository. It covers nothing on GitLab, so the one GitLab member is a read
# for agents and every write there stays Brett's.
#
# `solo` is load-bearing in exactly the same way, and it is the one fact the
# whole standing grant turns on. It answers a single question: has anybody
# other than Brett ever contributed to this repository, by commit, by issue, or
# by pull request? `true` means nobody has.
#
# It is participation, NOT access, and NOT ownership. Every repository in the
# organization shows the same eight collaborators, because the organization's
# base permission is `write` and every member inherits access to everything, so
# the collaborator list would say `true` nowhere and make this field empty. Ask
# who has ever participated instead. Ownership fails the other way: Brett owns
# or administers all nine, and three of them still read `false` here.
#
# What it gates: the standing authorization in `HUB.md` covers pushing a work
# branch and opening one draft pull request only where this reads `true`. Where
# it reads `false`, an agent prepares the work in its worktree, shows Brett the
# diff and the pull request text in chat, and waits for him to say yes before
# anything leaves the machine.
#
# When participation cannot be determined the answer is `false`. That is why
# `salmon-science-foundry` reads `false` while nobody at all has contributed to
# it: the repository does not exist yet, so there is nothing to measure and
# nobody can say who will be there first. The two ways of being wrong do not
# cost the same. Reading `false` too readily costs a question Brett answers in
# a sentence; reading `true` wrongly costs a push into somebody else's
# repository that cannot be taken back.
#
# `HUB.md` governs. Its participation table under the standing authorization is
# the measured record, dated 2026-09-10, and this column is the machine-readable
# copy of it, exactly as the repository list above is a copy of the domain card.
# `hub_queue.py lint` compares the two and fails when they disagree; when they
# disagree the table is right and this file is the copy that is wrong. A
# repository reading `true` here and absent from that table fails too, because
# a grant that nothing measured is a grant nobody made.
#
# Retires when: the participation test stops gating writes, or a client that can
# ask the forge who has contributed replaces this recorded answer with a measured
# one. Re-measure whenever a collaborator lands a first commit, issue or pull
# request in any of these, and whenever the organization's base permission drops
# to Read, which makes the access list meaningful again and worth re-reading.
# ---------------------------------------------------------------------------
members:
  - repo: metasalmon
    org: salmon-data-mobilization
    forge: github
    solo: true
  - repo: metasalmonpy
    org: salmon-data-mobilization
    forge: github
    solo: true
  - repo: smn-data-pkg
    org: salmon-data-mobilization
    forge: github
    solo: true
  - repo: salmon-domain-ontology
    org: salmon-data-mobilization
    forge: github
    solo: true
  - repo: dfo-salmon-ontology
    org: dfo-pacific-science
    forge: github
    solo: false
  - repo: psc-salmon-vocabularies
    org: pacific-salmon-commission/psc-data-systems
    forge: gitlab
    solo: false
  - repo: salmon-knowledge-commons
    org: salmon-data-mobilization
    forge: github
    solo: true
  - repo: salmon-data-standards-workshop
    org: salmon-data-mobilization
    forge: github
    solo: false
  # The ninth member, admitted 2026-09-05 on Brett's Q19 ruling. The repository
  # does not exist yet and neither does the organization that will hold it: the
  # institute's GitHub organization is Q35, unresolved, and its working name
  # moved twice in five days. So `org` carries a placeholder rather than a
  # guess, and the client refuses to act on a PLACEHOLDER value.
  # Retires when: Brett creates the organization and the repository, and this
  # line carries their real names.
  - repo: salmon-science-foundry
    org: PLACEHOLDER-institute-organization-not-yet-created
    forge: github
    solo: false

# ---------------------------------------------------------------------------
# Generated blocks. Each entry names a block the renderer writes into a target
# file and the freshness check re-derives on every run. A block that no longer
# matches its source fails the build instead of waiting for a reader to notice,
# which is the whole point: the five stale copies measured in section 9.1 were
# each readable for days without looking wrong.
#
# Every block listed here derives from the item files under
# `queue/items/`. Facts that do not derive from an item file are
# deliberately absent: the release index and the mirror window are not queue
# state, they are release facts whose home is the roadmap, and inventing a
# block for them would put a second answer where the design just removed one.
# ---------------------------------------------------------------------------
# Prose blocks regenerated from the queue, each guarded by `hub_queue.py check`
# so a stale copy fails the build instead of waiting for a reader to notice.
#
# There is exactly ONE, on purpose. It is the proof that the mechanism works,
# and the plan's section 9.7 makes replacing the remaining twelve state facts a
# later step with its own review. Four blocks were declared here before any
# marker existed, which made `check` pass while guarding nothing; declaring a
# block whose markers are absent is now an error rather than a skip.
#
# Retires when: every state fact in the bundle is either generated or deleted,
# at which point this list stops growing and the roadmap carries no
# hand-maintained state.
generated_blocks:
  - block: member-count
    target: knowledge/roadmap.md
