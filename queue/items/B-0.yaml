retires_when: The self-seeding test passes, meaning the normalizer is broken deliberately, `make docs-widoco` fails and leaves raw WIDOCO output in the tree, the normalizer is then repaired with that dirty `docs/webvowl/data/ontology.json` left in place, and the re-run does not go green over the raw bytes. A clean run twice is necessary and not sufficient, and skipping the repair step proves nothing because it fails identically against the unfixed implementation.
