retires_when: 'Both rdfs:range axioms in ontology/modules/02-observation-measurement.ttl are deleted -- obo:NCBITaxon_8015 on smn:observedTaxonFamily and obo:NCBITaxon_8018 on smn:observedTaxonSpecies -- with each term''s definition stating that its value is a reference to a taxon rather than an instance of one, and any enforcement expressed in SHACL, where smn already ships ontology/shapes/method-shapes.ttl, rather than by pinning the range to a higher NCBITaxon class; and smn:NCBITaxon_8018, the smn-namespace proxy class mirroring one species, is deleted along with the hand-written MIREOT triple and the comment calling that mirror byte-faithful to the source, which it is not, since taxslim gives chum''s only asserted parent as the genus NCBITaxon_8016 and not the family. This item does not retire while that proxy class survives. If B-231''s committed exemptions file lists smn:NCBITaxon_8018, the same change deletes that row, which B-231''s check requires once the class is gone. Two things the earlier condition got wrong are recorded so the fix is not aimed at the wrong files. rdfs:range constrains the object, so what is entailed to be Oncorhynchus keta is the property''s value, the organism or taxon node a publisher supplies, and never the observation, which is where an auditor should look. And no reasoner would ever have reported the defect at all: ncbitaxon taxslim 2026-07-12 asserts zero DisjointClasses and zero owl:disjointWith axioms, so nothing between the species classes is contradictory and a dataset can be wrong for years with every build green. Retargeting the range to obo:NCBITaxon_8015 is rejected rather than taken as the cheap fix: family is the right rank and a range axiom is the wrong shape, because it relabels a bad value instead of rejecting one, and that earlier wording was satisfiable with the proxy class and the false comment both still in place, with the competency query passing because at family rank a coho genuinely does not entail chum.'
