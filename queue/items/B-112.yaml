retires_when: 'The nothing-to-migrate early return at R/sdp-methods.R:299 builds the same three-column empty frame -- table_id, method_iri, columns -- that the populated build at R/sdp-methods.R:336-338 and the no-placement return at R/sdp-methods.R:358 already carry, and a test pins the column set of BOTH branches, so a caller reading report$tables$columns gets a column rather than NULL in exactly the case where the package was already clean and the branch was least likely to be tested. Brett ruled the three-column shape on 2026-09-14, for both implementations, so the shape is not an implementer''s choice and the alternative -- a logged ruling that the shapes deliberately differ -- is closed. The mirror half is B-144, where Python moves back to the shape it had first.'
