retires_when: 'A typed POSIXct reaching the descriptor renders as readr''s ISO instant form, with the T separator and the Z zone marker (0999-06-05T13:45:30Z for the backlog''s fixture), which is what metadata/dataset.csv already writes -- Brett ruled that spelling on 2026-09-14, once for both implementations, so no implementer picks one. In R that means the descriptor''s temporal writer (R/metadata-write.R:173 and :175, rendering through .ms_iso_character() at R/platform-time.R:118) emits the same bytes readr::write_csv() emits for the same value, with a test asserting the two files agree for a POSIXct in the shape tests/testthat/test-canonical-date-render.R:246 already uses for a Date: read datapackage.json and metadata/dataset.csv back and expect_identical the temporal_start and temporal_end cells. The two rejected candidates stay rejected: .ms_iso_character()''s space-separated form is not valid xs:dateTime, and coercing POSIXct inside .ms_align_cols() is the move backlog #93 item 1 ruled out, so .ms_iso_date_columns() is not touched and its deliberate disagreement with .ms_canonical_character() about a POSIXct survives. The change alters descriptor bytes only for a package carrying a typed instant, which neither implementation produces on its own. The mirror half is B-145; the parity register row lands in the pull request that implements each half.'
