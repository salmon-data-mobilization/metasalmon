retires_when: 'A card cannot record that it was verified by whoever generated it, and the commons proves it rather than stating it: a CI workflow runs the ten checks of the commons'' VERIFICATION.md on every pull request; the card schema splits provenance into the fields that file names -- generated, citations_checked, corroboration, verified (a named human with a resolving ORCID and matching commit attribution), disputed_readings and cited_by -- with each entry bound to the text it checked by content_digest and ledger_digest and entries append-only; and status is derived from those fields as draft, checked, verified, stable or disputed (deprecated set by hand) instead of typed. Until 2026-09-25 this read "Today the rule is prose, the two fields share one schema pattern so a self-verifying card validates cleanly, and the repository has no CI at all, so nothing would catch it. Needs Q-39 first, because the check cannot be written until what verified means is ruled", which is still the state of the commons at cab0248. Q-39 WAS RULED 2026-09-24, and the rules to enforce are the commons'' VERIFICATION.md, with check 2 as Brett amended it (no agent co-authorship check). The ledger that check 3 reads is the card''s own citation-ledger table (Brett, 2026-09-24: "Use in-card tables"), not a file elsewhere. Commons draft pull request #22 (scripts/ledger/: ledger_table.py, ledger_check.py --from-card, three control cards) is groundwork for this item and not enforcement: nothing in it is wired into CI or okf-check.py, and it carries a committed __pycache__ to drop. The schema and validator changes this needs are ones the commons'' CONTRIBUTING reserves to a human, so the pull request is Brett''s to approve. Unblocked 2026-09-25 on Brett''s chat authorisation "Q-39 done; B-123 ready and claimable"; Q-39 had already reached done on 2026-09-24.'
