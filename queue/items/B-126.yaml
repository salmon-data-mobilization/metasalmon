retires_when: 'metasalmonpy carries the nine functions metasalmon 0.5.0 added (review_semantics, accept_suggestion, reject_suggestion, apply_sdp_semantics, review_metadata, set_sdp_dataset, set_sdp_table, set_sdp_column, set_sdp_code) with behavioural parity, writes the decision_reason column into semantic_suggestions.csv and reads it back on the next review with decision replayed on queue rebuild, has an accessor for the suggestion attributes and reads semantic_suggestions.csv back in read_salmon_datapackage, consumes the schema''s constraints.required the way review_metadata() is built on it, exempts the reviewed strategy from the unattended auto-apply gate at semantics.py:1294 (the #118 fix), amends PARITY.md row 31 in place with the clause drafted under "What metasalmon 0.5.0 owes the mirror" in the parity register, and corrects the parity paragraph in metasalmonpy''s AGENTS.md (it still reads 0.4.0/0.4.0 with no window open). THIS ITEM ENDS AT THE BEHAVIOURAL PORT AND THE VERSION BUMP IS NOT PART OF IT: release numbers stay in lockstep, so moving metasalmonpy to 0.5.0 is a parity claim that also needs the documentation half, and both belong to B-153, which is blocked_by this item. Amended 2026-09-16, after a Codex review of metasalmon pull request 122 read the two items against each other. The clause used to end "and moves metasalmonpy''s version to 0.5.0 only when the mirrored behaviour lands, since release numbers stay in lockstep", which deadlocked: B-153 is blocked_by B-126 and the queue only lets a blocked item be claimed once its blocker is done, so either this item closed without satisfying its own retirement condition or B-153 could never do the work that closes it. The clause was written on 2026-09-12, before B-153 existed; the split filed on 2026-09-15 is what made the bump a separate item, and the clause is the half that did not move with it, so amending it here is truer than dropping a blocker that records a real dependency. If this is too large for one claim, the first sub-slice is the row-31 amendment plus the #118 fix plus decision_reason, and the item stays open until the rest lands.'
