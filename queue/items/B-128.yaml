retires_when: '.ms_chat_http_request() (R/chat-decomposition.R) builds its request body through .ms_llm_build_chat_request_body() (R/llm-semantic-helpers.R), with a temperature argument added to that builder so the chat path keeps its own default, the list(content, data, raw) response shape and the review adapter''s dual-shape normalizer are untouched, and a test shows that an openai configuration naming a gpt-5 model omits temperature on the chat path, which fixes the live GPT-5 failure in chat_decomposition() where the hardcoded temperature is rejected. This is the narrow slice of backlog #3 filed ahead of S7 on 2026-09-12; full convergence of the two builders stays with B-3 and the B-31 engine ruling. WHETHER THE CHAT PATH SENDS A TEMPERATURE AT ALL, AND WHETHER IT SENDS A REASONING EFFORT, ARE Q-54''S RULINGS ON ITS FIRST AND FIFTH DIFFERENCES: routed through the shared builder, the chat path would send the effort .ms_llm_resolve_config() resolves from METASALMON_LLM_REASONING_EFFORT, which neither chat path sends today. Recording those rulings updates this condition to match them, or replaces or retires this item. Added 2026-09-24 after the Codex reviews of pull request 150 on 462cf5f and e03fd35.'
