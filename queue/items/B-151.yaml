retires_when: 'The printed accept_suggestion() call for a column-level slot constrains code_value explicitly, or the slot matcher treats an absent code_value as "no code value" rather than as unconstrained, so the printed call resolves to exactly one slot; and a test in metasalmon covers a measurement column carrying a code list. It is one line on each side and it affects BOTH implementations, so the mirror half is owed in metasalmonpy in the same shape, as B-242, which carries the metasalmonpy test and the removal of the test metasalmonpy pull request 28 pinned; each names the other -- the Python spelling is _review_call_args() and the R spelling .ms_review_call_args(), with _match_slot_rows() and .ms_review_match_slot_rows() as the matcher. Reproduced in R on 2026-09-15: a measurement column with a code list gets a column-level entity_iri target (role entity, no code value) and a codes.csv term_iri target per code (role entity, with one, from the constraint-entity-method role set a measurement parent gets), and the column-level slot prints accept_suggestion(review, "gear", "entity", rank = 1, table = "t") which matches three slots and aborts with "That column and role match more than one review slot." The escalation in .ms_review_call_args() cannot rescue it: it appends code_value only when the row it is printing has one, and the column-level row does not. The abort''s own disambiguation list is no help either, because every option it offers either repeats the table or names a code value, so none of them selects the column-level slot. Reachable from the real pipeline rather than only from a hand-built frame, missed by metasalmon 0.5.0''s own tests, and it is exactly the defect class the header of R/review-console.R says the design exists to prevent: the printed call is the audit trail, so a call that cannot run is the failure the feature could most easily ship with.'
