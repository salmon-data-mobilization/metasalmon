retires_when: 'guides/semantic-review.qmd documents the nine review functions as the workflow, metasalmonpy''s version moves to 0.5.0, and all three copies of the version fact agree in that same change. THIS IS THE ITEM THAT CLOSES THE 0.4.0 TO 0.5.0 CATCH-UP WINDOW, which is the single fact the mirror contract in AGENTS.md turns on, so the three copies -- metasalmon''s AGENTS.md, metasalmonpy''s AGENTS.md, and the release index in metasalmon''s knowledge/roadmap.md -- must be read against each other and moved together rather than one at a time. metasalmonpy pull request 28 lands the whole S5 BEHAVIOUR port and deliberately leaves the version at 0.4.0, because a version is a parity claim and bumping it with the documentation half missing would put a false claim in the tree. What the guide still lacks, measured against that branch on 2026-09-15: it presents suggest_semantics() then the semantic_suggestions attribute then apply_semantic_suggestions() as the whole workflow and names none of the nine functions or the two accessors, so the in-Python review path the number would be claiming is undocumented. The wording that it "presents the spreadsheet as the workflow" overstates it in one direction and understates it in another -- the word spreadsheet appears nowhere in that file, and the guide offers no review path at all rather than an outdated one -- while metasalmon 0.5.0''s NEWS entry leads with reaching strict validation "without opening a single file in a spreadsheet", which is the claim the guide has to be able to support. Two of the three copies are already correct at 0.5.0 and 0.4.0 with the window open: metasalmon''s AGENTS.md and the roadmap release index. metasalmonpy''s AGENTS.md is the copy that was wrong on main and is corrected on the pull request 28 branch, so it lands with that merge and not with this item. THE blocked_by ON B-126 IS REAL AND STAYS: the guide cannot document nine functions that are not in the tree, and the version cannot claim behaviour that has not landed. What was wrong until 2026-09-16 was the other half of the pair -- B-126''s retirement condition also required the 0.5.0 bump, so the two items deadlocked, since the queue only lets a blocked item be claimed once its blocker is done. B-126''s clause was amended to end at the behavioural port and to assign the bump here, which is the half that predated the split; see the amendment note in queue/items/B-126.yaml. Found by a Codex review of metasalmon pull request 122.'
