legacy: ''
evidence: knowledge/backlog.md
retires_when: 'Either the descriptor declares the Frictionless version the package actually targets, or a logged decision records the v1 profile as a deliberate pin with the condition that would retire it. Recorded as an OPEN QUESTION rather than as an established defect: it was noticed in passing while writing metasalmon pull request 116, while checking whether a JSON-LD context could live in the descriptor, and it was NOT investigated. It may well be a deliberate pin. What is known: R/package-helpers.R writes a top-level profile key into datapackage.json from the loaded schema''s profile URI at line 243, and a profile of tabular-data-resource on every resource entry at line 219; the vendored SDP profile requires both, listing profile and resources in its required array and constraining each metadata resource''s profile to the const tabular-data-resource; and smn-data-pkg''s SPECIFICATION.md line 77 requires setting profile, while the retrieved Data Package v2 standard lists $schema among descriptor properties and no profile at all. claimable: false because the pin is not metasalmon''s alone to change -- it is mandated by a specification file this package only vendors, it is written the same way by metasalmonpy, and whether the SDP targets v1 or v2 is a ruling Brett makes rather than an implementer''s call. An agent may do the investigation this item admits was skipped and bring him the two options; it may not choose between them.'
