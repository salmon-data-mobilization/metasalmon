retires_when: 'The six obo: and geosparql: IRIs carry bare declaration stubs per CONVENTIONS.md 5b rule 2 and the two dwc: IRIs are declared by a vendored Darwin Core import under ontology/imports/, make verify-superclass-declarations exits 0 over the modules as they stand, and KNOWN_UNDECLARED in scripts/verify_superclass_declarations.py is empty so the staged target and its --staged mode can be deleted and make test swapped from verify-superclass-declarations-staged to the full gate. THE VENDOR-OR-STUB CALL IS MADE, and no implementer chooses it here. Brett ruled on 2026-09-16, in chat: "Regarding B158 and Q48, let''s stub the OBO and GeoSparkle [GeoSPARQL] terms. And vendor DWC." That sentence rules the modelling call and DOES NOT SAY PROMOTE, so this item stays icebox until Brett says the word. HUB.md reserves the move into ready to an authorization he gave in chat, and reading a modelling ruling as a go-ahead is an agents inference rather than that authorization -- the contrast sits in the same message, where "Regarding B197, promote it" is a promotion instruction and this sentence is not. Waiting costs the queue nothing, because the two blockers below prevent a claim either way; promoting on an inference would put a ready into main that rests on a reading, which the register calls a defect however honestly the reading is labelled. So: stubs for obo:BFO_0000015, obo:IAO_0000030, obo:IAO_0000109, obo:NCBITaxon_8015, obo:NCBITaxon_8018 and geosparql:Feature; a vendored import for dwc:Event and dwc:Organism. The eight, measured by running that gate in staged mode on 2026-09-15 against the modules at d45f8f7: obo:BFO_0000015 at 02-observation-measurement.ttl line 216 (smn:Escapement) and 03-assessment-benchmarks.ttl line 53 (smn:StockAssessment); obo:IAO_0000030 at 01-entity-systematics.ttl line 69, 03- lines 65 and 82, and 05-provenance-quality.ttl lines 13 and 19, five subjects; obo:IAO_0000109 at 02- line 241 and 03- lines 18 and 45, three subjects; obo:NCBITaxon_8015 at 02- line 202, the MIREOT mirror; obo:NCBITaxon_8018 at 02- line 206 (smn:NCBITaxon_8018); dwc:Event at 02- line 224 (smn:SurveyEvent); dwc:Organism at 01- lines 86 and 94 (smn:Deme, smn:Population); and geosparql:Feature at 01- line 59 (smn:GeographicFeature). They are vendoring OMISSIONS rather than typos, and the measurement is the evidence rather than a flourish: smn declares 13 IRIs in the sosa: namespace and ZERO in each of obo:, dwc: and geosparql:, and a typo needs a correct neighbour to be a typo of. WHY THE SPLIT, recorded because a term choice justified only by the gate going green is the failure class AGENTS.md says review cannot catch: the ruling settled a trade-off, and "the validator accepts it" is not the justification -- the gate accepts either. A stub is nearly free and permitted anywhere by CONVENTIONS.md 5b rule 2, but a reasoner learns nothing from a stub, so it fits an IRI smn uses structurally -- a superclass hook or a MIREOT mirror -- where the foreign axioms are not what smn relies on. Vendoring carries weight, a pin and a licence question per source, so it is reserved for the one namespace whose semantics smn actually relies on: dwc: carries smn:Deme and smn:Population -- the terms the 2026-09-14 taxonomic-assignment briefing is about -- and smn:SurveyEvent. BLOCKED BY B-107 AND B-143, for reasons that are this item''s own and not restated from those cards: B-107 goes first because both edit ontology/modules/02-observation-measurement.ttl, and B-143 because the gate, its KNOWN_UNDECLARED list and the staged target this condition names exist on salmon-domain-ontology pull request 30''s branch (f322698) and not on main at d45f8f7, measured 2026-09-16 -- so until both are done this item would be claimable and unfinishable at once, the shape queue/README.md forbids, and blocked_by is what keeps hub ready from offering it, not prose. The S6 card carries the order. THIS IS THE ITEM THAT GATES B-143''s SWITCH-ON, not B-107: B-107 clears one of the nine that gate reports and the other eight are these, so until all nine clear the gate stays staged and make test keeps running the staged target. The vendor-or-stub half of the decision surface this card joined to Q-48 is settled here; what Q-48 still owes Brett is the taxonomic-assignment pattern bundle itself.'
