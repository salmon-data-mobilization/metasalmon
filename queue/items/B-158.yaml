retires_when: 'The six obo: and geosparql: IRIs carry bare declaration stubs per CONVENTIONS.md 5b rule 2 and the two dwc: IRIs are declared by a vendored Darwin Core import under ontology/imports/, make verify-superclass-declarations exits 0 over the modules as they stand, and KNOWN_UNDECLARED in scripts/verify_superclass_declarations.py is empty so the staged target and its --staged mode can be deleted and make test swapped from verify-superclass-declarations-staged to the full gate. THE VENDOR-OR-STUB CALL IS MADE, and no implementer chooses it here. Brett ruled on 2026-09-16, in chat: "Regarding B158 and Q48, let''s stub the OBO and GeoSparkle [GeoSPARQL] terms. And vendor DWC." That sentence rules the modelling call and DOES NOT ITSELF AUTHORIZE A PROMOTION. That is a dated fact about the 2026-09-16 ruling, not a statement of this card''s state -- the state field above is the only place that lives, and this clause stays true whatever it says. HUB.md reserves the move into ready to an authorization Brett gave in chat, and reading a modelling ruling as a go-ahead is an agent''s inference standing where that authorization belongs; the contrast sits inside the one message, where "Regarding B197, promote it" is a promotion instruction and this sentence is not. It is recorded because the next reader meets the same quote and can reach the opposite answer from it, and because promoting on that reading would put a ready into main resting on an inference, which the register calls a defect however honestly the inference is labelled. So: stubs for obo:BFO_0000015, obo:IAO_0000030, obo:IAO_0000109, obo:NCBITaxon_8015, obo:NCBITaxon_8018 and geosparql:Feature; a vendored import for dwc:Event and dwc:Organism. The eight, measured by running that gate in staged mode on 2026-09-15 against the modules at d45f8f7: obo:BFO_0000015 at 02-observation-measurement.ttl line 216 (smn:Escapement) and 03-assessment-benchmarks.ttl line 53 (smn:StockAssessment); obo:IAO_0000030 at 01-entity-systematics.ttl line 69, 03- lines 65 and 82, and 05-provenance-quality.ttl lines 13 and 19, five subjects; obo:IAO_0000109 at 02- line 241 and 03- lines 18 and 45, three subjects; obo:NCBITaxon_8015 at 02- line 202, the MIREOT mirror; obo:NCBITaxon_8018 at 02- line 206 (smn:NCBITaxon_8018); dwc:Event at 02- line 224 (smn:SurveyEvent); dwc:Organism at 01- lines 86 and 94 (smn:Deme, smn:Population); and geosparql:Feature at 01- line 59 (smn:GeographicFeature). They are vendoring OMISSIONS rather than typos, and the measurement is the evidence rather than a flourish: smn declares 13 IRIs in the sosa: namespace and ZERO in each of obo:, dwc: and geosparql:, and a typo needs a correct neighbour to be a typo of. WHY THE SPLIT, recorded because a term choice justified only by the gate going green is the failure class AGENTS.md says review cannot catch: the ruling settled a trade-off, and "the validator accepts it" is not the justification -- the gate accepts either. A stub is nearly free and permitted anywhere by CONVENTIONS.md 5b rule 2, but a reasoner learns nothing from a stub, so it fits an IRI smn uses structurally -- a superclass hook or a MIREOT mirror -- where the foreign axioms are not what smn relies on. Vendoring carries weight, a pin and a licence question per source, so it is reserved for the one namespace whose semantics smn actually relies on: dwc: carries smn:Deme and smn:Population -- the terms the 2026-09-14 taxonomic-assignment briefing is about -- and smn:SurveyEvent. BLOCKED BY B-107 AND B-143, for reasons that are this item''s own and not restated from those cards: B-107 goes first because both edit ontology/modules/02-observation-measurement.ttl, and B-143 because the gate, its KNOWN_UNDECLARED list and the staged target this condition names exist on salmon-domain-ontology pull request 30''s branch (f322698) and not on main at d45f8f7, measured 2026-09-16 -- so until both are done this item would be claimable and unfinishable at once, the shape queue/README.md forbids, and blocked_by is what keeps hub ready from offering it, not prose. WHETHER B-143 CAN REACH DONE BEFORE THIS ITEM IS AN OPEN QUESTION AND BRETT''S, raised by the Codex review of metasalmon pull request 139 on 2026-09-16 and recorded here rather than answered, because answering it either way is a change to a guard. THE MEASUREMENT, which both readings share: scripts/verify_superclass_declarations.py from salmon-domain-ontology pull request 30''s branch (f322698), run unchanged over both d45f8f7 and smn pull request 27''s head, gives STAGED EXIT 0 AND FULL EXIT 1 on both, reporting the same nine IRIs. THE TWO READINGS of B-143''s condition that the gate be "green over the modules as they stand when it lands": on the first, make test passes via the staged target, so B-143 reaches done when pull request 30 merges with these eight still in KNOWN_UNDECLARED, and the order is B-107, then pull request 30 and B-143 done, then this item, which empties the list and swaps make test to the full gate -- work that appears in no other card''s retirement condition. On the second, the same card also says "every IRI the first run reports has been resolved", ALLOWLISTING IS NOT RESOLVING, the full gate exits 1, and B-143 therefore waits for this item while this item is blocked by B-143 -- a cycle, since scripts/hub:936-939 treats a blocker as unresolved until its state is literally done. RESOLVING IT NEEDS ONE OF TWO THINGS, both of which are Brett''s under HUB.md''s reservation of a guard change: amend B-143''s condition to name the staged milestone explicitly, recording the allowlist as a RATCHET in the style of scripts/hub-retirement-debt-baseline.txt with its own retirement being an empty list, which is this item; or split the staged landing out as its own completable item. NOTHING IS STUCK MEANWHILE, and that is why this is recorded rather than worked around: B-107 and smn pull request 27 both come first under either reading, so the ordering question has room to be settled before it could bind on anyone. The S6 card carries the order. THIS IS THE ITEM THAT GATES B-143''s SWITCH-ON, not B-107: B-107 clears one of the nine that gate reports and the other eight are these, so until all nine clear the gate stays staged and make test keeps running the staged target. The vendor-or-stub half of the decision surface this card joined to Q-48 is settled here; what Q-48 still owes Brett is the taxonomic-assignment pattern bundle itself.'
