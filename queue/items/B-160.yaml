severity: P2
blocked_by: []
legacy: ''
evidence: knowledge/backlog.md
retires_when: 'Either smn and gcdfo IRIs receive superclass expansion in DataONE''s production index, demonstrated by a query for a parent concept matching a record annotated only with a child, or a logged decision records that smn will instead mint or align under an already-accepted namespace, or that the ask was made and declined, with what was said. That demonstration is the right test precisely because it does not depend on which of two unresolved readings of the production index is true, so keep it rather than substituting a check that the configuration changed. Verified 2026-09-15 against DataONEorg/dataone-indexer at main, src/main/resources/application-context-ontology-model-service.xml: the ontologyList carries ECSO, ProvONE, ENVO, eleven OBOE modules, MOSAIC_, ARCRC, ADCAD_, SENSO_, and the three salmon namespaces purl.dataone.org/odo/SALMON_, SALMON_alignment_ and SASAP_, and it carries zero occurrences of w3id, iadopt, smn or gcdfo. An annotation outside that list is still indexed into the flat sem_annotation field and is exact-IRI queryable, but gets no expansion, so a search for a parent concept does not match a dataset annotated with a child of it -- for a package built on an ontology whose value is its subclass hierarchy, that is the difference between the hierarchy doing retrieval work at DataONE and being inert there. Annotation indexing is live rather than theoretical: sem_annotation matches 13040 of 3376880 CN documents and 2485 of 286653 KNB documents, all four figures re-measured against the production endpoints on 2026-09-15. TWO THINGS THE ORIGINAL REPORT DID NOT SAY, both of which change what the ask is. The list is not a namespace filter: every entry is paired in altEntryList with a bundled OWL file under src/main/resources/ontologies/, so SALMON_ maps to ontologies/SALMON.owl and SASAP_ to ontologies/SASAP.owl, each of which is really there. Inclusion therefore means DataONE VENDORS A COPY of the ontology, which is a release and versioning commitment on smn''s side -- which file, pinned how, refreshed how -- and not a one-line configuration edit. And the two fields the list feeds, annotation_property_uri and annotation_value_uri, are UNDEFINED FIELDS on the public CN query endpoint today, HTTP 400, while sem_annotation resolves: so either the expansion fields exist internally and are not exposed, or that path is not wired into the production schema at all, and the ask has to carry that question rather than assume inclusion alone buys anything. Say the strategic point plainly, because it is why the item exists: this is a better discoverability lever than emitting I-ADOPT triples (B-78, B-146), because the index cannot represent an I-ADOPT decomposition at all -- it flattens predicate and object into one unordered multivalued field with no pairing and no subject -- whereas expansion makes smn''s existing hierarchy do real retrieval work. Not alternatives in principle, but if effort is scarce this one buys more. The precedent is the strongest argument available: DataONE has already accepted salmon-domain namespaces, so this is extension of an existing arrangement rather than a novel request, and part of the item is working out the relationship between those SALMON_ and SASAP_ namespaces and smn and gcdfo -- own entry, mint under purl.dataone.org/odo/, or align to what is there. That is a real modelling question and it is why this is not claimable, alongside its being an outward-facing request to another organisation. The venue for the ask is an issue on DataONEorg/dataone-indexer, which is also where roadmap intent on per-predicate indexing would be answered; S-03''s KNB deposit is the same destination and the natural occasion to raise it.'
