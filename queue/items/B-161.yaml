retires_when: 'ONE SPELLING IS RULED for a pre-1000 instant in metadata/dataset.csv, and the ruling is recorded in knowledge/questions.md together with whether B-115''s condition is restated to name the ruled bytes. THIS ITEM IS NOW THE RULING ALONE, and the emission halves it used to carry are B-206 (metasalmon, the R writer) and B-207 (metasalmonpy, the Python writer), each blocked on this item and each naming the other. THE SPLIT IS A FIX RATHER THAN A RESCOPING: this condition read "both implementations emit it, and a test asserts that a POSIXct whose year is below 1000 survives write then read unchanged", which cannot be satisfied inside repo: metasalmon at all -- exactly the case queue/README.md forbids, where an item is claimable-and-unfinishable because its end condition needs work in another repository, and the README''s own prescription is to split into a pair with an id each. It went unnoticed because claimable: false meant no agent could take it and discover it; it became reachable when B-204 was blocked on it, and was raised by the Codex review of metasalmon pull request 137 on ad00a37. Nothing is dropped: the round-trip test and both writers are in B-206 and B-207, which cannot start until this is ruled. THE RULING STILL HAS TO COVER BOTH IMPLEMENTATIONS AT ONCE, which is why they share one blocker rather than getting a ruling each -- ruling them separately would create a parity row instead of closing one. CLAIMABLE IS FALSE BECAUSE THIS IS A RULING AND NOT A SUBSTITUTION: padding the CSV side means reopening backlog #93 item 1 deliberately -- it ruled that .ms_iso_date_columns() leaves POSIXct alone, correctly, because coercing an instant changes the separator, the zone marker and whether a fractional second survives -- and the only alternative is accepting a platform-dependent instant year across the ecosystem. Reproduced 2026-09-15 on R 4.3.3 with readr 2.2.0 on Linux: as.POSIXct("0001-02-03 04:05:06", tz = "UTC") is written by readr::write_csv() as 1-02-03T04:05:06Z, and a year of 999 as 999-12-31T23:59:59Z, neither of which is a valid xs:dateTime, so metadata/dataset.csv carries bytes this package cannot parse back. It is backlog #93''s as.character Date defect in the same shape on readr''s instant path, and unlike #93 it IS platform-dependent: backlog #93 item 1''s own comparison table, measured on macOS R 4.5.2, carries the row POSIXct year 1 gives 0001-01-01T00:00:00Z, already correct, and backlog #115 rests on it in prose -- readr::write_csv()''s instant output is already ISO-correct -- which is true on macOS and false on Linux, the platform CI runs. B-115 and metasalmon pull request 118 deliberately did not absorb it and say so in R/platform-time.R on that branch: what B-115''s branch achieves is agreement between datapackage.json and metadata/dataset.csv, agreement now holds on both platforms, and this is the separate question of whether the agreed-on bytes are valid. B-115''S RECORDED CONDITION ASKS FOR MORE THAN AGREEMENT AND ON LINUX THE TWO HALVES CANNOT BOTH HOLD: it requires readr''s ISO instant form "(0999-06-05T13:45:30Z for the backlog''s fixture), which is what metadata/dataset.csv already writes", and those name the same bytes on macOS, where backlog #115''s table was measured, and different bytes on Linux, where the CSV carries 999-06-05T13:45:30Z. No Linux implementation satisfies both without padding the CSV path, which is the decision this item defers. So B-115 can be merged and marked done while violating its own recorded condition. THAT CONFLICT IS DELIBERATELY NOT FIXED BY EDITING B-115: Brett approved pull request 118 without ruling the byte and the spelling is his, so the ruling this item waits on now has to settle two things -- which spelling a pre-1000 instant takes, and whether B-115''s condition is restated to name the ruled bytes at the same time. Found by a Codex review of metasalmon pull request 123 and escalated to Brett 2026-09-16; the full statement is in this item''s backlog entry. Reachable only from a caller-supplied typed instant, which neither implementation produces on its own. Cross-references B-115, B-145 and backlog #93 item 1, and like B-115 the ruling has to be made for both implementations at once or it creates a parity row instead of closing one.'
