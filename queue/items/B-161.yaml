id: B-161
kind: defect
title: readr::write_csv() writes an unpadded, invalid xs:dateTime year for a pre-1000 instant on Linux
state: icebox
claimable: false
repo: metasalmon
venue: claude-code
severity: P2
blocked_by: []
legacy: ''
evidence: knowledge/backlog.md
retires_when: 'One spelling is ruled for a pre-1000 instant in metadata/dataset.csv, both implementations emit it, and a test asserts that a POSIXct whose year is below 1000 survives write then read unchanged. CLAIMABLE IS FALSE BECAUSE THIS IS A RULING AND NOT A SUBSTITUTION: padding the CSV side means reopening backlog #93 item 1 deliberately -- it ruled that .ms_iso_date_columns() leaves POSIXct alone, correctly, because coercing an instant changes the separator, the zone marker and whether a fractional second survives -- and the only alternative is accepting a platform-dependent instant year across the ecosystem. Reproduced 2026-09-15 on R 4.3.3 with readr 2.2.0 on Linux: as.POSIXct("0001-02-03 04:05:06", tz = "UTC") is written by readr::write_csv() as 1-02-03T04:05:06Z, and a year of 999 as 999-12-31T23:59:59Z, neither of which is a valid xs:dateTime, so metadata/dataset.csv carries bytes this package cannot parse back. It is backlog #93''s as.character Date defect in the same shape on readr''s instant path, and unlike #93 it IS platform-dependent: backlog #115''s own table, measured on macOS R 4.5.2, records write_csv giving 0001-01-01T00:00:00Z for a year-1 instant and calls readr''s instant path already correct, which is true there and false here. B-115 and metasalmon pull request 118 deliberately did not absorb it and say so in R/platform-time.R on that branch: B-115''s condition is agreement between datapackage.json and metadata/dataset.csv, agreement now holds on both platforms, and this is the separate question of whether the agreed-on bytes are valid. Reachable only from a caller-supplied typed instant, which neither implementation produces on its own. Cross-references B-115, B-145 and backlog #93 item 1, and like B-115 the ruling has to be made for both implementations at once or it creates a parity row instead of closing one.'
