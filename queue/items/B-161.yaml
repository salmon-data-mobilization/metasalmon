retires_when: 'ONE SPELLING IS RULED for a pre-1000 instant in metadata/dataset.csv, and the ruling is recorded in knowledge/questions.md together with whether B-115''s condition is restated to name the ruled bytes. THE RULING MUST ALSO LEAVE THE QUEUE IN A WALKABLE STATE, AND THAT IS STATED AS AN INVARIANT RATHER THAN A LIST BECAUSE A LIST OF CONSEQUENCES IS ALWAYS ONE SHORT. THE INVARIANT: the ruling is not complete until the queue can be walked from this item to a state where THREE LAYERS AGREE -- what the writers EMIT, what the profile ADMITS, and what the validators CHECK -- with every step of that walk existing as an item, in the repository that can finish it, blocked so that no step can start before the step it depends on. Whatever items that requires, the ruling files, and they are blockers of the items downstream of this one before any of them becomes claimable. THIS IS AN ENLARGEMENT OF WHAT THE RULING HAS TO SETTLE rather than a restatement -- flagged to Brett as such, reversible in a word if he wants it narrower, and it does NOT narrow the choice itself: both options stay live. WHY AN INVARIANT AND NOT A LIST, recorded because the three attempts before it were lists: the Codex review of metasalmon pull request 137 found a missing consequence on 850791a, another on 79c81ea after the first was fixed, and a third after that, each one real and each one a step nobody had enumerated -- first that the profile might need widening, then that B-145 might be work in the opposite direction, then that widening the profile upstream does not update either implementation''s VENDORED COPY or REMOTE PIN, so B-198/B-199''s re-vendor would already be done and the validators would still enforce the old pattern. Three rounds of enumeration produced three incomplete enumerations. THE TWO OPTIONS ARE NOT COMPARABLE, AND THE MEASUREMENTS THAT SHOW IT ARE IN THIS ITEM''S BACKLOG ENTRY rather than here -- the 2026-09-16 card-hygiene section, taken after the split and read out of the sources rather than out of cards describing them. The one sentence this condition needs from them, because it changes what the ruling is choosing between: the PADDED spelling already satisfies both layers that smn-data-pkg validates a temporal value with, and the UNPADDED spelling satisfies neither, so the unpadded outcome is what makes the invariant above expensive and the padded outcome is what makes it nearly empty. WHAT THE RULING STILL DECIDES IS UNCHANGED BY THAT: a ruling against the cheaper outcome is still a ruling, and the spelling is Brett''s. WHAT THE MEASUREMENTS DID NARROW is what padding costs: backlog #93 item 1 rejected COERCING an instant, which changes the separator, the zone marker and whether a fractional second survives, and padding the year off readr''s OWN output changes exactly one of those three -- so the padded implementation is a readr-baseline renderer and not a switch to .ms_iso_character(), which is an agent''s to verify and not part of the ruling. AS A GUIDE AND NOT A DEFINITION, the walk is known to touch at least: which spelling; whether B-115''s condition is restated; B-145''s disposition, since it routes metasalmonpy through the PADDED renderer and is work in the opposite direction under the unpadded outcome while B-207 waits on it unconditionally; a profile widening in smn-data-pkg if the ruled bytes fall outside the pattern in force; and a re-vendor and pin advance in EACH implementation after that widening, because B-198 and B-199 may already have re-vendored the pre-ruling commit. Anything else the walk turns out to need is in scope by the invariant, which is the point of stating it that way. THE REASON THIS BELONGS HERE rather than in the items downstream: a ruling that leaves its own dependency graph ambiguous is not finished, this is the only card that will know the answer at the moment the answer exists, and a queue cannot act on a conditional written in prose. THIS ITEM OWNS THE RULING AND NOT THE EMISSION WORK, which is a statement about what moved out and NOT about what is sufficient to close it -- the invariant above is what closes it. The emission halves it used to carry are B-206 (metasalmon, the R writer) and B-207 (metasalmonpy, the Python writer), each blocked on this item and each naming the other. THIS SENTENCE READ "THIS ITEM IS NOW THE RULING ALONE" until the Codex review of metasalmon pull request 137 on b13c487, and "alone" was the whole problem: after the invariant landed it told a reader the spelling was enough, in the same field that says it is not. Sixth copy of that under-statement and the only one INSIDE this card. THE ACCOUNT FIRST RECORDED HERE OF WHY THE SWEEP MISSED IT WAS WRONG, corrected on the Codex round after it and kept in place because the wrong version is the more instructive half. It said the sweep had searched every mention of the string B-161 and that a card cannot match its own id because it says THIS ITEM. Line 1 of this card is id: B-161, so the file matched and the sweep did reach it. WHAT THE SWEEP ACTUALLY DID: it opened each file, gated on the string being present anywhere in it, then REPLACED the text with the retires_when field alone and searched that -- which discards the id line -- and inside its own condition a card does call itself THIS ITEM, so the field held no match. It then printed a header for this file with NOTHING UNDER IT, first in its output, and that empty section was read as no copies here rather than as the instrument having nothing to show. SO THE RULE IS ABOUT THE EMPTY RESULT AND NOT ABOUT THE PATTERN: an empty result for one target states the instrument''s reach and not the target''s contents, and when the target is the authority every other copy defers to, the only thing that clears it is reading it. The wrong version was a reconstruction from memory presented as a measurement -- the same error in the explanation that the sweep had just made in the search, which is why it is left on the record rather than replaced silently. THE SPLIT IS A FIX RATHER THAN A RESCOPING: this condition read "both implementations emit it, and a test asserts that a POSIXct whose year is below 1000 survives write then read unchanged", which cannot be satisfied inside repo: metasalmon at all -- exactly the case queue/README.md forbids, where an item is claimable-and-unfinishable because its end condition needs work in another repository, and the README''s own prescription is to split into a pair with an id each. It went unnoticed because claimable: false meant no agent could take it and discover it; it became reachable when B-204 was blocked on it, and was raised by the Codex review of metasalmon pull request 137 on ad00a37. Nothing is dropped: the round-trip test and both writers are in B-206 and B-207, which cannot start until this is ruled. THE RULING STILL HAS TO COVER BOTH IMPLEMENTATIONS AT ONCE, which is why they share one blocker rather than getting a ruling each -- ruling them separately would create a parity row instead of closing one. CLAIMABLE IS FALSE BECAUSE THIS IS A RULING AND NOT A SUBSTITUTION: padding the CSV side means reopening backlog #93 item 1 deliberately -- it ruled that .ms_iso_date_columns() leaves POSIXct alone, correctly, because coercing an instant changes the separator, the zone marker and whether a fractional second survives -- and the only alternative is accepting a platform-dependent instant year across the ecosystem. Reproduced 2026-09-15 on R 4.3.3 with readr 2.2.0 on Linux: as.POSIXct("0001-02-03 04:05:06", tz = "UTC") is written by readr::write_csv() as 1-02-03T04:05:06Z, and a year of 999 as 999-12-31T23:59:59Z, neither of which is a valid xs:dateTime, so metadata/dataset.csv carries bytes this package cannot parse back. It is backlog #93''s as.character Date defect in the same shape on readr''s instant path, and unlike #93 it IS platform-dependent: backlog #93 item 1''s own comparison table, measured on macOS R 4.5.2, carries the row POSIXct year 1 gives 0001-01-01T00:00:00Z, already correct, and backlog #115 rests on it in prose -- readr::write_csv()''s instant output is already ISO-correct -- which is true on macOS and false on Linux, the platform CI runs. B-115 and metasalmon pull request 118 deliberately did not absorb it and say so in R/platform-time.R on that branch: what B-115''s branch achieves is agreement between datapackage.json and metadata/dataset.csv, agreement now holds on both platforms, and this is the separate question of whether the agreed-on bytes are valid. B-115''S RECORDED CONDITION ASKS FOR MORE THAN AGREEMENT AND ON LINUX THE TWO HALVES CANNOT BOTH HOLD: it requires readr''s ISO instant form "(0999-06-05T13:45:30Z for the backlog''s fixture), which is what metadata/dataset.csv already writes", and those name the same bytes on macOS, where backlog #115''s table was measured, and different bytes on Linux, where the CSV carries 999-06-05T13:45:30Z. No Linux implementation satisfies both without padding the CSV path, which is the decision this item defers. So B-115 can be merged and marked done while violating its own recorded condition. THAT CONFLICT IS DELIBERATELY NOT FIXED BY EDITING B-115: Brett approved pull request 118 without ruling the byte and the spelling is his, so the ruling this item waits on now has to settle two things -- which spelling a pre-1000 instant takes, and whether B-115''s condition is restated to name the ruled bytes at the same time. Found by a Codex review of metasalmon pull request 123 and escalated to Brett 2026-09-16; the full statement is in this item''s backlog entry. Reachable only from a caller-supplied typed instant, which neither implementation produces on its own. Cross-references B-115, B-145 and backlog #93 item 1, and like B-115 the ruling has to be made for both implementations at once or it creates a parity row instead of closing one.'
