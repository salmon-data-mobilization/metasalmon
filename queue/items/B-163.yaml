id: B-163
kind: defect
title: The SDP atomic write set renames a staging file it never flushed, so it is atomic but not durable
state: icebox
claimable: false
repo: metasalmon
venue: claude-code
severity: P2
blocked_by: []
legacy: ''
evidence: knowledge/backlog.md
retires_when: 'Brett rules whether metasalmon takes on compiled code, a new dependency, or an external sync call so that an SDP write is durable across a machine crash rather than only atomic across an aborted call; and if he rules for durability, the staging file and its directory are flushed before the rename with a test pinning the call. CLAIMABLE IS FALSE BECAUSE IT IS A DECISION AND NOT A SUBSTITUTION: base R exposes no fsync, so every way to close this adds something the package does not have. Measured 2026-09-15 on main -- .ms_sdp_extension_atomic_write_set() (R/sdp-extension-helpers.R:133) stages each replacement with writeBin() at line 186 and installs it with file.rename() at line 240 with no flush between, and the rollback path (the rename-aside at line 234 and the restore at line 206) has the same shape, so a crash after a rename can leave a renamed empty file where the previous bytes were. What reaches it on main: write_salmon_datapackage() through .ms_commit_package_write() (R/package-helpers.R:718), the set_sdp_* setters through .ms_set_sdp_metadata() (R/sdp-field-setters.R:850), apply_sdp_semantics() (R/metadata-write.R:463), migrate_sdp_methods() (R/sdp-methods.R:560) and write_sdp_observation_structures() (R/observation-structures.R:946). create_sdp()''s three sidecars join that list when B-111 and metasalmon pull request 119 merge and do NOT today, which corrects the blast radius as reported. Six further writers do their own tempfile-writeBin-rename with the identical gap and are not reached through the set: KNB publication (R/knb-publication.R:865), the reproducibility manifest (R/reproducibility-manifest.R:220), measurement decompositions (R/measurement-decompositions.R:537), SSSOM (R/sssom.R:870), EML export (R/eml-export.R:3007) and ontology fetch (R/ontology_fetch.R:90), so a durability ruling names them or deliberately leaves them out. THE MIRROR HALF IS NOT A DIVERGENCE TODAY, correcting the report this item came from: metasalmonpy has zero occurrences of fsync, and atomic_io.atomic_write() writes through os.fdopen and calls os.replace with no flush, so the two implementations are identical in durability and no register row is owed. The asymmetry is in the cost of closing it -- Python has os.fsync in the standard library and R has nothing -- which is an argument for ruling once for both rather than letting Python close it quietly and open a register row.'
