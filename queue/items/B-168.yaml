id: B-168
kind: defect
title: .pytest_cache is in no ignore file in the ecosystem, and a stray one adds an R CMD check NOTE that muddies a baseline
state: icebox
claimable: true
repo: metasalmon
venue: claude-code
severity: P4
blocked_by: []
legacy: ''
evidence: knowledge/backlog.md
retires_when: 'metasalmon .Rbuildignore excludes .pytest_cache so a checkout where pytest has been run builds the same tarball as a fresh one, and .gitignore names .pytest_cache/ beside the __pycache__/ entry it already carries, in metasalmon and in the two sibling repositories that run pytest. THE REPORT WAS HALF RIGHT AND THE HALF IT GOT WRONG IS WHY THIS IS FILED SEPARATELY FROM A ONE-LINE FIX. It said the directory is git-ignored but absent from metasalmon''s .Rbuildignore. The second half is true and has a measured consequence, recorded twice on 2026-09-15 by two agents who could not see each other: the B-106 run found checking for hidden files and directories ... NOTE / Found ... .pytest_cache on its baseline worktree and not on its own, and the B-116 run recorded the same note as a baseline-only difference. R CMD build packages the directory because nothing excludes it, so a worktree where pytest has been run and a fresh one produce different check output, which is exactly how a baseline comparison gets muddied in a fleet that compares against baselines. The first half is false in all three repositories: git check-ignore -v .pytest_cache exits 1 in smn-data-pkg, and the Python block of every .gitignore here is __pycache__/, *.py[cod], *$py.class, *.so, .Python and virtualenv entries with no pytest line -- metasalmon line 69, metasalmonpy line 79, smn-data-pkg the same. What actually keeps it out of git status is that pytest writes .pytest_cache/.gitignore containing a single asterisk when it creates the directory, so every file inside ignores itself: git check-ignore -v .pytest_cache/CACHEDIR.TAG in smn-data-pkg reports .pytest_cache/.gitignore:2 as the matching rule. That is the guard shape AGENTS.md warns about seen from the far side -- the protection is a third-party artifact nobody in the repository knows about, it stops silently if pytest changes it, and reading the repository alone tells you nothing is wrong. THE REPO FIELD IS METASALMON AND NOT SMN-DATA-PKG, deliberately: smn-data-pkg has no .Rbuildignore at all and is not an R package -- no DESCRIPTION, no NAMESPACE -- so the half with a consequence exists only here, and smn-data-pkg and metasalmonpy are named for the .gitignore line rather than given items of their own.'
