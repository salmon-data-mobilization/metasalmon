retires_when: 'lint refuses, or warns by name, when strip_comment() removes text from a value that is not a comment -- at minimum for title and retires_when, the two free-prose fields where a backlog citation appears almost immediately -- demonstrated red against a title reading Backlog #32''s fix has no guard. FOUND BY TRIPPING OVER IT WHILE FILING B-164 ON 2026-09-15, which is the only way it can be found: the item file said Backlog #32''s fix has no guard, and two vignettes written after it carry the shape it closed, hub_queue.py list rendered the title as the single word Backlog, and lint printed OK. strip_comment() (scripts/hub_queue.py:302) cuts an unquoted value at the first space-hash, which is correct YAML and is documented in the schema block at the top of that file -- a value containing a hash must be quoted, which is why legacy is written with quotes. The defect is not the rule, it is that BREAKING IT IS SILENT AND THE GUARD SAYS OK. A truncated title is still a valid title, so every existing check passes, and the only signal is that a human reads a rendered block later and finds a sentence that stops mid-thought. That is the failure class this queue was built to remove, in the queue''s own validator: the file on disk and the fact the client reads have quietly become two different things. The exposure is one-directional and worth stating: a backlog citation of the form hash-number is the single most likely thing to appear in these two fields, because every item migrated from that backlog cites one. A cheap and complete fix is to compare the stripped value against the raw one and refuse when the removed text does not look like a comment; a cheaper and partial one is to refuse an unquoted value containing a hash at all, which would also catch the case where the truncation happens to leave a plausible sentence behind. IT WAS ALREADY LIVE ON MAIN AND HAD BEEN FOR WEEKS: a sweep of all 110 item files for an unquoted value containing a space-hash found exactly two, B-124 and B-125, whose titles rendered as Port the validator checks of and Port the categorical inference of because they cite backlog 49 and 95. Both are quoted in the same change that files this item, so the guard''s red demonstration has to be reconstructed rather than taken from the tree; the sweep is the thing to re-run, and lint reported OK on both throughout.'
