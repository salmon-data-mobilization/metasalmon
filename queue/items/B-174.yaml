retires_when: 'review_metadata() reports every field whose REVIEW-prefixed IRI blocks validate_salmon_datapackage(path, require_iris = TRUE), so the scan''s own stated contract holds again -- when the last row it prints is gone, strict validation passes -- demonstrated red on a package whose only remaining gap is a REVIEW: marker, and pinned by a test that drives the validator rather than asserting on the printed text. THIS IS A USER-FACING DEFECT IN RELEASED 0.5.0, not a latent one: it is the state a user reaches by leaving any part of the semantic review queue undecided, which is the ordinary path. Measured 2026-09-15 under R 4.3.3 against metasalmon 0.5.0 loaded from source at main 4cd085c (DESCRIPTION 0.5.0; the package is not installed in any library on this machine, so the report that said "installed metasalmon 0.5.0" was measuring a load_all tree). .ms_is_unfilled_metadata() at R/sdp-field-setters.R:50-55 answers FALSE for REVIEW:https://example.org/Thing and TRUE for the three prose placeholder spellings (MISSING METADATA:, MISSING DESCRIPTION:, REVIEW REQUIRED:), for blank and for NA. End to end on a package filled to the point where strict validation passed, then given one REVIEW: marker: review_metadata() printed "No outstanding metadata." and "Every required field is filled and no placeholders remain." while validate_salmon_datapackage(pkg, require_iris = TRUE) refused the same directory with "Validation cannot pass while REVIEW-prefixed IRI values remain." THE DEFECT IS THE PREDICATE, NOT THE FIELD LIST, which is the one thing to get right before writing the fix: it was reported as a coverage gap reaching only measurement and table IRIs, and it is wider than that. A REVIEW: marker on column_dictionary.csv term_iri, property_iri, entity_iri or unit_iri is missed even though those four are already enumerated in .ms_measurement_iri_fields() and already scanned, and a marker on tables.csv observation_unit_iri is missed even though that field has its own dedicated branch -- measured refused by validation and reported as 0 rows by the scan in every case. constraint_iri and statistical_modifier_iri are missed for the same reason plus a second one: they are neither schema-required nor in the measurement enumeration, so only the prose-placeholder branch ever visits them. Keep .ms_is_review_placeholder() narrow and add a SECOND predicate rather than widening the first: its narrowness is load-bearing for 12 call sites across R/package-helpers.R, R/sdp-field-setters.R, R/edh-xml-export.R and R/metadata-write.R, several of which exclude the marker on purpose because it has its own reporting path (R/package-helpers.R:1748-1751 says so in a comment) or because an IRI''s own text is not a usable hint (.ms_metadata_gap_row). The second-hand report said five callers; five is the Python count for _is_review_placeholder in metasalmonpy semantics.py, and R has 12. An IRI-aware predicate already exists at R/review-console.R:133, .ms_review_is_unfilled(), and IT IS NOT A DROP-IN REPLACEMENT: measured, it answers FALSE for all three prose placeholder spellings, so swapping it onto this path would trade one half of the defect for the other. What is needed is the union, or a second predicate as metasalmonpy pull request 28 added (_is_unresolved_iri, kept separate for exactly this reason). The scan''s file scope has to match what strict validation actually sweeps rather than what seems symmetric: tables.csv and column_dictionary.csv are refused, and dataset.csv and codes.csv are NOT (see B-177), so reporting a marker there would make the scan claim a block that does not exist -- the same class of error as missing one, pointing the other way. B-177 is not a blocker: the two swept files can be fixed first, and metasalmonpy already pins its own file list with a retirement condition tying the two lists together. This is a PORT and not a deviation, so no PARITY.md row is owed: the same defect was in both implementations in the same shape and the Python half is already fixed in pull request 28. PYTHON HAS SINCE FIXED ITS HALF and is a reference rather than a guess: metasalmonpy pull request 28 (ead77a3, verified in 00935d7) added a second predicate, _is_unresolved_iri(), deliberately leaving is_review_placeholder() narrow because five other callers depend on that narrowness. Read it before choosing a shape here; direction noted, because under the mirror contract Python leading is a per-divergence question rather than a default.'
