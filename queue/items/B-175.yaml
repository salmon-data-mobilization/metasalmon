id: B-175
kind: defect
title: review_metadata() contacts the network although its documentation says it never does
state: icebox
claimable: true
repo: metasalmon
venue: claude-code
stream: S5
severity: P2
blocked_by: []
legacy: ''
evidence: knowledge/backlog.md
retires_when: 'review_metadata() and the four set_sdp_*() setters make no network request under the shipped default options, AND A SENTINEL PROVES IT rather than a green run implying it. The sentinel is the retirement condition, not an extra: .ms_load_sdp_schema() wraps the fetch in tryCatch(error = function(e) e) at R/schema-helpers.R:114-117 and falls back to the vendored bundle, so a sentinel that signals an ERROR is swallowed and the test passes whether or not the network was reached. Measured 2026-09-15 under R 4.3.3: a mocked httr2::req_perform that calls stop() was reached once and the call still returned all 24 dataset.csv field definitions with no condition escaping -- the R spelling of the same trap that swallowed a Python Exception on the other side. A sentinel that works either records its firing outside the call (a counter incremented before the stop) or signals a NON-error condition that tryCatch(error = ) cannot see; both were demonstrated firing on 2026-09-15 and either is acceptable. Path measured: .ms_metadata_schema_fields() (R/sdp-field-setters.R:101-105) calls .ms_load_sdp_schema(quiet = TRUE) (R/schema-helpers.R:103-151), whose default source is the option metasalmon.sdp_schema_source with fallback "auto", and "auto" calls .ms_fetch_remote_sdp_schema() (R/schema-helpers.R:153-175) BEFORE falling back to the bundled copy. The roxygen sentence is at R/sdp-field-setters.R:340 -- "It never contacts a network or an LLM." -- and it is rendered into man/review_metadata.Rd:44, so it is a published claim and not only a code comment. The second-hand report placed it at line 339 and said six requests at 2.0 seconds each; the measured cost is EIGHT requests to raw.githubusercontent.com per cold schema load (six Frictionless metadata schemas from .ms_sdp_metadata_schema_paths(), plus the profile and sdp.rules.yaml), each with the 2-second timeout that is the default of .ms_fetch_remote_sdp_schema(), 1.08 seconds of wall clock on this machine with the host reachable and up to 16 seconds when it hangs. The schema is cached in .ms_schema_env per cache key, so it is eight requests on the first call in a session and zero on the second; a scripted review that starts a fresh R process per package pays it every time. set_sdp_dataset() measured the same eight on the same path. review_semantics() measured ZERO and its identically worded claim (man/review_semantics.Rd:40) holds, which is what makes this one a defect in review_metadata() rather than a house style. NOTHING IN THE SUITE CAN SEE IT: tests/testthat/helper-validation.R:3 sets options(metasalmon.sdp_schema_source = "vendored") for the whole run, and pkgload::load_all() sources test helpers by default, so a dev console inherits the pin too and the shipped default is exercised nowhere -- metasalmonpy''s tests/conftest.py pins the same value for the same stated reason. This is the same contract shape as the package''s LLM-opt-in rule in AGENTS.md, which says supplying llm_context_files must NEVER trigger a network or LLM call and that options which will be ignored should warn rather than silently no-op: a function documented as local must be local, and a documented guarantee that is only usually true is the failure that rule exists to name. The fix metasalmonpy pull request 28 used is to read the bundled bundle explicitly on this path (a module constant _SCHEMA_SOURCE = "vendored" carrying its own retirement condition), with the setters reading the same source so the gap scan and the printed call cannot disagree about which fields exist. This is a PORT and not a deviation, so no PARITY.md row is owed.'
