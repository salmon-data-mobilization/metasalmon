legacy: ''
evidence: knowledge/backlog.md
retires_when: 'accept_suggestion(review, column, role, iri = "...") followed by apply_sdp_semantics() leaves semantic_suggestions.csv carrying a row whose iri is the accepted IRI and whose decision is accepted, and the next review_semantics() replays that decision; demonstrated red on an IRI that is not among the slot''s existing candidates, and pinned by a test that reads the file back rather than asserting only on the dictionary. Measured 2026-09-15 under R 4.3.3 against metasalmon 0.5.0 loaded from source at main 4cd085c, on a create_sdp() package seeded through a mocked find_terms: accept_suggestion(review, "spawner_count", "variable", iri = "https://example.org/Handpicked") then apply_sdp_semantics() wrote https://example.org/Handpicked into column_dictionary.csv term_iri, and left semantic_suggestions.csv with TWO not_selected rows (the report said one; the fixture''s variable slot carries two candidates, so the count is a property of the slot rather than of the defect), zero rows with decision accepted, no row anywhere whose iri is the accepted one, and review_semantics() replaying ZERO decisions on the next pass with include_filled TRUE or FALSE. The mask is R/metadata-write.R:445-449: accepted is computed as in_slot AND the row''s stripped iri equalling the decision iri, so when the accepted IRI is not one of the slot''s candidates the vector is all FALSE, line 447 sets every row in the slot to not_selected and line 448 sets nothing to accepted. not_selected is absent from .ms_review_recorded_decisions() (R/review-console.R, the map is accepted, accept, rejected), so the replay helper skips those rows and the decision is unrecoverable from the package; the slot then drops out of the next queue only because the dictionary field is now filled, not because the answer was remembered. TWO THINGS THE PYTHON FIX ESTABLISHED THAT THE R FIX MUST NOT LOSE. First, the accepted IRI needs ITS OWN ROW rather than an existing candidate relabelled: relabelling would make the file say that a term the reviewer never chose is the one they chose, and the label, source, ontology, definition and score columns of the row would all describe a different term. Second, the new row must be inserted at the HEAD of its slot and not appended, because review_semantics() derives rank from file position (R/review-console.R:316-323, deliberately not a sort, so the ranked order and the seeded auto-apply cannot disagree) and then drops everything past max_candidates, default 5 (R/review-console.R:398-399). Demonstrated 2026-09-15 on a slot padded to six candidates: with the hand-picked row appended it ranks 7 and is filtered straight back out of the rebuilt review, and with the same row inserted at the head it ranks 1 and survives. This is a PORT and not a deviation, so no PARITY.md row is owed: the same defect was in both implementations in the same shape and the Python half is already fixed in metasalmonpy pull request 28. PYTHON HAS SINCE FIXED ITS HALF: metasalmonpy pull request 28 (ead77a3, verified in 00935d7). Two edges its verification probed and settled, both worth matching: two successive hand-picked accepts on one slot leave exactly one accepted row, the second, with the first demoted to not_selected; and a hand-picked accept on a codes.csv slot records with code_value preserved, so slot addressing survives for code-level targets.'
