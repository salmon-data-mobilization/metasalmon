retires_when: 'validate_salmon_datapackage(path, require_iris = TRUE) and the EDH rebuild gate sweep the same set of metadata files for REVIEW-prefixed IRI values, OR a logged decision names which set is right and why, with the loser changed to match in the same change and the reason recorded rather than left to be inferred from two function bodies. LATENT TODAY AND SAY SO, so nobody reads this as live breakage: .ms_review_iri_prefix() has exactly two call sites, R/package-helpers.R:3848 which writes into column_dictionary.csv and R/package-helpers.R:4166 which writes tables.csv observation_unit_iri, so no producer in the package writes a REVIEW: marker into dataset.csv or codes.csv and only a hand-edited or third-party package can be in this state. The sharper question is inside it: TWO CODE PATHS IN THE SAME PACKAGE ALREADY DISAGREE ABOUT SCOPE. R/edh-xml-export.R:1175-1178 calls .ms_collect_review_iri_issues() on all four frames -- dataset, tables, dictionary and codes -- while the strict validation path calls it on tables alone (R/package-helpers.R:1972) and reaches the dictionary only through validate_dictionary() and validate_semantics(). Measured 2026-09-15 under R 4.3.3 against metasalmon 0.5.0 loaded from source at main 4cd085c, on a package filled until strict validation passed: a REVIEW: marker on dataset.csv protocol_iri and one on codes.csv term_iri were each reported by .ms_collect_edh_review_state_issues() and each left validate_salmon_datapackage(pkg, require_iris = TRUE) passing, while the same marker on column_dictionary.csv constraint_iri, statistical_modifier_iri or term_iri, and on tables.csv observation_unit_iri, method_iri or protocol_iri, was refused. codes.csv was NOT in the second-hand report and is the same defect as dataset.csv: two files, not one. It is not caught by the unconditional placement check either, which excludes anything matching ^REVIEW: on purpose (R/package-helpers.R:1748-1751) because the marker has its own reporting path -- and on dataset.csv protocol_iri that path is the one that is missing. THE SAME QUESTION IS OPEN ON THE PYTHON SIDE and the two implementations already differ on one half of it, so this is not purely an R item. metasalmonpy _collect_review_issues() (package_io.py:2284-2315) sweeps tables, dictionary and codes for REVIEW IRIs but NOT dataset, where R''s EDH path does sweep dataset, so the two EDH gates disagree about dataset.csv protocol_iri; and metasalmonpy pull request 28 froze the scan-side answer as _REVIEW_IRI_FILES = (tables.csv, column_dictionary.csv, codes.csv) with a retirement condition tying that tuple to whatever _collect_review_issues() sweeps. Whichever way this is ruled, the ruling has to reach four places -- R strict validation, the R EDH gate, the Python equivalents of both, and the review_metadata() scan list of B-174 -- and the one deliberate difference that survives needs a parity register row, which is the only row any of this filing run''s items could owe. MEASURED AGAIN ON THE PYTHON SIDE 2026-09-16, one marked field per file, and the two implementations agree -- which is what makes this a port rather than a divergence and means neither side may move alone: validate_salmon_datapackage(require_iris=True) refuses tables.csv and column_dictionary.csv and PASSES codes.csv and dataset.csv, while the EDH gate refuses those three and passes dataset.csv. metasalmonpy pinned all twelve answers in test_which_files_a_review_marker_actually_blocks rather than changing behaviour, on the same reasoning this item gives. NOTE FOR WHOEVER RULES IT: AGENTS.md states as a contract that strict validation fails if any REVIEW: marker remains, which is wider than what either implementation does, so the ruling settles the sentence as well as the code.'
