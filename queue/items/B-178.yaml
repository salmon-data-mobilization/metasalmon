retires_when: 'The evidence table in metasalmonpy pull request 28''s body names the commit each count was measured at, or is re-measured at the head, so a reader can reproduce it without first working out which of two commits it describes; and the convention that a suite count in a pull request body carries its commit is written down wherever that repository records its release and review procedure, so the next body does it by default. THE FINDING THIS ITEM WAS FILED TO RECORD DOES NOT HOLD, AND THE NEGATIVE RESULT IS THE POINT: it was reported as "the body records counts that do not reproduce, with a two-test difference that was not chased". The body''s counts reproduce exactly. Measured 2026-09-15 on this machine, from a throwaway clone of the branch, with metasalmonpy installed editable into two purpose-built virtual environments: at commit 05be2a1 with Rscript absent from PATH, the [test,eml,context] leg gives 896 passed / 3 skipped and the core-only leg 783 passed / 116 skipped -- both byte-for-byte the figures in the body. With Rscript present and the hardcoded R library directory under the system temp root holding metasalmon 0.5.0, the same commit gives 898 / 1 and 785 / 114. THE WHOLE DIFFERENCE IS THE TWO R ROUND-TRIP TESTS and the body already says so: tests/test_roundtrip.py gates its two tests on HAVE_R, which is shutil.which of Rscript AND os.path.isdir of the R_LIB_PATH constant at tests/test_roundtrip.py:19, and the body records "With R plus metasalmon installed: 898 / 1" as a separate line. Two tests move from skipped to passed in both legs, the totals are 899 either way, and the same pair explains the core leg''s 783/116 against 785/114, which the body does not state but which follows from the identical gate. So there is no unchased two-test difference and nothing measured here contradicts the body. WHAT IS ACTUALLY STALE is smaller and real: the branch has two commits, and the body''s evidence table was measured at the first. At the head, ead77a3 -- "Fix the three Codex P2 findings on the S5 port" -- the same two legs give 904 / 1 and 791 / 114 with R present, six more passing tests than 05be2a1 in each leg, because that commit added tests to tests/test_review_console.py and tests/test_sdp_field_setters.py. A reader checking the body against the head finds four numbers that are all wrong by six, with nothing in the body saying which commit it describes. That is an evidence-hygiene defect rather than a code defect, which is why it is P4: a pull request body''s evidence should reproduce, and when it does not the first question is whether the measurement or the environment differs -- here it was neither, it was the commit. Nothing in metasalmonpy needs a code change and nothing in metasalmon is affected; no PARITY.md row is owed.'
