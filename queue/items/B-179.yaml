retires_when: 'metasalmonpy''s three create-owned sidecar writes -- README-review.txt, semantic_suggestions.csv and metadata/metadata-edh-hnap.xml -- render to bytes and install through the atomic_io.py writer, _replace_create_output() has no callers, and the EDH path either builds in memory the way R does or brings its whole read inside the transaction; pinned by three abort injections AT THE RENDER STEP, each asserting the prior file is byte-identical afterwards. THE INJECTION POINT IS THE ONE THING TO GET RIGHT: an abort injected at the install passes on the unfixed code and proves nothing, because a staged-sibling rename leaves the prior bytes in place by construction. metasalmon tests/testthat/test-create-sdp-sidecar-atomicity.R is the model -- three render injections plus a happy-path round trip and a direct-filesystem-call guard -- and it carries a second lesson the R run learned by hitting it: key each hook on CONTENT, never on the destination path, because the post-fix render writes to a staging file and a path-keyed hook silently stops injecting while the test still passes. In Python the EDH hook (edh_build_hnap_xml) is already render-level and survives the fix; a hook on Path.write_text, or a to_csv hook keyed by its path argument, does not. PICK ONE EXISTING WRITER AND SAY WHICH, rather than adding a third: this condition and register row 53 name atomic_io.atomic_write(), the single-file staged-sibling rename, while the twin PARITY.md row''s retirement clause names sdp_methods._atomic_write_set(), whose one-entry form is the literal analogue of R''s .ms_sdp_extension_atomic_write() wrapper -- either satisfies render-to-bytes-then-rename. Keep the three as three transactions rather than one set, for the reason the R half records: they are independent files written at different points in create_sdp(), the harm is a destroyed file rather than a partly-updated group, and the suggestions branch can also DELETE, which a write set has no operation for. MEASURED 2026-09-16 against metasalmonpy main 1f510c9: _replace_create_output() at package_io.py:388 unlinks the existing file and leaves the caller to render a replacement, at three create_sdp() call sites -- package_io.py:1545 (README), :1820 (suggestions) and :1838 (EDH). The EDH window is the wider of the two implementations because read_salmon_datapackage(pkg_path) runs at :1839, AFTER the unlink, so every read and parse failure of the whole package sits inside the destroyed-file window too; R built from the in-memory artifacts and never had that. THIS IS A LIVE DATA-LOSS PATH AND NOT A MISSING FEATURE: a Python caller re-running create_sdp() can lose an annotated README-review.txt, a semantic_suggestions.csv carrying review decisions, or the EDH XML of a package whose metadata has moved on -- the three files a re-run cannot reproduce. A SECOND RECORD IS OWED WITH OR BEFORE THE PORT AND IT IS A CORRECTION, NOT A NEW ROW: metasalmonpy PARITY.md row 53 still describes the defect as present on both sides and cites an R/package-helpers.R line range for the .ms_replace_create_output() call metasalmon pull request 119 deletes, so once that merges the two registers disagree about which side is defective with nothing in either file saying which is right -- the failure mode both AGENTS.md files name when they say to read the other file rather than trust the one in front of you. The stale docstring in metasalmonpy tests/test_write_datapackage_abort_safety.py, which states the three sidecars are still unlink-then-rewrite, goes with that correction. Owed as a PORT and not a register row, because absence in Python is R-shipped-first lag rather than a deliberate difference: no numbered row is added to knowledge/parity-deviations.md and row 53 is neither renumbered nor duplicated. IT IS NOT B-163 AND NOT B-165: B-163 is the fsync durability gap in the atomic write SET, and records in its own text that the mirror half is not a divergence today because metasalmonpy has zero occurrences of fsync and atomic_io.atomic_write() calls os.replace with no flush either -- that item is the write set never flushing, and this one is Python never reaching the writer at all; B-165 is B-116''s mirror half, write_sdp_semantic_closure().'
