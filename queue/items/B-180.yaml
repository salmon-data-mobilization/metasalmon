retires_when: 'hub_queue.py lint scans knowledge/ prose with the same path regex it already applies to queue item fields, and is demonstrated RED against the three live violations measured on main 2026-09-16 -- knowledge/plans/2026-08-12-ontology-alignment-pass.md:58 and knowledge/plans/2026-09-04-salmon-science-foundry-concrete-plan.md:1958, each a tilde-rooted path inside a command, and knowledge/plans/2026-06-24-alice-assmar-metasalmon-report.md:236, a literal temporary-directory path passed as a --body-file argument. TWO THINGS THE ITEM MUST SETTLE BEFORE THE GUARD IS WRITTEN, and a naive regex gets both wrong. FIRST, WHAT COUNTS: a tilde is not literally an absolute path, and two of the three sit inside commands a human would run rather than naming repository files, so only the third is the case the rule is plainly about -- name the case, which is a path that makes a card unreadable in somebody else''s checkout, and demonstrate the guard red against that rather than against every tilde. SECOND, CITATION: this item was itself refused by lint when first written, for quoting the third violation''s path verbatim in this very field. That is the guard firing on a card whose only offence is describing the defect, and a rule over prose that cannot tell a cited path from a used one turns every card documenting a violation into one -- which is how a guard stops being read. The regex and an absolute-path problem class already exist in scripts/hub_queue.py and stop at the queue boundary, while AGENTS.md writes the rule about knowledge/. Found 2026-09-16 while filing B-179; nearest existing item B-137 is locale-dependent tests and unrelated.'
