retires_when: 'THIS IS A RULING AND NOT AN IMPLEMENTATION. An *_iri column hand-added to tables.csv is swept by the review-marker collector and NOT by review_metadata()''s scan, which reaches schema-declared fields only, because every row it prints has to be a runnable set_sdp_*() call. Measured 2026-09-16 on the metasalmonpy branch: scan empty, validator refuses -- the same shape as B-182 one case narrower, and pinned there by test_an_undeclared_iri_column_is_still_missed rather than closed. Closing it means either printing a call that cannot be run or letting a setter write an undeclared field, so it is a decision about the printed-call contract rather than about any predicate. Brett rules; the item retires when the ruling is in knowledge/questions.md and both implementations match it. BOTH LANGUAGES ARE IDENTICAL HERE, so this is a port and not a parity-deviations row. THIS IS THE RESIDUAL OF B-174 AND NOT A SIBLING OF IT, which is why it is blocked on it: B-174 closes the case where the scan misses a REVIEW-marked value in a field the schema declares, and this is what is left over afterwards -- a field the schema does not declare, which the scan cannot reach BY DESIGN rather than by oversight, because every row it prints has to be a runnable set_sdp_*() call. Whoever takes B-174 will meet this fork and must not quietly widen the scan to swallow it; metasalmonpy hit it and pinned the residual in test_an_undeclared_iri_column_is_still_missed rather than closing it.'
