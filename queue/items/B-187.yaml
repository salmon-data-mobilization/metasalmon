retires_when: 'scripts/hub refuses, or warns by name, when the checkout it is reading the queue from is behind the remote default branch -- demonstrated RED by running claim against an item that exists on origin/main and not in the working tree, and showing the message name staleness rather than absence. MEASURED 2026-09-16: the primary checkout at the dispatch path sat 67 commits behind origin/main on a session branch, carrying a scripts/hub 19 lines old and a queue/items/ missing every item filed that night. HUB.md and the dispatch brief both send agents there for read-only hub commands, so four agents were dispatched with claim commands against it; for two of them the item file did not exist in that tree at all. THE FAILURE IS THE MESSAGE, NOT THE REFUSAL: claim answers "no such queue item" for an item that does exist, which is a true statement about the working tree and a false one about the queue, and an agent that believes it reports the item as missing rather than the checkout as stale. hub list is worse, because it succeeds -- it renders a stale queue with no indication that it is one. Same family as B-173 and B-186: a wrong answer that no check can see. Note what is NOT the fix: telling agents to work from a worktree off origin/main is already the rule in HUB.md section Isolation, and one agent did exactly that unprompted; the gap is that the client cannot tell a reader when the tree it just read is not the queue. Cheapest honest fix is to compare HEAD against the remote default branch once per invocation and say so; the stricter one refuses a claim outright. Whichever is chosen, the message names staleness, the distance, and the branch. THE FIX CANNOT LIVE ONLY IN THE CLIENT, and this is the part to get right: a checkout stale enough to exhibit the defect has a scripts/hub too old to contain the check, so a client-side comparison protects only checkouts that have already received it and the observed case -- a tree 67 commits behind, predating the fix -- keeps answering no such queue item exactly as before. That is a bootstrap failure and not a detail: the retirement condition is therefore demonstrated RED FROM A CHECKOUT THAT PREDATES THE FIX, which is the only demonstration that means anything here. Closing it needs something independently current rather than checkout-local -- a dispatch-time check run before the checkout-local client is invoked, or a refresh enforced at that point -- and whichever is chosen, the client-side comparison is still worth having for every checkout new enough to run it.'
