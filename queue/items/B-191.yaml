retires_when: 'metasalmonpy''s tests import the package by a route that does not depend on the checkout directory''s NAME, so a clone or worktree at any path collects and passes -- demonstrated RED from a directory deliberately named something else. MEASURED BY THE B-165 RUN 2026-09-16 on clean main under pytest 8: 908 collection errors against 907 passes, flipping on the directory name alone. THE HUB PROTOCOL GUARANTEES THE BREAKING NAME: HUB.md keys an agent worktree as <owner>-<repo>-<item>, so every metasalmonpy worktree is named salmon-data-mobilization- metasalmonpy-B-nnn and none of them collects. THREE AGENTS HIT IT INDEPENDENTLY IN ONE NIGHT -- B-124, B-125 and B-165 each nested a second directory named metasalmonpy inside their worktree to get a suite to run, none of them knowing the others had. That is the measure of the cost: a workaround rediscovered three times is a defect with an interest rate. CI IS GREEN ONLY BY COINCIDENCE, because actions/checkout happens to check out into a directory named for the repository, so nothing in the pipeline will ever report this. NOT REPRODUCED BY THE ORCHESTRATOR: this container has no pandas, so the import fails before collection is reached, and the 908/907 figures are the B-165 run''s measurement rather than an independent one -- re-measure before fixing. THE FIX IS THE IMPORT ROUTE IN METASALMONPY AND NOTHING ELSE. Until 2026-09-16 this condition ended by offering the HUB.md worktree key as an equally good alternative, and a Codex review of metasalmon pull request 134 removed it for two reasons that both hold. It does not satisfy the opening clause: renaming the key makes hub-created checkouts collect while leaving the suite dependent on its directory name, so a clone at any other path still fails and the item would retire with its own stated condition false. And it is not this claim''s to take: the repo field here is metasalmonpy, HUB.md lives in metasalmon, and changing HUB.md is reserved to Brett by class 7 of Which pull requests need Brett, so an implementer was being offered something it is not permitted to do. The hub worktree key stays named above as evidence of how the defect is reached, never as a place to fix it.'
