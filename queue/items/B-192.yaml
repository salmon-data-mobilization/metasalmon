retires_when: 'vignettes/post-review-package-publication.Rmd describes the review-target set independently rather than as the measurement set plus each table''s observation_unit_iri, and says what the ledger gate does to a row added for a code-resolved procedure. MEASURED BY THE B-165 RUN 2026-09-16, both halves: neither implementation''s canonical-review-target builder references the used-procedure resolver at all -- zero occurrences of used_procedures in .ms_eml_canonical_review_targets() and in Python''s _canonical_review_targets -- while the canonical MEASUREMENT set does call it; and the ledger reader enforces an EXACT set, collecting any key outside the canonical targets as unexpected and refusing the ledger. So the sentence does not merely describe a redundant row: a reader who follows it adds a target for a procedure and their package STOPS VALIDATING, which is the opposite of what the vignette is for. The two directions both need saying -- an observation_unit_iri is a review target and not a vocabulary term, and a code-resolved sosa:usedProcedure is a vocabulary term and not a review target, because it comes from the data rather than from a metadata field. THE PYTHON TWIN IS ALREADY FIXED: metasalmonpy pull request 31 corrected guides/semantic-review.qmd, whose prose was transcribed FROM this vignette, so this is the source of that defect rather than its mirror. Owed as a port and not a parity-deviations row.'
