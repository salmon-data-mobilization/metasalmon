retires_when: 'THIS IS A RULING FIRST AND A CHANGE SECOND, AND IT COVERS BOTH REPOSITORIES. Measured by the B-165 run 2026-09-16 and identical on both sides: write_eml_from_sdp() aborts when a package carries both eml-mapping.yml and eml-mapping.yaml -- the conflict its default-path helper exists to detect -- while the closure producer hard-codes the .yml path instead of routing through that helper, so it writes happily to the file the writer would have refused the package over. Both producers'' output is byte-identical in that case, so the two implementations agree; what they agree on is answering a question two different ways inside one package. WHY IT IS BRETT''S: making the Python producer raise where the R producer does not would be a deliberate divergence requiring a parity-register row, and a port may not open one -- so the B-165 agent measured it, declined to fix it, and filed it rather than choosing. RECOMMENDED SHAPE, if he agrees: one cross-repo change routing BOTH closure producers through their shared default-mapping-path helper, so the conflict is detected once and in one place, rather than a register row recording that the two disagree. Retires when both producers route through that helper and a test in each repository pins the both-files case, OR a logged ruling in knowledge/questions.md says the producers deliberately do not check and why.'
