retires_when: 'The test at tests/testthat/test-knb-publication.R:1124 makes NO network call at all, demonstrated by running it with network access removed and seeing it PASS rather than skip, and every other test in that file that reaches a network service is either made offline the same way or, where the service is genuinely the thing under test, guarded with skip_if_offline() -- the sweep is part of the condition, because fixing the one instance that fired is not a fix for the class. THE REMEDY IS NO CALL RATHER THAN A SKIP, and the first version of this item got that wrong: it asked for a skip, which under an outage throws away the assertion that both nodes are checked, and AGENTS.md warns that a green offline run is not full coverage -- a skip REDUCES coverage where removing the call keeps it. The call is removable here because it is not load-bearing: the test already builds member_node locally with methods::new("MNode") and @identifier, .ms_knb_lookup_node_system_metadata() is mocked, and coordinating_node is used for exactly two things, the cn slot of the D1Client and coordinating_node@identifier in the final expect_identical, so a CNode built the same local way serves both. Reach for skip_if_offline() only where a test genuinely needs the live service -- AND NOT ON ITS OWN, because it is not sufficient for the failure this item is about. B-132''s card already measured why: skip_if_offline() proves only that the HOST RESOLVES, not that the request completes, and the outage that produced this item was a 503 from a host that resolved fine. A test left guarded by skip_if_offline() alone therefore still reds CI during exactly the outage the sweep is meant to survive. So where the live service is genuinely under test, the guard is skip-on-OUTAGE, and the distinction from skip-on-any-failure is load-bearing: the request is attempted; a transport error, a 5xx, or a throttling status the test names explicitly (429) skips the test, because those are the third party being unavailable; every other non-success status FAILS, because a 400 from a malformed request, a 401 or 403 from lost credentials and a 404 from a moved endpoint are regressions in this package and skipping them is how a guard written against an outage starts hiding the defects it was never meant to cover. The skip message carries the status, which makes the skip legible but does not preserve the assertion -- that is why the 4xx side has to fail rather than skip with a note. Where the service is not under test -- the case at test-knb-publication.R:1124 -- the remedy is still to remove the call. MEASURED 2026-09-16 on metasalmon pull request 137, whose whole diff was one queue item and one backlog section, both build-excluded by .Rbuildignore and reachable by no test: `check` went RED with `Error accessing https://cn.dataone.org/cn: Server error: (503) Service Unavailable` from `dataone::CNode("PROD")`. CONFIRMED NOT THE PULL REQUEST''S three ways: the diff touches nothing R runs, `check` was green on the base commit a592c23, and a re-run of the identical commit went green minutes later when the service recovered -- same code, same sha, different third party. THE GUARD THAT IS MISSING IS SPECIFIC: the test calls skip_if_not_installed("dataone"), which checks that the PACKAGE is present and never that the SERVICE is reachable, and no test in that file calls skip_if_offline(). THE BLAST RADIUS IS THE POINT AND IS NOT LOCAL, BUT IT IS NARROWER THAN THIS ITEM FIRST CLAIMED: while DataONE is down, every `check` run that EXECUTES fails regardless of its diff -- every new pull request, every push to an open one, and every re-run -- and each looks like its author''s fault until somebody reads the log, while the natural response, re-run it, is the habit that makes a real failure invisible. It is NOT true that already-green checks turn red: .github/workflows/R-CMD-check.yaml:3-7 triggers on pull_request and on push to main and carries NO schedule, so nothing re-runs a completed check on an open pull request. The first version of this item said every open pull request goes red simultaneously, which overstated the evidence; on a busy merge day the accurate claim still reaches most of them, and the diff-independence is what makes it expensive. AGENTS.md already warns that a green OFFLINE run is not full coverage; this is the inverse and more expensive, a test that errors instead of skipping when a third party is down. B-132 records the same shape for the live upstream SDP bundle fetch, so this is a second instance in a different file and the sweep clause above exists because there may be a third.'
