retires_when: 'metasalmonpy agrees with the SDP profile about temporal_start and temporal_end, in whichever direction Q-51 is ruled, AND a test pins the agreement rather than the two files pinning only each other. THE ITEM IS DELIBERATELY RULING-AGNOSTIC and must not be read as predicting the outcome: read the ruling as recorded in smn-data-pkg, not this file. UNDER (a), widen the pattern: re-vendor the mirror''s copy of the profile''s dataset schema from the ruled upstream, and add a test that the descriptor instant metasalmonpy writes SATISFIES the vendored constraints.pattern. UNDER (b1) refuse or (b2) coerce, leave the schema alone and change the writer instead, and pin the new behaviour -- an error for b1, the truncated date for b2. EITHER WAY THE TEST IS THE POINT AND IS THE PART THAT WAS MISSING: nothing on either side compares a written package''s temporal fields to the profile''s own pattern, which is exactly why this went unseen through two implementations and four reviews, so a fix that changes behaviour without adding that comparison leaves the hole it came through. UNDER (c) THE ITEM RETIRES AS A NO-OP, and it needs its own clause because otherwise a ruling of leave-it would leave this card permanently unsatisfiable: nothing in the implementation changes, and what retires it is the accepted disagreement being RECORDED. THIS HALF RECORDS IT IN METASALMONPY, as one dated note in that repository''s own PARITY.md -- the mirror of knowledge/parity-deviations.md, which the mirror contract requires to carry the same record. The Q51 entry and the metasalmon-side note are B-198''s half, because both of those files live in metasalmon and queue/README.md requires a retirement condition to be satisfiable inside the repository the repo field names; the two register copies are written by the same ruling, the same way B-115 and B-145 split a register write. Two writers deliberately disagreeing with a spec they both vendor is a standing property someone will otherwise rediscover as a defect. A note rather than a new register row: it is one accepted gap against a specification, not a deviation between the two implementations, which is what the numbered rows count. Q-51 carries the measurement and the options; this item is its metasalmonpy half and B-198 is the metasalmon half, split because queue/README.md requires a retirement condition to be satisfiable inside the repository the repo field names. BLOCKED ON B-145 AS WELL AS Q-51, and the reason is specific to option (a): the (a) test asserts that the descriptor instant metasalmonpy WRITES satisfies the vendored pattern, and that instant is B-145''s output. Widening the pattern does not by itself make metasalmonpy''s descriptor legal, because the form it writes is the one B-145 exists to change, so without that blocker this item could retire green under (a) while the Python side still writes a string the profile rejects. See queue/items/B-145.yaml for whether it has landed. Unblocks when both retire.'
