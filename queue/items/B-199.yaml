retires_when: 'metasalmonpy agrees with the SDP profile about temporal_start and temporal_end, in whichever direction Q-51 is ruled, AND a test pins the agreement rather than the two files pinning only each other. THE ITEM IS DELIBERATELY RULING-AGNOSTIC and must not be read as predicting the outcome: read the ruling as recorded in smn-data-pkg, not this file. UNDER (a), widen the pattern: re-vendor the mirror''s copy of the profile''s dataset schema from the ruled upstream, and add a test that the descriptor instant metasalmonpy writes SATISFIES the vendored constraints.pattern. UNDER (b1) refuse or (b2) coerce, leave the schema alone and change the writer instead, and pin the new behaviour -- an error for b1, the truncated date for b2. EITHER WAY THE TEST IS THE POINT AND IS THE PART THAT WAS MISSING: nothing on either side compares a written package''s temporal fields to the profile''s own pattern, which is exactly why this went unseen through two implementations and four reviews, so a fix that changes behaviour without adding that comparison leaves the hole it came through. UNDER (c) THE ITEM RETIRES AS A NO-OP, and it needs its own clause because otherwise a ruling of leave-it would leave this card permanently unsatisfiable: nothing in the implementation changes, and what retires it is the accepted disagreement between the writer and the profile being RECORDED where the ruling is recorded -- the Q51 entry in knowledge/questions.md, plus one dated note in knowledge/parity-deviations.md''s port section, because two writers deliberately disagreeing with a spec they both vendor is a standing property someone will otherwise rediscover as a defect. A note rather than a new register row: it is one accepted gap against a specification, not a deviation between the two implementations, which is what the numbered rows count. Q-51 carries the measurement and the options; this item is its metasalmonpy half and B-198 is the metasalmon half, split because queue/README.md requires a retirement condition to be satisfiable inside the repository the repo field names. Unblocks when Q-51 retires.'
