retires_when: 'A script under scripts/ (check-changelog-window.py, beside check-parity-registers.py) fails when any line under a released version heading in NEWS.md is absent from that section as it stood at the version''s bump commit and was added by a commit that is not an ancestor of that bump commit (git merge-base --is-ancestor), where the bump commit is the vX.Y.Z tag when it exists and otherwise the first commit on main whose DESCRIPTION reads that Version; it runs in continuous integration on every pull request and is named as the pre-tag step in AGENTS.md''s Releases section; it passes over main as it stands; and it has a recorded RED demonstration: a fixture repository the test builds -- a bump commit setting Version, then a commit adding a bullet under that version''s heading -- turns it red, and the same bullet under the metasalmon (development version) heading turns it green. THIS IS THE MECHANICAL FORM OF THE RULE Brett accepted on 2026-09-16 ("Regarding the agents.md change log entry. I will take your recommendation."), now in AGENTS.md''s Releases section: a change merged after the commit that bumped the version and before the tag is filed under the development heading, never under the version it did not ship in, and the tag stays on the bump commit. THE INSTANCE, on metasalmonpy main: the bump merge is 67fb486 (#33, B-153), B-144''s merge b939fd9 (#32) is its descendant (git merge-base --is-ancestor 67fb486 b939fd9 holds), and B-144''s CHANGELOG.md entry was filed under ## 0.5.0 -- while B-124''s 1e9245c (#29), later still, went under ## Unreleased correctly. Two agents read the same silence in opposite directions inside one day, which is why a sentence alone is not the fix. A REPLAY of that instance against a metasalmonpy checkout at 1e9245c (CHANGELOG.md lines 257-297 under ## 0.5.0, added by b939fd9) is the real-history confirmation, reached the way check-parity-registers.py reaches its twin, through METASALMONPY_PATH; it is NOT part of this condition, because a condition satisfiable only with a sibling checkout is the shape queue/README.md forbids, and it belongs to B-201, the metasalmonpy half and this item''s pair, which names this item. WHAT THE CHECK DOES NOT COVER, to be stated in its own docstring: a line changed in place under a released heading is not a finding, so a typo fix to a shipped entry stays possible, and a rewrite that turns a shipped bullet into a description of new work passes -- reading catches that, the check does not. P3 because the failure corrupts no data and no behaviour and the window is bounded, bump to tag; but the release record is what the mirror contract''s parity claim is read from, one real instance happened within a minute of the window opening (67fb486 at 12:55:23Z, b939fd9 at 12:55:44Z), and it is silent until somebody diffs a tag against its changelog. The window is real on every release because the tag is a separate act from the bump and is Brett''s.'
