retires_when: 'IN METASALMONPY: AGENTS.md''s Releases section (line 155 at 1e9245c) carries the rule its mirror gained on 2026-09-16 -- a change merged after the commit that bumped the version and before that version''s tag exists is filed under ## Unreleased, never under the version it did not ship in, and the tag stays on the bump commit (Brett, 2026-09-16: "Regarding the agents.md change log entry. I will take your recommendation.") -- and a script under scripts/ enforces it over CHANGELOG.md the way B-200, the metasalmon half and this item''s pair, enforces it over NEWS.md: for each released heading whose bump commit main carries (the vX.Y.Z tag when it exists, otherwise the first commit on main whose pyproject.toml version reads it), a line under the heading that is absent from that section at the bump commit and was added by a commit that is not an ancestor of the bump is a finding; it runs in continuous integration, is named as the pre-tag step in Releases, and passes over main as it stands. ITS RED DEMONSTRATION IS ITS OWN HISTORY, which is why the pair is filed rather than folded into B-200: at 1e9245c, CHANGELOG.md lines 257-297 sit under ## 0.5.0 and were added by b939fd9, the merge of #32 (B-144), which is a descendant of the bump merge 67fb486 (#33, B-153; git merge-base --is-ancestor 67fb486 b939fd9 holds) and therefore not an ancestor of it, while 1e9245c (#29, B-124), later still, went under ## Unreleased correctly -- so the check run at 1e9245c reports exactly one finding. metasalmonpy pull request 35 moves that entry, verbatim, to ## Unreleased; once it merges the RED is run at a checkout of 1e9245c and the check is green on main. The v0.5.0 tag goes on 67fb486 and is Brett''s to make; nothing here tags. Match B-200''s scope statement: a line changed in place is not a finding, and the docstring says so. P3 for the reason B-200 gives.'
