retires_when: 'IN METASALMONPY: AGENTS.md''s Releases section (line 155 at 1e9245c) carries the rule its mirror gained on 2026-09-16 -- a change merged after the commit that bumped the version and before that version''s tag exists is filed under ## Unreleased, never under the version it did not ship in, and the tag stays on the bump commit (Brett, 2026-09-16: "Regarding the agents.md change log entry. I will take your recommendation.") -- and a script under scripts/ enforces it over CHANGELOG.md the way B-200, the metasalmon half and this item''s pair, enforces it over NEWS.md: for each released heading whose bump commit main carries (the vX.Y.Z tag when it exists, otherwise the first commit on main whose pyproject.toml version reads it), a line under the heading that is absent from that section at the bump commit and was added by a commit that is not an ancestor of the bump is a finding; it runs in continuous integration, is named as the pre-tag step in Releases, and passes over main as it stands. ITS RED DEMONSTRATION IS ITS OWN HISTORY, which is why the pair is filed rather than folded into B-200: at 1e9245c, CHANGELOG.md lines 257-297 sit under ## 0.5.0 and were added by b939fd9, the merge of #32 (B-144), which is a descendant of the bump merge 67fb486 (#33, B-153; git merge-base --is-ancestor 67fb486 b939fd9 holds) and therefore not an ancestor of it, while 1e9245c (#29, B-124), later still, went under ## Unreleased correctly -- so the check run at 1e9245c reports exactly one finding. metasalmonpy pull request 35 moved that entry, verbatim, to ## Unreleased (merged 2026-09-16 as 3f8349a, 15:47Z); the RED is run at a checkout of 1e9245c, and the check is green on main from 3f8349a on, where git diff 67fb486 origin/main -- CHANGELOG.md has a single hunk, above the ## 0.5.0 heading at line 97, so the 0.5.0 section matches the bump merge. The v0.5.0 tag is on 67fb486, made on 2026-09-24 by metasalmonpy''s Release workflow at Brett''s request; nothing here tags. Match B-200''s scope statement and its exemption: a line changed in place is not a finding, a marked dated correction to a shipped entry is not a finding, and the docstring says so. P3 for the reason B-200 gives. CORRECTED AND RULED 2026-09-25. B-200''s worker replayed the check against metasalmonpy and found two things this condition did not say. At 1e9245c it reports B-144''s lines and also 24 lines under the tagged ## 0.2.1, added by 10d0616, a fix merged in the same pull request (#10, merged as 3fdd323) after the release commit f1d9b0e that the v0.2.1 tag names. Those 24 lines are still on main, so the check is not green from 3f8349a, and it reports two findings at 1e9245c, not one. Brett ruled (decisions page, item 6, taking the recommendation): a dated correction appended to the 0.2.1 entry says the fix is not in the v0.2.1 tag, the check exempts that one commit with the reason written beside the exemption, and the tag is not moved. With both in place, the check passes over main as it stands.'
