retires_when: 'A rule in scripts/hub_queue.py lint (beside validate_generated_blocks, which already reads the queue) -- or in scripts/check-parity-registers.py if that script learns to read the queue, with the workpad saying which and why -- fails when an item named in the port section of knowledge/parity-deviations.md (the section headed "What metasalmon 0.5.0 owes the mirror") or in the release-index passage of knowledge/roadmap.md that lists the mirror debts is in state done while that prose still describes its port as owed or queued. SCOPE, because the obvious phrasing over-catches: the rule reads only the ids those two passages name AS OWED PORTS -- the debt itself -- and not the ids they name as blockers or as R halves (B-49, B-112, B-115, B-116, B-126 and B-153 are all done and all named in that way, and none is owed a closure paragraph), and the roadmap marker it looks for is the bold "landed <date> as metasalmonpy #N" form those entries already use, not the bare word landed, which appears throughout the file for unrelated things. So: every id named as an owed port whose item is done carries a closure paragraph ("This one is closed.") in the register AND that marker in the roadmap, and every id named as an owed port whose item is not done carries neither. The rule has a recorded RED demonstration on a replay of the B-124 shape -- the queue as it stands against the register as it stood at a592c23, whose line 190 read "Queued as B-124, blocked by B-49" with no closure paragraph, and against the roadmap as it stood there, whose line 466 listed validation with no landed marker -- and it passes over the queue, register and roadmap AS THIS PULL REQUEST LEAVES THEM -- which is not the same as the state it was written against, and the difference is the fifth instance below: the rule was red on main when this item was drafted, and the same change that files it writes B-165''s closure paragraph and landed marker so that it is not. A check that arrives red teaches its first reader to weaken it, which is the failure B-200''s card names. FIVE INSTANCES ON 2026-09-16, which is the evidence that prose cannot hold this: a written state is a claim about a tree that moves. B-115 was written review on pull request 135''s branch (85eccc5, 04:51Z), metasalmon #118 merged while that branch was open, and it was corrected to done on the same branch (690d53c) before the branch merged. B-144: review, pushed directly to main in 5a86fd6 (05:14Z, "handed off, metasalmonpy #32 open"), was true until #32 merged as b939fd9 at 12:55Z; a592c23 corrected it at 13:08Z. B-153: pull request 136''s branch first wrote review ("B-153 moves to state review", preserved in a592c23''s squashed message), #33 merged as 67fb486 at 12:55Z before the branch did at 13:08Z, and the merged result reads done. B-124: set done on pull request 138''s branch while knowledge/parity-deviations.md:190 still read "Queued as B-124, blocked by B-49" and knowledge/roadmap.md:466 still listed validation without a landed marker; a Codex review of #138 caught it, and e9d7dc4''s message records that this was the fourth time a sentence about owed work outlived the work. B-165, THE FIFTH, was found by the adversarial review of this item''s own branch and is the one that would have made the check red on arrival: metasalmonpy #31 merged at 04:18Z (999fa19) and the card was set done at 04:21Z, while knowledge/parity-deviations.md went on reading "Queued as B-165, blocked by B-116" and knowledge/roadmap.md "queued as B-165" for the twelve hours until this branch corrected both. That it was the item ABOUT this failure whose own branch carried a live instance of it is the strongest evidence available that the fix has to be mechanical. The register''s own rule, stated at the third (knowledge/parity-deviations.md:237-238, the note under B-125''s closure) and restated at the fourth (:211-212) -- "a catch-up window changes in both places in the same change" -- was broken at the fourth by an agent who had read it. WHY MECHANICAL, AND P2: the register is one of the three copies of the single fact the mirror contract turns on, a stale "owed" sends the next agent to port work that has landed or to claim a window is open, and five instances in a day, with the rule written down at the third and the fifth landing on this item''s own branch, is the argument that the fix is mechanical or nothing. WHAT IT DOES NOT CHECK, for the docstring: whether the closure paragraph is true. It catches the shape, as check-parity-registers.py does, not the substance.'
