retires_when: 'The worktree-removal check in HUB.md (the revision walk at HUB.md:711-716, git -C "$WT" log HEAD --not --remotes --oneline) verifies against the sha that git ls-remote --heads origin <branch> returns rather than against the local remote-tracking ref, or scripts/hub normalizes the fetch refspec to the full +refs/heads/*:refs/remotes/origin/* form before the walk, with a RED demonstration on a single-branch clone: a clone whose remote.origin.fetch is +refs/heads/main:refs/remotes/origin/main, one commit on a new branch pushed with git push -u, git ls-remote confirming the branch on the remote at that sha, and the check as written printing the commit while the corrected check prints nothing. MEASURED 2026-09-16, twice. In situ, in the metasalmonpy checkout used by the hub in this environment, whose remote.origin.fetch is +refs/heads/main:refs/remotes/origin/main: agent/B-145/a-cbde7679ed732a03 sits on the remote at 7b41e59, identical to the local tip, and the walk prints all six of its commits as unpushed; the agent working there got past it with git fetch origin <branch>:refs/remotes/origin/<branch>, which is a workaround and not a fix. In a scratch repository built for the purpose: a --single-branch clone, an empty commit on a new branch, git push -u origin feature succeeding and ls-remote confirming it, the walk printing that commit, and the workaround fetch clearing it. WHY: --remotes walks the local refs/remotes/ namespace, and git push updates a remote-tracking ref only where a configured fetch refspec maps it, so a single-branch clone never gets refs/remotes/origin/<branch> for anything but main and the check is wrong on every other branch, forever, with no signal that it is. IT FAILS SAFE, which bounds the severity to P3: the worktree is kept rather than lost. But the check is in the policy file every agent reads, it is wrong for a whole class of clone, and the workaround is a fetch every agent rediscovers alone. scripts/hub does not carry the walk (no --remotes under scripts/ on 2026-09-16), so the edit is to HUB.md, which is Brett''s to merge under class 7 of "Which pull requests need Brett"; the item is claimable because the edit and the demonstration can be prepared unattended and handed back as a pull request. Third defect in that one paragraph in two days: the stash clause and the --branches walk were removed on 2026-09-16, and the paragraph already warns that a fix removing one instance is not a fix for the defect -- this is the instance it did not see. Ask what else is in the family before writing that the rest is sound.'
