retires_when: 'The R validator enforces constraints.pattern on metadata fields read from the SDP schema it loads, with a test that a violating value is reported and a conforming one is not. WHICH COPY IT ENFORCES -- the vendored bundle under inst/extdata/schema/frictionless/metadata/ or the remote tag B-198 pins -- IS Q-53''S TO RULE, and recording that ruling updates this condition to name the copy; this sentence said the vendored file until the Codex review of pull request 150 on 7daeea6 found it pre-empting the ruling it waits on. THE FIXTURE MUST INCLUDE A CONFORMING ISO INSTANT, for example 2024-12-31T00:00:00Z, and that is a correction: this condition read "the schema''s own fixture is temporal_start and temporal_end, whose pattern at :82 and :94 is a year or a date, so 1996-01 is reported and 1996 and 1996-01-01 are not", which describes the schema BEFORE B-198 -- the blocker this item now carries. Once B-198 lands, that premise is false by construction: the pattern admits an instant, so a test using only 1996 and 1996-01-01 as its conforming values can pass while the finished validator still REJECTS the instant, which is the single value this whole chain exists to make legal. Raised by the Codex review of pull request 137 on f4c6d43, and it is the sharp edge of adding a dependency: a blocker does not only decide WHEN an item may start, it can falsify what the item says about the world it will start in. Keep a violating value too -- 1996-01 is rejected under the widened pattern as well -- and a parity row or port note as AGENTS.md''s mirror contract requires, in the same pull request. THE MIRROR HALF IS B-205, which names this item. NOT THE SAME ITEM AS THE WRITER-SIDE PIN filed the same day on the Q-51 branch, and the boundary is worth stating because the two look alike and are not: that pair re-vendors the ruled dataset schema and asserts that the instant the DESCRIPTOR WRITES satisfies the vendored pattern, one value checked by a test; this pair makes the VALIDATOR READ constraints.pattern AT ALL, for every metadata field that carries one. THAT PAIR IS B-198 (metasalmon) AND B-199 (metasalmonpy), and THIS ITEM IS BLOCKED ON ITS OWN HALF -- which is a correction rather than an original reading. This card said "Either can land without the other and each leaves a different hole: the writer pinned against a pattern nothing enforces, or an enforcer with nothing pinning the writer", and the SECOND of those two holes is not a hole, it is a REGRESSION. Raised by the Codex review of metasalmon pull request 137 on 9b625a2 and verified: schema-then-validator is harmless, because a widened pattern nobody reads changes nothing; VALIDATOR-THEN-SCHEMA REJECTS VALID PACKAGES, because this item would begin enforcing whatever pattern the vendored copy holds AT THAT MOMENT, which on 2026-09-16 at inst/extdata/schema/frictionless/metadata/dataset.schema.json is still the pre-ruling ^(\d{4}|\d{4}-\d{2}-\d{2})$, while B-115 has ALREADY landed the instant spelling on the descriptor path -- so validate_salmon_datapackage() would refuse a package this package itself just wrote, for carrying the instant Q-51 ruled legal. Hence blocked_by, which a claim can act on, rather than a sentence, which it cannot. ALSO BLOCKED ON B-206 -- THE R EMISSION HALF OF B-161''s RULING, NOT THE RULING ITSELF, BECAUSE B-161 COULD NOT RETIRE INSIDE THIS REPOSITORY AND STRANDED THIS ITEM BEHIND UNOWNED METASALMONPY WORK (Codex, pull request 137 on ad00a37; blockers_of at scripts/hub:937-946 tests each blocker for state: done and does not walk transitively, so B-206 carrying B-161 is what sequences the chain). THE BLOCKER ABOVE GUARDS ORDER, NOT DIRECTION, and the emission half carries the rest: B-161 may rule either that the CSV side pads or that the ecosystem accepts a platform-dependent instant year, and under the second the writer''s bytes would sit OUTSIDE the profile pattern even after its emission half retires. So the emission half''s condition requires the emitted bytes to satisfy the pattern in force, and B-161''s condition is an INVARIANT that carries the rest: the ruling is not complete until the queue can be walked from it to a state where all three layers agree, every step filed as an item in the repository that can finish it and blocked in order. READ THE WALK OFF B-161 RATHER THAN FROM HERE, and do not reconstruct it from a summary -- this sentence used to end "which surfaces a profile widening in smn-data-pkg as a prerequisite, a new item this one would then also wait on", which was incomplete in the direction that matters: widening the profile upstream does not re-vendor it or advance the remote pin in either implementation, so this validator would still have enforced the pre-ruling pattern. Raised by the Codex review of pull request 137 on 6849fe0, which found that a blocker satisfying every stated condition could still deliver the regression it was added to prevent. THE UNDERLYING REGRESSION IS THE SAME REGRESSION REACHED BY A DIFFERENT ROUTE AND IS THE ONE B-198 DELIBERATELY DOES NOT COVER. B-198''s card reasons that the pre-1000 case is B-161''s and that holding a mechanical re-vendor hostage to an unruled rendering question would leave the ruled change unshipped -- correct for VENDORING, because nothing enforces a pattern that is merely present, and exactly wrong for ENFORCEMENT. MEASURED 2026-09-16 on this machine, R 4.3.3: .ms_iso_date_columns() leaves a POSIXct alone by design, readr renders it, and readr::write_csv() writes as.POSIXct("0999-06-05 13:45:30", tz = "UTC") as 999-06-05T13:45:30Z -- instant form, UNPADDED year -- which the widened pattern REJECTS, while 2024-12-31T23:59:59Z from the same frame passes. So with B-198 done and B-161 unruled, this item would make validate_salmon_datapackage() refuse a package metasalmon just wrote from a caller-supplied pre-1000 POSIXct: the identical regression the B-198 edge exists to prevent, for a value the writer produces rather than one a user typed. Raised by the Codex review of pull request 137 on 47aaf06. THE COST IS REAL AND IS STATED RATHER THAN HIDDEN: B-161 is claimable: false because it waits on a ruling of Brett''s, so this edge gates a P2 validator item on a decision, and it RAISES B-161''S PRIORITY -- it was filed as a deferred rendering question reachable only from a caller-supplied instant, and it is now a prerequisite on this chain. Escalated as such rather than worked around, because the alternative is an exemption for pre-1000 instants inside the validator, which is a guard designed around an unruled question and the exact shape AGENTS.md warns conceals the failure it was never written for. THE REMOTE PIN IS THE SAME TRAP FROM THE OTHER SIDE and is why B-198/B-199 are not finished by re-vendoring alone: enforcement reads whatever .ms_load_sdp_schema() returned, and under the default source = auto that is the REMOTE sdp-0.3.0 tag before the vendored copy ever loads. Each half is finishable in its own repository. MEASURED 2026-09-16 at e9d7dc4: .ms_field_from_frictionless() (R/schema-helpers.R:387) reads constraints$required at :389 and constraints$enum at :401-402 and nothing else off constraints; the only other constraints reader under R/, R/package-helpers.R:1539-1540, reads required too; grep for constraints$pattern or [["pattern"]] finds no consumer under R/. The vendored dataset.schema.json carries a pattern on temporal_start (:82) and temporal_end (:94), which is how a typed instant reached the descriptor and passed local validation while the profile at that time forbade it (the history behind Q-51; what Q-51 rules is not stated here and does not change this item, because whatever the pattern says, nothing reads it -- if a ruling widens the pattern, the test fixture changes and the item does not). THE SPEC''S OWN VALIDATOR ENFORCES IT: smn-data-pkg''s scripts/validate_package.py:221-222 at bb71c8b rejects a value re.fullmatch fails, and tests/test_validate_package.py:73-79 pins it with a partial date (1996-01) and the message "temporal_start must match pattern". So the gap is in the two implementations, not the spec. P2 because it is silent conformance debt: a green validate_salmon_datapackage() is read as "conforms to the profile", and here it does not, for a rule stated in the very file this package vendors.'
