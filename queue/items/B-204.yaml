retires_when: 'The R validator enforces constraints.pattern on metadata fields read from the vendored Frictionless schema (inst/extdata/schema/frictionless/metadata/dataset.schema.json), with a test that a violating value is reported and a conforming one is not -- the schema''s own fixture is temporal_start and temporal_end, whose pattern at :82 and :94 is a year or a date, so 1996-01 is reported and 1996 and 1996-01-01 are not -- and a parity row or port note as AGENTS.md''s mirror contract requires, in the same pull request. THE MIRROR HALF IS B-205, which names this item. NOT THE SAME ITEM AS THE WRITER-SIDE PIN filed the same day on the Q-51 branch, and the boundary is worth stating because the two look alike and are not: that pair re-vendors the ruled dataset schema and asserts that the instant the DESCRIPTOR WRITES satisfies the vendored pattern, one value checked by a test; this pair makes the VALIDATOR READ constraints.pattern AT ALL, for every metadata field that carries one. Either can land without the other and each leaves a different hole: the writer pinned against a pattern nothing enforces, or an enforcer with nothing pinning the writer. Those two ids are deliberately not named here because they are not on main when this is written; the cross-reference is written from the side that merges second. Each half is finishable in its own repository. MEASURED 2026-09-16 at e9d7dc4: .ms_field_from_frictionless() (R/schema-helpers.R:387) reads constraints$required at :389 and constraints$enum at :401-402 and nothing else off constraints; the only other constraints reader under R/, R/package-helpers.R:1539-1540, reads required too; grep for constraints$pattern or [["pattern"]] finds no consumer under R/. The vendored dataset.schema.json carries a pattern on temporal_start (:82) and temporal_end (:94), which is how a typed instant reached the descriptor and passed local validation while the profile at that time forbade it (the history behind Q-51; what Q-51 rules is not stated here and does not change this item, because whatever the pattern says, nothing reads it -- if a ruling widens the pattern, the test fixture changes and the item does not). THE SPEC''S OWN VALIDATOR ENFORCES IT: smn-data-pkg''s scripts/validate_package.py:221-222 at bb71c8b rejects a value re.fullmatch fails, and tests/test_validate_package.py:73-79 pins it with a partial date (1996-01) and the message "temporal_start must match pattern". So the gap is in the two implementations, not the spec. P2 because it is silent conformance debt: a green validate_salmon_datapackage() is read as "conforms to the profile", and here it does not, for a rule stated in the very file this package vendors.'
