retires_when: 'IN METASALMONPY, validate_salmon_datapackage() enforces constraints.pattern on metadata fields read from the vendored Frictionless schema, with a test that a violating value is reported and a conforming one is not -- the schema''s own fixture is temporal_start and temporal_end, whose pattern is a year or a date, so 1996-01 is reported and 1996 and 1996-01-01 are not -- and a parity row or port note as AGENTS.md''s mirror contract requires, in the same pull request. THE MIRROR HALF IS B-204, which names this item and carries the R measurement. NOT THE SAME ITEM AS THE WRITER-SIDE PIN filed the same day on the Q-51 branch, and the boundary is worth stating because the two look alike and are not: that pair re-vendors the ruled dataset schema and asserts that the instant the DESCRIPTOR WRITES satisfies the vendored pattern, one value checked by a test; this pair makes the VALIDATOR READ constraints.pattern AT ALL, for every metadata field that carries one. Either can land without the other and each leaves a different hole: the writer pinned against a pattern nothing enforces, or an enforcer with nothing pinning the writer. Those two ids are deliberately not named here because they are not on main when this is written; the cross-reference is written from the side that merges second. Whoever takes this should check whether B-204 has landed and match its reporting shape, because two different answers to one violating value would be a divergence this pair exists to avoid. MEASURED 2026-09-16 at 1e9245c: package_io.py:1313-1314 reads constraints["required"] and nothing else off a field''s constraints; the only other reader, sdp_schema.py:595-596, reads required too; sdp_field_setters.py:970-973 copies the block whole without reading a key; and no .py file in the tree reads a "pattern" key (git grep over that commit finds none, single- or double-quoted). The vendored dataset.schema.json carries a pattern on temporal_start and temporal_end, which is how a typed instant reached the descriptor and passed local validation while the profile at that time forbade it (the history behind Q-51; what Q-51 rules is not stated here and does not change this item, because whatever the pattern says, nothing reads it). THE SPEC''S OWN VALIDATOR ENFORCES IT: smn-data-pkg''s scripts/validate_package.py:221-222 at bb71c8b, pinned by tests/test_validate_package.py:73-79. So the gap is in the two implementations, not the spec. P2 for the reason B-204 gives: silent conformance debt in the one call a user reads as "conforms to the profile".'
