retires_when: 'IN METASALMONPY, validate_salmon_datapackage() enforces constraints.pattern on metadata fields read from the vendored Frictionless schema, with a test that a violating value is reported and a conforming one is not. THE FIXTURE MUST INCLUDE A CONFORMING ISO INSTANT, for example 2024-12-31T00:00:00Z, for the reason B-204 gives in full: this condition read "the schema''s own fixture is temporal_start and temporal_end, whose pattern is a year or a date, so 1996-01 is reported and 1996 and 1996-01-01 are not", which describes the schema BEFORE B-199 -- the blocker this item now carries -- so the premise is false by construction once B-199 lands, and a test using only those conforming values can pass while the finished validator still rejects the instant. Keep a violating value too -- 1996-01 is rejected under the widened pattern as well -- and a parity row or port note as AGENTS.md''s mirror contract requires, in the same pull request. THE MIRROR HALF IS B-204, which names this item and carries the R measurement. NOT THE SAME ITEM AS THE WRITER-SIDE PIN filed the same day on the Q-51 branch, and the boundary is worth stating because the two look alike and are not: that pair re-vendors the ruled dataset schema and asserts that the instant the DESCRIPTOR WRITES satisfies the vendored pattern, one value checked by a test; this pair makes the VALIDATOR READ constraints.pattern AT ALL, for every metadata field that carries one. THAT PAIR IS B-198 (metasalmon) AND B-199 (metasalmonpy), and THIS ITEM IS BLOCKED ON ITS OWN HALF -- which is a correction rather than an original reading. This card said "Either can land without the other and each leaves a different hole: the writer pinned against a pattern nothing enforces, or an enforcer with nothing pinning the writer", and the SECOND of those two holes is not a hole, it is a REGRESSION. Raised by the Codex review of metasalmon pull request 137 on 9b625a2 and verified: schema-then-validator is harmless, because a widened pattern nobody reads changes nothing; VALIDATOR-THEN-SCHEMA REJECTS VALID PACKAGES, because this item would begin enforcing whatever pattern the vendored copy holds AT THAT MOMENT, which on 2026-09-16 at inst/extdata/schema/frictionless/metadata/dataset.schema.json is still the pre-ruling ^(\d{4}|\d{4}-\d{2}-\d{2})$, while B-115 has ALREADY landed the instant spelling on the descriptor path -- so validate_salmon_datapackage() would refuse a package this package itself just wrote, for carrying the instant Q-51 ruled legal. Hence blocked_by, which a claim can act on, rather than a sentence, which it cannot. THE PRE-1000 QUESTION IS OPEN HERE TOO AND IS DELIBERATELY NOT A BLOCKER ON THIS CARD, BECAUSE NOBODY HAS MEASURED IT. B-204 waits on the R emission half because readr was measured writing an unpadded 999-06-05T13:45:30Z that the widened pattern rejects; the equivalent for metasalmonpy''s writer was NOT measured, and B-161''s own card says the ruling has to be made for both implementations at once or it creates a parity row instead of closing one. IT HAS SINCE BEEN FOUND, AND METASALMONPY IS AFFECTED: B-145''s card carries the measurement, taken 2026-08-25 on pandas 3.0.5 -- to_csv renders a datetime64[us] column with an UNPADDED year, 999-06-05 13:45:30, the identical defect to R''s readr path. The sentence above said it was unmeasured; it was measured three weeks earlier in a sibling card. So this item takes B-207 as a blocker for the same reason B-204 takes B-206. The principle that held while it WAS unmeasured still holds generally, and is worth keeping now that it no longer applies here: a blocked_by nobody verified is a claim like any other, so the edge was withheld until the measurement was found rather than guessed at. This sentence read "No blocker is recorded here yet on purpose" until the Codex review of pull request 137 on a1fec9e -- obsolete the moment the blocker was added two sentences above it, in the same commit. THE REMOTE PIN IS THE SAME TRAP FROM THE OTHER SIDE and is why B-198/B-199 are not finished by re-vendoring alone: enforcement reads whatever .ms_load_sdp_schema() returned, and under the default source = auto that is the REMOTE sdp-0.3.0 tag before the vendored copy ever loads. Whoever takes this should check whether B-204 has landed and match its reporting shape, because two different answers to one violating value would be a divergence this pair exists to avoid. MEASURED 2026-09-16 at 1e9245c: package_io.py:1313-1314 reads constraints["required"] and nothing else off a field''s constraints; the only other reader, sdp_schema.py:595-596, reads required too; sdp_field_setters.py:970-973 copies the block whole without reading a key; and no .py file in the tree reads a "pattern" key (git grep over that commit finds none, single- or double-quoted). The vendored dataset.schema.json carries a pattern on temporal_start and temporal_end, which is how a typed instant reached the descriptor and passed local validation while the profile at that time forbade it (the history behind Q-51; what Q-51 rules is not stated here and does not change this item, because whatever the pattern says, nothing reads it). THE SPEC''S OWN VALIDATOR ENFORCES IT: smn-data-pkg''s scripts/validate_package.py:221-222 at bb71c8b, pinned by tests/test_validate_package.py:73-79. So the gap is in the two implementations, not the spec. P2 for the reason B-204 gives: silent conformance debt in the one call a user reads as "conforms to the profile".'
