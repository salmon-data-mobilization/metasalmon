retires_when: 'metasalmon''s descriptor path emits the spelling B-161 rules for a pre-1000 instant in metadata/dataset.csv, and a test asserts that a POSIXct whose year is below 1000 survives write then read unchanged. MEASURED 2026-09-16 on this machine, R 4.3.3, as the RED this retires: .ms_iso_date_columns() leaves a POSIXct alone by design (backlog #93 item 1 ruled that, because coercing an instant changes the separator, the zone marker and whether a fractional second survives), readr renders it, and readr::write_csv() writes as.POSIXct("0999-06-05 13:45:30", tz = "UTC") as 999-06-05T13:45:30Z -- instant form with an UNPADDED year, which is not a valid xs:dateTime and which the SDP profile''s widened temporal pattern rejects, while 2024-12-31T23:59:59Z from the same frame passes. IT IS PLATFORM-DEPENDENT: backlog #93 item 1''s table, measured on macOS R 4.5.2, records year 1 rendering as 0001-01-01T00:00:00Z, already correct. Linux is the platform CI runs. WHICH SPELLING IS NOT THIS ITEM''S TO CHOOSE and that is why it is blocked: B-161 holds the ruling, because padding the CSV path means reopening backlog #93 item 1 deliberately and the only alternative is accepting a platform-dependent instant year across the ecosystem. THE EMITTED BYTES MUST ALSO SATISFY THE PROFILE PATTERN IN FORCE, AND THAT IS A SECOND CLAUSE RATHER THAN A RESTATEMENT OF THE FIRST. Raised by the Codex review of metasalmon pull request 137 on 6849fe0, and it closes a hole in the dependency B-204 takes on this item: that edge guards the ORDER of the two, and on its own it does not guard the DIRECTION of the ruling. B-161 keeps two live options, and its card says so -- pad the CSV side, which reopens backlog #93 item 1 deliberately, or accept a platform-dependent instant year across the ecosystem. Under the SECOND, this item could retire by emitting the ruled UNPADDED bytes with a round-trip test that passes, B-204 would unblock, enforcement would switch on, and validate_salmon_datapackage() would reject 999-06-05T13:45:30Z -- the exact regression the edge was added to prevent, reached by satisfying every condition rather than by skipping one. THE FIX IS NOT TO PRE-EMPT THE RULING, because forcing padded bytes here would quietly delete one of Brett''s two options. It is to name the THIRD PARTY the pair had been treating as fixed: the SDP profile''s own pattern, in smn-data-pkg. Three things have to agree before enforcement is safe -- what the writers emit, what the profile admits, and what the validators check -- and B-161 rules only the first. THE BRANCH IS THE RULING''S TO RESOLVE AND THIS CARD DELIBERATELY DOES NOT DESCRIBE IT: B-161''s condition is an INVARIANT -- the ruling is not complete until the queue can be walked from it to a state where those three layers agree, every step of the walk filed as an item in the repository that can finish it and blocked in order -- and whatever that walk turns out to contain, this item takes its own step''s predecessors as blockers before becoming claimable. THIS CARD PREVIOUSLY SPELLED THE BRANCH OUT, saying the ruling files the upstream profile widening and that B-204/B-205 wait on it, and that description was INCOMPLETE in a way that reconstructed the unsafe ordering: it omitted the per-implementation re-vendor and remote-pin steps, so widening the profile upstream would leave both validators still enforcing the pre-ruling pattern. Read the walk off B-161 rather than off this sentence -- that is the whole reason its condition stopped being a list. Raised by the Codex review of pull request 137 on 850791a. File it at that point rather than now, because which of the two rulings lands decides whether it is needed at all, and an item filed against a ruling that did not happen is a claim like any other. THE MIRROR HALF IS B-207 (metasalmonpy), which names this item; the two share one blocker rather than getting a ruling each, because ruling them separately would create a parity row instead of closing one. THIS ITEM EXISTS BECAUSE B-161 COULD NOT RETIRE IN ITS OWN REPOSITORY: its condition required both implementations to emit the ruled spelling while declaring repo: metasalmon, which queue/README.md forbids, and its prescription is to split into a pair with an id each. Raised by the Codex review of metasalmon pull request 137 on ad00a37. Reachable only from a caller-supplied typed instant, which neither implementation produces on its own -- so the defect is narrow, and it gates B-204, which cannot enforce the profile pattern while this package writes bytes that fail it.'
