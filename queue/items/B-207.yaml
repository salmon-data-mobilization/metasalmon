retires_when: 'IN METASALMONPY, the descriptor path emits the spelling B-161 rules for a pre-1000 instant in metadata/dataset.csv, and a test asserts that a pre-1000 instant survives write then read unchanged. THE PYTHON WRITER IS AFFECTED, AND THIS CARD SAID THE OPPOSITE. It read "nobody has measured what metasalmonpy writes today" and reasoned that CPython''s datetime.isoformat() pads a year to four digits, so the honest expectation is that it does NOT -- both halves wrong, and raised by the Codex review of metasalmon pull request 137 on bcf999a. B-145 ALREADY CARRIED THE MEASUREMENT, taken 2026-08-25 on pandas 3.0.5: the descriptor emitted 0999-06-05T13:45:30 while metadata/dataset.csv emitted 999-06-05 13:45:30, because a column of datetime objects becomes datetime64[us] and to_csv renders it with an UNPADDED year, while str() of the same value and an object-dtype column both pad. So Python has the identical defect to R''s readr path. TWO LESSONS, both about measuring the wrong thing: the renderer is pandas to_csv, not isoformat, which is AGENTS.md''s "the baseline decides, not the type" trap in its Python spelling -- the same trap that had already misled the first R measurement on this branch hours earlier; and the measurement was not missing, it was in a sibling card that had been read in the same session, so "nobody has measured this" is a claim that must be checked against the queue before it is written. THIS ITEM DOES NOT REDO B-145''S WORK and is blocked on it for that reason: B-145 owns routing metadata/dataset.csv through the padded renderer, so two items touching one writer path would duplicate or conflict once both are claimable; queue/items/B-145.yaml carries its state and this card does not restate it. (It said "is state: ready with its work in metasalmonpy pull request 34" until the Codex review of pull request 137 on a1fec9e -- mutable planning state copied into a second file, in a commit that was itself correcting a stale copy. The durable half is that the two items share a writer path, which stays true whatever B-145''s state is.) WHAT IS LEFT HERE once B-145 lands is narrow and real: B-145 converges Python on the PADDED form by its own reasoning, while B-161 rules which spelling the ecosystem takes, and those can differ -- so this item confirms the emitted bytes are the RULED ones, adjusts them if the ruling went the other way, and adds the round-trip test for a pre-1000 instant that neither item currently has. THE EMITTED BYTES MUST ALSO SATISFY THE PROFILE PATTERN IN FORCE, AND THAT IS A SECOND CLAUSE RATHER THAN A RESTATEMENT OF THE FIRST. Raised by the Codex review of metasalmon pull request 137 on 6849fe0, and it closes a hole in the dependency B-204 takes on this item: that edge guards the ORDER of the two, and on its own it does not guard the DIRECTION of the ruling. B-161 keeps two live options, and its card says so -- pad the CSV side, which reopens backlog #93 item 1 deliberately, or accept a platform-dependent instant year across the ecosystem. Under the SECOND, this item could retire by emitting the ruled UNPADDED bytes with a round-trip test that passes, B-204 would unblock, enforcement would switch on, and validate_salmon_datapackage() would reject 999-06-05T13:45:30Z -- the exact regression the edge was added to prevent, reached by satisfying every condition rather than by skipping one. THE FIX IS NOT TO PRE-EMPT THE RULING, because forcing padded bytes here would quietly delete one of Brett''s two options. It is to name the THIRD PARTY the pair had been treating as fixed: the SDP profile''s own pattern, in smn-data-pkg. Three things have to agree before enforcement is safe -- what the writers emit, what the profile admits, and what the validators check -- and B-161 rules only the first. So if the ruling goes the way that leaves the emitted bytes outside the pattern, WIDENING THE PROFILE IS A PREREQUISITE, it is a change in another repository, and it is a new item that B-204 and B-205 must then also wait on. THE BRANCH IS THE RULING''S TO RESOLVE, NOT THIS CARD''S: B-161''s condition now requires the ruling to record whether the SDP profile must widen and, if so, to file that item so this one takes it as a blocker before becoming claimable. Without that this item would be claimable the instant the ruling closed and unfinishable in its own repository. Raised by the Codex review of pull request 137 on 850791a. File it at that point rather than now, because which of the two rulings lands decides whether it is needed at all, and an item filed against a ruling that did not happen is a claim like any other. THE MIRROR HALF IS B-206 (metasalmon), which names this item; the two share B-161 rather than getting a ruling each, because ruling them separately would create a parity row instead of closing one. Both halves exist because B-161 declared repo: metasalmon while requiring both implementations to emit the ruled spelling, which queue/README.md forbids.'
