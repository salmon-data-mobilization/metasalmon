retires_when: 'IN METASALMONPY, the descriptor path emits the spelling B-161 rules for a pre-1000 instant in metadata/dataset.csv, and a test asserts that a pre-1000 instant survives write then read unchanged. THE PYTHON WRITER IS AFFECTED, AND THIS CARD SAID THE OPPOSITE. It read "nobody has measured what metasalmonpy writes today" and reasoned that CPython''s datetime.isoformat() pads a year to four digits, so the honest expectation is that it does NOT -- both halves wrong, and raised by the Codex review of metasalmon pull request 137 on bcf999a. B-145 ALREADY CARRIED THE MEASUREMENT, taken 2026-08-25 on pandas 3.0.5: the descriptor emitted 0999-06-05T13:45:30 while metadata/dataset.csv emitted 999-06-05 13:45:30, because a column of datetime objects becomes datetime64[us] and to_csv renders it with an UNPADDED year, while str() of the same value and an object-dtype column both pad. So Python has the identical defect to R''s readr path. TWO LESSONS, both about measuring the wrong thing: the renderer is pandas to_csv, not isoformat, which is AGENTS.md''s "the baseline decides, not the type" trap in its Python spelling -- the same trap that had already misled the first R measurement on this branch hours earlier; and the measurement was not missing, it was in a sibling card that had been read in the same session, so "nobody has measured this" is a claim that must be checked against the queue before it is written. THIS ITEM DOES NOT REDO B-145''S WORK and is blocked on it for that reason: B-145 owns routing metadata/dataset.csv through the padded renderer, so two items touching one writer path would duplicate or conflict once both are claimable; queue/items/B-145.yaml carries its state and this card does not restate it. (It said "is state: ready with its work in metasalmonpy pull request 34" until the Codex review of pull request 137 on a1fec9e -- mutable planning state copied into a second file, in a commit that was itself correcting a stale copy. The durable half is that the two items share a writer path, which stays true whatever B-145''s state is.) WHAT IS LEFT HERE once B-145 lands is narrow and real: B-145 converges Python on the PADDED form by its own reasoning, while B-161 rules which spelling the ecosystem takes, and those can differ -- so this item confirms the emitted bytes are the RULED ones, adjusts them if the ruling went the other way, and adds the round-trip test for a pre-1000 instant that neither item currently has. THE MIRROR HALF IS B-206 (metasalmon), which names this item; the two share B-161 rather than getting a ruling each, because ruling them separately would create a parity row instead of closing one. Both halves exist because B-161 declared repo: metasalmon while requiring both implementations to emit the ruled spelling, which queue/README.md forbids.'
