retires_when: 'Each frozen profile resolves to the schema bytes it was frozen against, demonstrated by a test that validates a package against v0.2 and FAILS if any URL v0.2 references has changed content since the freeze commit. NEEDS BRETT BECAUSE THE FIX CHANGES PUBLISHED URLS that downstream validators are built against, which is outward-facing spec design rather than an implementation choice -- that sentence is here because it is the reason this card cannot be claimed, not as a second copy of the state field. THE EVIDENCE IS THE BACKLOG ENTRY THIS CARD POINTS AT and is deliberately not restated here, counts included: the 2026-09-16 card-hygiene section measures which URLs are unversioned, which files describe v0.2 as frozen, and which changes have already landed behind the frozen profile. The shape of a fix is recorded there too, as a starting point for Brett rather than as part of this condition. WHAT THIS CARD DOES DEFINE, because a card defines its own condition and nothing else: the test above, and that a fix leaving any frozen profile pointing at an unversioned URL does not satisfy it. THE ID: this was going to be B-206, which was allocated first to one half of the pre-1000 emission pair behind B-161.'
