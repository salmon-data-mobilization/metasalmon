id: B-209
kind: defect
title: Nothing fails when a card restates queue state in prose, so the top rule of queue/README.md is enforced only by review
state: icebox
claimable: true
repo: metasalmon
venue: claude-code
stream: S6
severity: P3
blocked_by: []
legacy: ''
evidence: queue/README.md
retires_when: 'A check run by .github/workflows/hub-queue.yml fails when a tracked prose file asserts a queue fact that the item files are the authority for -- at minimum an item''s state, its claimable flag, and its blocked_by set -- and the check is demonstrated RED on a deliberately stale sentence before it goes green. WHY IT IS NEEDED RATHER THAN OBVIOUS: queue/README.md''s top rule already says a card that restates queue state is a defect and that the copy in the card is the wrong one, and config.yaml''s generated_blocks already makes that fail the build FOR THE BLOCKS IT COVERS. Everything outside a generated block is enforced by a reader noticing. Measured on metasalmon pull request 137, 2026-09-16: of 45 upheld review findings across 29 rounds, the largest single group was one sentence about B-161''s condition copied into SIX places, and the copies were found one at a time by an external reviewer over roughly two hours -- including one copy inside B-161''s own card, which the author''s own sweep printed a header for and no matches under. The same pull request also produced a wrong pandas version reproduced into five places. WHAT MAKES THIS HARD AND THEREFORE WORTH SCOPING CAREFULLY: prose legitimately discusses queue state in the past tense and in the conditional, and a check that cannot tell -- this item IS blocked on B-161 -- from -- this item WAS blocked on B-161 until the split -- will be turned off within a week. So the first deliverable is the DISCRIMINATION RULE, not the checker: state what shape of sentence the check fires on, demonstrated against real sentences taken from knowledge/questions.md and the queue cards, before any CI wiring. A check that fires on history is worse than no check, because AGENTS.md''s guard rule then applies to it and it will be suppressed rather than fixed. THE NARROW VERSION THAT IS PROBABLY RIGHT: extend generated_blocks so that any card wanting to state another item''s state must do it inside a generated block, and have the check fail on an item id followed by a state word outside one. Retiring this item does not require the general natural-language case.'
