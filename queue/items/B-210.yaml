retires_when: 'The CHECK_ONLY_RULES block in scripts/tests/test_hub_queue.py names the place its four rules ARE demonstrated -- TestConfiguredBlocksExist, whose tests construct each condition and assert that `check` fails -- next to the reason they sit outside the coverage guard''s claim, and that pointer is written so it fails rather than rots, because a named class can be renamed or emptied and the sentence would still read true. THE OMISSION IS THE DEFECT AND THE EXEMPTION IS NOT: the set is correctly scoped and already carries its own maintenance rule, because these four are emitted by validate_generated_blocks, which command_check calls and command_lint does not, so they are outside a claim about LINT rules rather than gaps inside it. THE COST IS MEASURED, WHICH IS WHY THIS IS FILED AT ALL: reading the set without that pointer, one reader concluded three times inside one sweep that the four had never been shown to fire -- first from a grep for the rule NAMES, which those tests do not use because they assert on message text; then from a narrowed claim of three after one hit appeared; then from a message-text grep that found two more -- and came within a commit of filing an item asking for tests that already exist. An exemption that says why it is outside one claim, without saying what is inside another, reads as absence of coverage. The three readings, and what each instrument actually measured rather than what it was taken to measure, are in knowledge/backlog.md.'
