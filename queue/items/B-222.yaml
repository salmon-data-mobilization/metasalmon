retires_when: 'In metasalmonpy, apply_sdp_semantics() writes one term_type for one decision however it was expressed: accept_suggestion(iri=<a shortlisted candidate''s IRI>) writes that candidate''s own term_type, exactly as rank=<its rank> does, so applying, rebuilding the review and re-applying leaves column_dictionary.csv byte-identical. Pinned by a test that hand-picks the IRI of an owl_class candidate below rank 1, applies, rebuilds, re-applies and compares bytes, demonstrated RED on the code as it stands. An IRI no candidate carries keeps skos_concept. THE MIRROR HALF IS B-221 (metasalmon); each names the other.'
