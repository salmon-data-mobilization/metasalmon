legacy: ''
evidence: knowledge/backlog.md
retires_when: 'Every R read of the EML sidecar, metadata/eml-mapping.yml -- write_eml_from_sdp() and the KNB artifact inventory and plan builder -- refuses a sidecar carrying an !expr tag, or any other local tag it has no meaning for, with a clear error that names the file, instead of taking the tag''s text as the value and carrying on. Pinned by a test per read, demonstrated RED on the reads as they stand. THE DIRECTION IS A DEFAULT BRETT WAS OFFERED AND DID NOT OVERRULE, and is recorded as that rather than as a ruling: on 2026-09-23 it was put to him that R moves to metasalmonpy''s behaviour, because silently publishing code as metadata is the worse failure, with the alternative of registering the difference instead, and he did not take the alternative. B-142 made every one of these reads pass eval.expr = FALSE, so no tag runs; what this item changes is the value that reaches published EML, and it builds on B-142, which changed the same reads. B-142''s tests assert both that a tag never runs and that its text arrives as the value: the first assertion stays, and the second becomes the refusal. THE SEMANTIC CLOSURE''S PATH READER IS OUT OF SCOPE UNTIL Q-62 IS RULED. There the two implementations already differ: R takes the tag''s text as the path, and metasalmonpy falls back silently to the default paths. Which of the two is right has not been put to Brett, and changing R''s closure reader here would replace one unrecorded difference with another, so this item leaves that reader as it is and Q-62 owns it. Narrowed 2026-09-24 after the Codex review of metasalmon pull request 150.'
