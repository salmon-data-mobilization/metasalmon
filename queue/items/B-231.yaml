evidence: knowledge/backlog.md
retires_when: 'The smn build fails when a local term has no definition. A local term is an smn: IRI in ontology/modules/ typed as an OWL class, object, datatype or annotation property, or as a SKOS concept or concept scheme. The definition must be in the property the repository''s own annotation contract names for the term''s kind: skos:definition for a SKOS term, obo:IAO_0000115 for anything else. The only exception is a term listed in one committed exemptions file, where every row names the queue id that will retire it. A ROW RETIRES WITH ITS TERM: the check also fails on a stale row, one whose term now has a definition or is no longer a local term, so the change that defines or deletes a term deletes its row too, and the file can only shrink. That rule was added 2026-09-24 after the Codex review of metasalmon pull request 150 found that B-232 could define a term and leave its row in place, where the row would hide a later loss of that definition. THE RULE STAYS IN ONE PLACE: require_term_annotations() in scripts/verify_year_age_semantic_contract.py already states it and applies it only to the terms that script names, and the new check applies that same rule to every local term rather than copying it. The check runs in make ci and in the repository''s CI workflow. It was shown failing on a planted undefined term, and passing once that term had a definition. docs/annotation-gap-ledger.md stops keeping its own hand-counted list of the same gaps: it is either generated from the check or points at the exemptions file, so the list of undefined terms has one home. SEEDING THE EXEMPTIONS WITH EVERY TERM UNDEFINED TODAY IS EXPECTED: this item stops the list growing, and B-232 is what empties it. The check reads presence only and judges no definition, so it decides nothing about what a term means.'
