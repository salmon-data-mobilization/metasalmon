retires_when: 'EVERY LOCAL smn TERM IN ontology/modules/ IS ACCOUNTED FOR, AND NONE BY GUESS. Each one either carries a definition in obo:IAO_0000115 or skos:definition, with the source recorded in obo:IAO_0000119 or dcterms:source, or is recorded in the repository with the sources tried and the reason no definition was written. There are exactly two reasons: an open queue item deletes the term, as B-108 deletes smn:NCBITaxon_8018, or the term''s meaning needs a ruling from Brett, stated as the question the ruling must answer, AND a queue item blocked on that ruling owns writing the definition once it is given, so that no term is left without an owner when its ruling lands. smn:Run is already the second kind: its question is Q-61, and B-237 owns its definition. The owner rule was added 2026-09-24 after the Codex review of metasalmon pull request 150 found that B-232 could close before Q-61 was ruled, leaving smn:Run''s definition with no item. No definition was written from inference alone, per the ground rules in the repository''s docs/annotation-gap-ledger.md, and wording is reused exactly wherever an authoritative source already has it. Each definition cites, by commit, the salmon-knowledge-commons card that establishes it, which B-238 owns: the research behind a definition is durable salmon knowledge and lands in the commons, not only in an annotation. That sequencing was added 2026-09-24 after the same Codex review. docs/ is regenerated with make docs-refresh, so the published site renders each new definition. EACH DEFINITION CHANGES WHAT A TERM MEANS, so the pull request is class 1 in HUB.md and is Brett''s to merge. It may land as several pull requests, one per module.'
