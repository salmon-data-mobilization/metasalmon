retires_when: 'smn:Run carries a definition, in skos:definition or obo:IAO_0000115 as the repository''s per-type rule requires, with its source in dcterms:source or obo:IAO_0000119. The definition is written from a source under docs/annotation-gap-ledger.md''s ground rules, in the sense Q-61 rules, and the label changes if the ruling changes it. The definition cites, by commit, the commons card B-239 updates with the ruled meaning. If B-231''s committed exemptions file lists smn:Run, the same change deletes that row, so the guard covers the term once it has a definition instead of letting it disappear again unnoticed. docs/ is regenerated with make docs-refresh, so the published site shows it. The definition changes what the term means, so the pull request is class 1 and Brett merges it. Split out of B-232 on 2026-09-24 after the Codex review of metasalmon pull request 150: B-232 may retire while Q-61 is still open, and without this item the definition would have no owner once the ruling lands. The card dependency and the exemption row were added the same day after the next round of that review.'
