retires_when: 'EVERY smn TERM IN B-232''S SCOPE HAS A COMMONS CARD THAT ESTABLISHES ITS MEANING OR SAYS WHY IT CANNOT YET. Each card cites its sources with an in-card citation ledger that passes the ledger check, proposes the definition wording B-232 will write, and says whether that wording is reused from an authoritative source or composed. A term whose meaning needs a ruling from Brett carries the question in its card and a gap entry, so B-232 can record the term as deferred for that ruling. The cards are merged to the commons main branch, so B-232 cites each one by commit. Filed 2026-09-24 after the Codex review of metasalmon pull request 150: what a term means, and why, is durable salmon knowledge that AGENTS.md sends to the commons, and B-232 is a salmon-domain-ontology item that cannot finish work in a second repository.'
