retires_when: 'metasalmonpy''s test suite carries the twins of the two tests B-162 added to metasalmon''s tests/testthat/test-canonical-date-render.R, each pinning that the EML calendarDate is the one rendering metadata/dataset.csv holds. (1) A TYPED DATE: datetime.date(999, 1, 1) and datetime.date(2024, 12, 31), written by write_salmon_datapackage() and exported by write_eml_from_sdp() with its schema check. The test asserts that the EML''s begin and end calendarDate are identical to the dataset.csv cells, identical to datapackage.json''s temporal, and equal to 0999-01-01 and 2024-12-31. (2) SHORT-YEAR TEXT: temporal_start "999-06-05". The test asserts that the calendarDate _add_coverage() builds from the frame validate_salmon_datapackage() returns as package is identical to the dataset.csv cell. The exported call cannot show this, because 999-06-05 is not an xs:date. As in R, the descriptor is not asserted in this test. WHAT THE TWINS PIN: eml.py''s two calendarDate lines, _add_text(begin, "calendarDate", _as_character(temporal_start)) at :2253 and its temporal_end twin at :2255, on metasalmonpy main 012d04b. Those lines receive text, because read_sdp_csv() reads dtype=str (metadata.py:112), so the answer B-162 gave for R holds there by the same construction, and no test in the suite pins it. Measured 2026-09-25 on 012d04b, both twins would pass today; the measurements are in this item''s evidence. The item is owed as a pin, not as a behaviour port and not as a parity-register row, because nothing behaves differently.'
