retires_when: 'In metasalmon, the review console never records an accept whose IRI is empty or is still a REVIEW: marker, and never reports a suggestion row with an empty iri as a field it cannot decide. Four cases, each pinned by a test demonstrated RED on the code as it stands: (1) accept_suggestion(rank = ) on a shortlisted candidate whose iri is only the marker, in each spelling .ms_strip_review_iri() removes, records no accept with an empty decision_iri, whether it refuses there or review_semantics() never queues such a candidate; (2) a review rebuilt over a recorded accepted row whose iri is only the marker replays no empty decision_iri; (3) an accept whose IRI is still a marker once the strip has run, such as iri = "REVIEW: REVIEW:", records no decision_iri that .ms_is_review_iri() reads as a marker; (4) review_semantics() does not list a row it drops for an empty iri under "Some suggestions target fields this review cannot decide", whose bullet names a field the review does decide and tells the user to edit the CSV by hand; if the row is reported at all, the report says it has no IRI. B-219 closed the iri = path only, by moving the non-empty check after the strip. WHICH SPELLINGS COUNT AS THE MARKER IS Q-63''s, and this item does not decide it: each case is written against the spellings this package''s own strip and detector recognise, as B-219''s tests were. Case (4) was read in this package and not run, so its RED run is its first measurement here. THE METASALMONPY HALF IS B-247, and each names the other.'
