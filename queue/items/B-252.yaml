retires_when: 'IN METASALMONPY, under a selected schema omitting optional dataset.csv update_frequency, tables.csv method_iri and codes.csv vocabulary_iri, direct metadata writes keep these fields absent when caller input truly lacks them, and table inference does not synthesize an omitted method_iri, matching executable R probes. Tests demonstrate the direct-writer and table-inference discrepancies RED, then GREEN, and default-schema output bytes match the pre-fix baseline. Caller extras remain preserved, including update_frequency and constraint_iri supplied by create_sdp inference even under an omitting schema; R dictionary validation synthesizes constraint_iri, so that semantic-field contract is preserved. All four setters and apply_sdp_semantics remain behavior controls, and public normalization/read behavior is unchanged. A PORT, NOT A REGISTER ROW: knowledge/parity-deviations.md records the measured remainder of B-215, with the 2026-09-30 correction to its earlier source-only R premise. Retire only when the tested Python implementation lands, not when its draft PR is published.'
