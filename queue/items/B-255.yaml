retires_when: 'IN METASALMONPY, accepting either of two candidates that carry one IRI in one slot writes that candidate''s own term_type, and a rebuilt review re-applies to the same bytes, by the record B-254 lands in R. Pinned by the twin of B-254''s test, demonstrated RED on the code as it stands. The measurement behind this half predates metasalmonpy pull request 48 (B-222), which moved where an iri= accept is recorded and did not change what the record or the replay does with a second carrier, so the RED run is also its re-measurement. THE METASALMON HALF IS B-254, which owns the design question, and each names the other. A PORT, NOT A REGISTER ROW.'
