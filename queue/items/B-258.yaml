retires_when: 'In metasalmon, when a metadata file holds two rows with one address, review_metadata() prints no call that repeats an argument: it names the duplicated address, so no printed call fails with formal argument matched by multiple actual arguments. Pinned by a test on a column_dictionary.csv that carries the spawner_count row twice, demonstrated RED on the code as it stands. The fix belongs in .ms_metadata_render_lines(), which groups gap rows by address, not in the scan. THE METASALMONPY HALF IS B-259, and each names the other.'
