retires_when: 'For an IRI in the measurement set that no review target holds, which is a code-resolved sosa:usedProcedure, the gap row and the incomplete-evidence row write_sdp_semantic_closure() builds name where the IRI actually sits: each codes.csv row whose term_iri carries it, with that row''s table_id, column_name and code_value filled and a target_row_key keyed the way target discovery keys a codes.csv row. The schema does not make term_iri unique, and the measurement set holds each IRI once, so when several codes.csv rows carry one procedure IRI every one of them is represented, as a row per carrying code row or as one row whose address names each of them; which of the two is the fix''s to choose, and its pull request says what render_ontology_term_request() then does with it. And the warning and the placement_rationale name that field rather than method_iri, which codes.csv does not have. The defaults come from .ms_closure_target_context() in R/semantic-closure.R. Pinned by a test on B-171''s fixture with a search that does not know the procedures, so both become gaps, asserting each row''s file, field and keys against the codes.csv row that carries its IRI, and by a second test in which two codes.csv rows carry one procedure IRI and both are represented, each demonstrated RED on the producer as it stands. A gap row is what render_ontology_term_request() builds a term request from, so this address is what a request would cite. THE METASALMONPY HALF IS B-266, and each names the other.'
