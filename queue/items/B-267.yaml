retires_when: 'tests/testthat/test-theme-a-benchmark.R reports no failure and no error, only skips that name what is missing, in two settings CI never uses: a suite started from a script file, such as Rscript runner.R where runner.R calls devtools::test() or testthat::test_file() on it; and a suite run on a git archive export of the tree, where a test that needs git history skips rather than failing at theme_a_git_value(). Run with Rscript -e in a git checkout, as CI runs it, the file''s tests pass and skip as before. Decided by running the file in those three ways.'
