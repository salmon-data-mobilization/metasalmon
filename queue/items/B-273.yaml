retires_when: 'The lowest Python the requires-python field of pyproject.toml admits is one the whole test suite passes on, and a CI job runs the suite on it: either the tests stop calling APIs newer than the floor, Path.write_text(newline=) in tests/test_sdp_csv_reader.py and tests/test_missing_value_contract.py being the ones found, or the floor rises to what the package and its tests need. Decided by that CI job, green on the declared floor. Raising the floor drops a Python version users can install on, so the pull request says so.'
