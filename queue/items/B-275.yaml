retires_when: 'IN METASALMONPY, when apply_salmon_dictionary(strict=False) keeps a column as text because a value will not convert to its value_type, the warning names the column and the values that cannot be read as that type, as the cli_warn() in metasalmon''s apply_salmon_dictionary() does, rather than "Coercion to <type> failed; keeping as string". Pinned by a test that asserts both names in the warning, demonstrated RED on the code as it stands. THE R HALF IS B-55. A PORT, NOT A REGISTER ROW: nobody chose the difference.'
