retires_when: 'A commons pull request stacked on the one B-321 names is merged, adding three optional fields, so that no existing card needs migrating. Brett chose the three on 2026-09-25 from the options put to him, over a parallel eight-field pull request (commons 29, since closed): sources[].published, a year, month or day validated as a real date; a card-level relationships list, named as upstream OKF names it, whose entries name a card that exists, a type from a closed list and a note, with any cited ids resolving to the card''s own sources; and alignment.bindings, SSSOM-shaped entries naming an absolute IRI, a SKOS mapping predicate and a SEMAPV justification. The pull request says how a binding relates to the plain alignment.exact, broader and related lists, so that there are not two unrelated ways to state one mapping. The same pull request records in the commons AGENTS.md that study-bundle card types stay local (Brett, 2026-09-25). Brett merges it. Third in the order he ruled (Q68).'
