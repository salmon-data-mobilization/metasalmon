retires_when: 'A workflow in salmon-knowledge-commons runs scripts/okf-check.py on every pull request and on every push to main, and fails on any validator error, so that a card change is checked by something other than its author. It folds in the ledger tools from draft pull request 22 only where they check something the cards carry by then, and without the compiled .pyc files that pull request committed. The pull request states what the check enforces and what it does not: if required status checks stay unavailable to the commons, as they are to a private repository on the Free plan, the check is advisory, and B-324 writes that into CONTRIBUTING. Brett merges it, because an agent may merge in the commons only a change confined to concepts/. Fourth in the order Brett ruled on 2026-09-25 (Q68); B-123 follows it. SATISFIED 2026-09-26: commons pull request 35 merged as 0c4fcf3, running okf-check.py on every push and pull request and the ledger card-only check on cards that carry a check.'
