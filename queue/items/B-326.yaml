evidence: knowledge/plans/2026-09-25-s16-review-packet-contract.md
retires_when: 'metasalmon exports two functions that let model judgement run outside the package. Neither makes a model or provider call, and neither reaches the network except through the search_fn it is given for ontology retrieval, which is how a retry widens a shortlist; a sentinel proves both rather than a green run implying them. The first writes a review packet: a deterministic file holding what the package already computes for a review, meaning the targets in the frozen 19-column row, each target''s ranked candidate shortlist by index, each candidate carrying its label, IRI, source, definition and every field the role validators and the bundle review read today (its ontology role, role hints, native type, term type, resource kind and type IRIs), so that a harness sees the same evidence the in-package reviewer sees, the bundle groups with their current slots, the scored context excerpts, the review instructions, the decision vocabulary and the 30-column assessment schema, stamped with the package version and whatever ontology pins exist. The second reads a harness''s assessments in exactly the frozen 30-column row. It refuses a selection whose IRI the packet did not offer and records it as an error rather than applying it, runs the existing bundle validators and the retry and escalation bookkeeping (an unresolved reject_shortlist still escalates to request_new_term), merges the result, and persists it so that semantic_llm_assessments(path) returns it. A RETRY IS A SECOND HARNESS PASS: a decision asking for a wider search yields a continuation packet holding the widened shortlist, and nothing from that target is merged or escalated until the harness has answered it, so no rejection is escalated before the harness has seen the retry''s candidates; a rejected shortlist earns no second pass and escalates at once, which is metasalmonpy''s behaviour and the design Brett adopted with section 10 of the S16 execplan (decision 10 and section 3.4), so R''s in-package path, which gives some rejections a second pass, moves. The ingester refuses assessments that do not name the packet they were made against, through a one-line sidecar beside the harness file or an argument, so a stale file cannot be recorded under a newer packet; it redacts secrets in harness text at capture and leaves no unredacted copy of that text in the package directory; and for a package path, a blank slot with no candidates reaches the packet, rebuilt by the discovery create_sdp() ran. Every ordering in the packet uses explicit C collation, and the emitter and the ingester are registered in collation_sensitive_fns in tests/testthat/test-collation-guard.R. llm_assess = TRUE, the llm_* arguments and chat_decomposition() warn that they are deprecated, and NEWS.md says so and names what replaces them. The packet schema and the conformance cases are one contract shared with metasalmonpy, vendored byte-identically in both repositories, so that B-327 tests the same cases. The names are write_semantic_review_packet() and ingest_semantic_assessments(), and the paths are those section 10 of the S16 execplan lists, all ruled by Brett on 2026-09-25 when he took every recommendation there; they are public signatures, so Brett merges it. Step 1 of S16 (Q67). B-327 is the metasalmonpy half, and each names the other.'
