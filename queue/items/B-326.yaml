retires_when: 'metasalmon exports two functions that let model judgement run outside the package, and neither makes a network or model call, which a sentinel proves rather than a green run implying it. The first writes a review packet: a deterministic file holding what the package already computes for a review, meaning the targets in the frozen 19-column row, each target''s ranked candidate shortlist by index with label, IRI, source and definition, the bundle groups with their current slots, the scored context excerpts, the review instructions, the decision vocabulary and the 30-column assessment schema, stamped with the package version and whatever ontology pins exist. The second reads a harness''s assessments in exactly the frozen 30-column row. It refuses a selection whose IRI the packet did not offer and records it as an error rather than applying it, runs the existing bundle validators and the retry and escalation bookkeeping (an unresolved reject_shortlist still escalates to request_new_term), merges the result, and persists it so that semantic_llm_assessments(path) returns it. A RETRY IS A SECOND HARNESS PASS: a decision asking for a wider search yields a continuation packet holding the widened shortlist, and nothing from that target is merged or escalated until the harness has answered it, so no rejection is escalated before the harness has seen the retry''s candidates; whether a rejected shortlist also earns that pass, as R''s in-package path gives it for some answers and metasalmonpy''s does not, is a divergence whose direction is Brett''s. Every ordering in the packet uses explicit C collation, and the emitter and the ingester are registered in collation_sensitive_fns in tests/testthat/test-collation-guard.R. llm_assess = TRUE, the llm_* arguments and chat_decomposition() warn that they are deprecated, and NEWS.md says so and names what replaces them. The packet schema and the conformance cases are one contract shared with metasalmonpy, vendored byte-identically in both repositories, so that B-327 tests the same cases. The names and paths are public signatures, so the pull request proposes them and Brett merges it. Step 1 of S16 (Q67). B-327 is the metasalmonpy half, and each names the other.'
