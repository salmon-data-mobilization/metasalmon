retires_when: 'IN METASALMONPY, the review-packet exporter and the assessment ingester that B-326 adds to metasalmon exist with the same behaviour, and neither makes a model or provider call or opens a socket except through the search_fn it is given for ontology retrieval, which a guard at the socket proves in the way metasalmonpy already guards its offline schema path. The candidate record carries the same role evidence B-326 requires. Both read and write the one shared contract: the same packet schema and the same conformance cases, vendored byte-identically from the copy B-326 lands, so that a packet either package writes is one the other package''s ingester accepts, and an assessment file either package rejects, the other rejects for the same reason. A retry is the same second harness pass B-326 defines, through the same continuation packet, and nothing from a retried target is merged or escalated before the harness has answered it. Every ordering in the packet sorts by code point, never by locale, so that the packet bytes do not depend on where it runs. suggest_semantics(llm_assess=True), the llm_* arguments and chat_decomposition() warn that they are deprecated, CHANGELOG.md says so under Unreleased, and metasalmonpy''s AGENTS.md carries the same dated note about the LLM opt-in contract that metasalmon''s does. Any deliberate difference is registered in PARITY.md and in knowledge/parity-deviations.md in the same pull request. The names are public signatures, so Brett merges it. Step 1 of S16 (Q67). THE METASALMON HALF IS B-326, and each names the other.'
