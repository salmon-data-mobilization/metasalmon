retires_when: 'IN METASALMONPY, fetch_salmon_ontology() follows the rule B-333 lands in R: a call that names a url and no fallback_urls never returns the body of a default fallback that serves a different ontology from the one url names, and if url fails it returns a copy of that ontology or raises. Pinned by the twin of B-333''s test, with requests.get stubbed so that a url for the ontology that is not the default fails and the default fallback answers, demonstrated RED on the function as it stands, with the same control. It holds whichever default Q-71 rules. THE METASALMON HALF IS B-333, and each names the other. A PORT, NOT A REGISTER ROW: both packages carry the defect in the same shape.'
