legacy: ''
evidence: knowledge/backlog.md
retires_when: 'In metasalmon, fetch_salmon_ontology() keys its cached copy and its validators by the url a call names. Two calls with different urls and one cache_dir leave two copies; a path one call returned still holds that call''s ontology after the other call returns; the If-None-Match and If-Modified-Since headers sent with a request are the ones stored for that url; and no call returns a copy that a call naming a different url wrote, whether the server answers 304 or every url fails. Pinned by a test with httr::GET stubbed that fetches smn and then gcdfo into one directory and checks all four, demonstrated RED on the function as it stands. It holds whichever failure behaviour Q-71 rules. THE METASALMONPY HALF IS B-336, and each names the other.'
