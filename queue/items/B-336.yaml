retires_when: 'IN METASALMONPY, fetch_salmon_ontology() keys its cached copy and its validators by url and accept as B-335 lands it in R: two calls with one cache_dir that differ in url or in accept leave two copies; a path one call returned still holds what that call fetched after the other call returns; the conditional headers sent with a request are the ones stored for that url and accept; and no call returns a copy that a call differing in url or accept wrote, on a 304 answer or on any other path. Pinned by the twin of B-335''s test with requests.get stubbed, demonstrated RED on the function as it stands. It holds whichever failure behaviour Q-71 rules. THE METASALMON HALF IS B-335, and each names the other. A PORT, NOT A REGISTER ROW: both packages carry the defect in the same shape.'
