retires_when: 'IN METASALMONPY, fetch_salmon_ontology() keys its cached copy and its validators by url as B-335 lands it in R: two calls with different urls and one cache_dir leave two copies; a path one call returned still holds that call''s ontology after the other call returns; the conditional headers sent with a request are the ones stored for that url; and no call returns a copy that a call naming a different url wrote, on a 304 answer or on any other path. Pinned by the twin of B-335''s test with requests.get stubbed, demonstrated RED on the function as it stands. It holds whichever failure behaviour Q-71 rules. THE METASALMON HALF IS B-335, and each names the other. A PORT, NOT A REGISTER ROW: both packages carry the defect in the same shape.'
