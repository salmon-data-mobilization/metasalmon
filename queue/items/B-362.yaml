retires_when: 'IN METASALMONPY, two things hold, each pinned by a test that fails before the change. (1) normalize_assessment_rows() reads the strings TRUE and FALSE as the booleans they name, so a persisted assessment CSV reads back correctly; today FALSE becomes True. (2) The retry-query classifier gives the verdicts metasalmon''s gives once B-361 lands: whitespace collapsed, a duplicate check that folds case over ASCII letters only, the same in every locale, and metasalmon''s identifier pattern, which recognises a CURIE such as gcdfo_v2:X that metasalmonpy''s misses. A test pins a pair that differs only in a non-ASCII letter''s case as not a duplicate. THE METASALMON HALF OF THE CASE FOLDING IS B-361 POINT (5), and each names the other. Ruled 2026-09-25 by Brett when he took every recommendation in section 10 of the S16 execplan (decisions 11 and 12, and section 3.4). A prerequisite of B-327.'
