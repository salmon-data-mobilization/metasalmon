retires_when: 'IN METASALMONPY, the retrieval loop inline in suggest_semantics() is one function that takes a target, a source policy, a depth, the search function, an optional query and a retrieval pass, and suggest_semantics() calls it with no change in its results, which a test pins against the current output. A second-pass shortlist merges with the first by metasalmon''s rule: a C-order sort on metasalmon''s seven keys, deduplicated by candidate identity, with the gain counted the same way, pinned by a test run on the same inputs in both packages. This is the loop B-243 also touches, so whichever lands second rebases onto the other rather than duplicating it. Ruled 2026-09-25 by Brett when he took every recommendation in section 10 of the S16 execplan (sections 2.3 and 4); it also makes the retry half of parity row 39 true again. A prerequisite of B-327. No metasalmon half.'
