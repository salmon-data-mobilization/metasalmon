retires_when: 'Two cases, each pinned by a test in scripts/tests/test_check_changelog_window.py that is RED on the script as it stands, where both exit 1, the code the docstring gives for findings. (1) An environmental failure where the script starts git, meaning an OSError from starting the subprocess, such as git absent from PATH, is raised as CannotRun at that boundary, so the script exits 2 with "cannot run" and the cause named on standard error, as it does for a shallow clone. (2) Any other exception that escapes run(), which is a defect in the script rather than in its input, keeps its full traceback on standard error, is not described as missing input, and exits with a code that is neither 0 nor 1; which code is the fix''s to choose, and the docstring''s list of exit codes names it. THE METASALMONPY HALF IS B-374, and each names the other.'
