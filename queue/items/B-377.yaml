retires_when: 'In metasalmon, ices_code_types(), ices_codes(), ices_find_code_types() and ices_find_codes() tell a failed request from an empty answer. With the request mocked to fail, both as a refused connection and as an HTTP 5xx answer, each one warns or errors and names the request that failed, with any secret in it redacted, where an answer of [] returns the empty result with no warning. Which of a warning and an error is the fix''s to choose. Pinned by tests in tests/testthat/test-ices-vocab.R, RED on the code as it stands. THE METASALMONPY HALF IS B-378, and each names the other.'
