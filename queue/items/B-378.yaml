retires_when: 'IN METASALMONPY, ices_code_types(), ices_codes(), ices_find_code_types() and ices_find_codes() tell a failed request from an empty answer as B-377 makes metasalmon''s do. With the request mocked to fail, both as a refused connection and as an HTTP 5xx answer, each one warns or errors and names the request that failed, with any secret in it redacted, where an answer of [] returns an empty DataFrame with no warning; the choice between a warning and an error is the one the metasalmon half made. Pinned by tests in tests/test_ices_vocab.py, RED on the code as it stands. THE METASALMON HALF IS B-377, and each names the other.'
