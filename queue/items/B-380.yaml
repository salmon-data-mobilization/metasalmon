id: B-380
kind: defect
title: 'metasalmon''s retry-query identifier check misreads a CURIE, because its bracket class means not backslash and not s'
state: icebox
claimable: true
repo: metasalmon
venue: claude-code
stream: S16
severity: P2
blocked_by: []
legacy: ''
evidence: knowledge/plans/2026-09-25-s16-review-packet-contract.md
retires_when: 'IN METASALMON, .ms_llm_query_looks_like_identifier() recognises an identifier the way it intends: its second pattern, ^[A-Za-z][A-Za-z0-9._+-]*:[^\\s]+$ at R/llm-semantic-helpers.R:1256 on main, runs under R''s default TRE engine, where a backslash inside a bracket expression is literal, so [^\\s] means neither a backslash nor the letter s. Measured 2026-09-25 under R 4.5.2: smn:species and abc:s are not identifiers under it, while abc:d e, which contains a space, is; with [^[:space:]] or perl = TRUE all three read correctly. So a retry query that is a CURIE containing the letter s is searched literally, and the ingester''s identifier_like_query rule inherits the defect. Fixed by the POSIX class, pinned by a test over those cases that fails before the change, with a NEWS entry. B-381 is the metasalmonpy half, because B-362 ported the quirk exactly so that both packages give one verdict; each names the other. Wanted before the additive release of S16 step 1, because B-326''s ingester uses this classifier.'
