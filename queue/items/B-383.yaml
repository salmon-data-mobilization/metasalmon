retires_when: 'IN METASALMON, .ms_context_text_from_rmarkdown() decodes a .Rmd or .qmd context file through the chain the other text readers use (UTF-8, then cp1252, then latin-1) before it drops front matter and fences, so a cp1252 file becomes excerpts rather than an error. Pinned by a test with a cp1252 .qmd that fails before the change. No metasalmonpy half: it already decodes the file. Wanted before the additive release of S16 step 1, because B-326''s packet carries excerpts from these files.'
