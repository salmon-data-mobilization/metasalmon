retires_when: 'IN METASALMONPY, fetch_salmon_ontology() called with no url fetches smn from metasalmon''s default URL, with the fallback that goes with it, instead of gcdfo from a URL that no longer answers. When every attempted URL fails to refresh, it returns an eligible body cached for an attempted URL and the requested Accept with a warning, matching B-422 in R. It never returns unrelated, unqualified legacy, mismatching or otherwise known-stale bodies. A failed refresh alone does not prove a matching body stale; a replacement response or contradictory validator makes the old representation ineligible on subsequent calls as well. Tests pin matching transport/503 warning controls, URL/Accept isolation, known-stale refusal and recovery after a successful replacement. Documentation describes both clauses and CHANGELOG.md records them under Unreleased. Brett ruled the smn default on 2026-09-26 and clarified the cache behavior on 2026-10-03: "For Q71, if the cache matches the requested ontology and refresh fails, continue with a warning. Do not use unrelated, mismatching or otherwise known-stale caches." Continue the existing PR75 with B-334, B-336 and B-337; do not open a duplicate, invent a freshness interval or add a parity-deviation row.'
