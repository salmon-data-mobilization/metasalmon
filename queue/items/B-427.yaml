retires_when: 'metasalmon exposes a reviewed public capture_catalogue_query API for KNB and DataONE and records shared-receipt and fixture conformance with the mirrored metasalmonpy API: bounded pagination and response size, immutable raw-page hashes and source-query provenance, pending annotation status, explicit incomplete/failure outcomes and no independent-dataset count. The R repository retains its own offline fixture tests and shared conformance evidence proving both API contracts agree, no provider or credential access, no overwrite of an existing capture and retained failure evidence; the sibling API has its own reviewed PR under the mirror rule, not an unimplemented promise. The receipt is a bounded metadata-capture record, not the complete S14 DatasetReceipt or an SDP. The migration card records staged boundaries, and both public signatures remain proposals until their respective PRs are reviewed and merged. CLAIMABILITY: false while the new public signature and shared receipt need Brett''s consequential interface review; authorization to implement and open draft PRs is not authority to adopt the public contract or merge it unattended. AUTHORIZATION: Brett requested public Fraser sockeye catalogue discovery and a replayable local prototype on 2026-09-30, then explicitly requested ecosystem review PRs, notification of the package and research consumers, and starting the scraper and migration. This branch proposes readiness; it becomes effective only when this item reaches the default branch. It does not activate S-14, reopen Q27, alter hub membership, fetch restricted sources, publish data or accept semantics.'
