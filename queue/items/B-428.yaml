retires_when: 'The smn:AggregatedMeasurementShape in ontology/shapes/method-shapes.ttl accepts a group summary based on a non-enumeration procedure already in smn:MethodScheme, such as mean length based on smn:FishLengthMeasurementMethod, while still rejecting invalid basedOn values under the existing procedure-value membership constraint. The existing enumeration case remains valid. scripts/verify_method_shapes.py and the SHACL test path contain positive and negative fixtures that fail before and pass after this correction. The unconditional path through smn:EnumerationMethodValueShape and its enumeration-only message no longer assert that every aggregate is a count. This implements the group-summary sense Brett already ruled in Q64(b); it does not choose a new ontology term or change the meaning of AggregatedMeasurement. Q73 separately asks whether gcdfo enumeration concepts outside smn:MethodScheme are valid basedOn values; this item preserves the existing scheme membership boundary and does not silently answer that question. The pull request explicitly describes any term IRI or constraint changed and leaves a meaning-changing choice for Brett rather than letting test success decide it. CLAIMABILITY: false until the applicable promotion and procedure-value judgement gates are explicitly met; this draft files the owner but does not authorize unattended implementation or change ontology meaning.'
