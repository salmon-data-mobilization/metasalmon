retires_when: 'In metasalmon, nuseds_enumeration_method_crosswalk() maps Based on Angling Catch to smn:EnumerationMethod instead of the undeclared gcdfo:EnumerationMethod, and the three NuSEDS crosswalks carry the four values found in the PSF cleaned NuSEDS release (Zenodo 10.5281/zenodo.19959144): ESTIMATE_CLASSIFICATION NO SURVEY unmapped as an absence-of-observation marker, like NO SURVEY THIS YEAR; ESTIMATE_METHOD Fence Count mapped to gcdfo:FixedStationTally, like Fixed Site Census; ESTIMATE_METHOD Aerial Survey unmapped, because gcdfo:AerialSurveyCount is an enumeration method and not an estimate method; and ENUMERATION_METHODS Net unmapped as method-unknown. Tests pin each row, NEWS.md records the changed and added rows, the roxygen states the scheme-level link, and the workpad records that every ontology_term the three crosswalks emit is declared in gcdfo 0.0.9. Twin of B-439 in metasalmonpy. Rows and targets ruled by Brett 2026-10-23; B-76''s estimate-branch choice is not decided here.'
