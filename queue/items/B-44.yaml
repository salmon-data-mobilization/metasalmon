retires_when: 'The SHACL shapes and example data bind their default prefix to the namespace gcdfo subjects actually use, each competency query declares its prefixes and is executed separately, `robot-profile.yaml` amends rather than replaces the default profile so the 16 ERROR-level checks run again, and a deliberately broken fixture makes the gate fail. THE WORK IS DONE AND WAITING: the patch is .hub/handbacks/B-44.patch and the report .hub/workpads/B-44.md, both exported 2026-09-16. WHY THIS IS needs_brett RATHER THAN review, since it was ready until 2026-09-16 and review would be the obvious move: the claim ref tip is a `beat` with no `branch` field and no `handoff`, so the lease and the reclaim grace both elapsed and `hub ready` listed this item, at P1, as the only claimable work in the queue -- pointing the next agent at a patch that already exists. `review` would have said the hand-back protocol completed, and it did not; a Codex review of metasalmon pull request 135 caught that. The handoff could not simply be appended: `hub done` refuses a claim held by another agent (scripts/hub:1782-1785, "$id is held by $ag, not by this agent"), and forging that agent token on the claim ref is the only way past it. So the state carries the protection the lock stopped carrying. It is also the honest state on the merits, twice over: the deliverable is a patch to a SHARED member repository, so landing it needs the push credential Brett holds, and the restored duplicate_label check is RED on main because gcdfo:WildSalmonPolicy and gcdfo:WildSalmonPolicyTheme share an rdfs:label, which is a term decision filed as B-136. Neither is an agent''s to settle, which is also why claimable is now false. The claim ref is still inconsistent and wants either a `hub reconcile` expiry release or a hand repair; that is recorded here rather than done.'
