retires_when: 'IN SMN-SCI-PLGN, once the release that carries B-329 and B-330 is tagged in both packages, no skill pins the version it replaced: every metasalmon@ and metasalmonpy@ pin and every prose version in skills/ names the new release (17 references to v0.6.0 measured 2026-11-24, across metasalmon-skill, its references and recipe, and sdp-semantic-review). No skill describes the in-package provider route (llm_assess, the llm_* options, chat_decomposition) as available, deprecated or scheduled; the text says it was removed in that release and that judgement runs through sdp-semantic-review. The note in metasalmon-skill that the pinned pair rejects semapv:AgentBasedMatching is rewritten if that release carries metasalmon #282 and its mirror. The eval packets under evals/sdp-semantic-review/ are recopied from the conformance fixtures of the release the skills pin, so their pins.sdp_profile.version and packet_id match what that release writes: they read sdp-0.3.2 today, which is right for v0.6.0, and B-443 and B-444 move them when either package re-vendors sdp-0.3.3. The plugin''s own scaffold validation and evals pass, and its version is bumped and released as its own release policy says. Filed 2026-11-24 with smn-sci-plgn''s admission as the tenth member, under the AGENTS.md rule that the skills follow the tools.'
