retires_when: 'IN METASALMON, the remote base in .ms_default_sdp_schema_base_url() (R/schema-helpers.R) names the tag sdp-0.3.3. The complete bundle is re-vendored byte for byte from that tag: the six metadata schemas, the v0.3 profile and sdp.rules.yaml. inst/extdata/sdp-bundle-manifest.json names the tag and each file''s SHA-256, and the manifest test in test-schema-helpers.R passes offline. This is a patch release, so .ms_sdp_profile_path() keeps the v0.3 path. THE CONFORMANCE FIXTURES MOVE WITH IT, AND THAT IS THE PART THAT IS EASY TO MISS: write_semantic_review_packet() writes pins.sdp_profile.version from the vendored schema''s version (R/semantic-review-packet.R), that member is inside the canonical bytes packet_id hashes, and every golden packet under tests/testthat/fixtures/semantic-review/v1/ reads sdp-0.3.2 (measured 2026-11-24). So the fixtures are regenerated with Rscript scripts/build-semantic-review-fixtures.R, never edited by hand, and manifest.json follows. Because a change in a packet''s bytes is a change to the contract, the same regenerated tree lands in metasalmonpy under B-444 before either is released, and the pull request here says so. A package written at sdp-0.3.2 still validates under the new pin with an inform rather than a warning (metasalmon #212), and a test shows it. NEWS.md has one entry under the development heading. The release that carries this is Brett''s, as every release is. Filed 2026-11-24, the day sdp-0.3.3 was tagged. The release carries prose-only methods text (B-167) and the minimal example''s released IRIs (B-99), so nothing a validator checks changes; the version strings are the whole diff in the vendored files.'
