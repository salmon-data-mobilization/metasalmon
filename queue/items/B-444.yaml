retires_when: 'IN METASALMONPY, the remote pin names the tag sdp-0.3.3, and the complete bundle is re-vendored from that tag byte for byte, with its manifest naming the tag and each file''s SHA-256, exactly as B-443 does in metasalmon and as B-199 first did. The profile path stays v0.3. The vendored semantic-review conformance fixtures are recopied from metasalmon''s regenerated tree once B-443 lands, so tests/test_semantic_review_parity.py still finds the two trees byte-identical; each golden packet''s pins.sdp_profile.version and packet_id change with the pin, which is why this item is blocked by B-443 rather than run beside it. A package written at sdp-0.3.2 still validates under the new pin with the same patch-level behaviour metasalmon has. CHANGELOG.md has one entry under ## Unreleased. Filed 2026-11-24, the day sdp-0.3.3 was tagged.'
