retires_when: 'ROOT CAUSE FOUND 2026-11-24 (metasalmon pull request 288), and it is NOT git: since 2026-10-23 the runners are ubuntu-26.04, whose mkdir is uutils coreutils 0.10.0. In uu_mkdir 0.8.0 to 0.10.0 a mkdir that loses the race still exits 0 when the path is a directory by then, so two claims could both take the cap lock. Over 300 hub-queue runs there were 0 failures in 255 on ubuntu-24.04, and 9 failures in 29 on ubuntu-26.04 across git 2.55.0 to 2.56.1. The git-version reading below was the first suspect and is superseded. Pull request 288 takes the lock by an exclusive create of its pid file instead of trusting mkdir. IN METASALMON, assertion 19 of scripts/tests/test_hub_claim.sh no longer fails on the hub-queue CI runner, AND the root cause is named and fixed in scripts/hub (or in the test, if the test is what is wrong), not rerun away. MEASURED 2026-11-24: the assertion failed with the same signature, "(rc 0 and 0, claim refs 2)", on main at cf4cc4c (run 42917320939) and 6bde79f (run 43870190178), on pull request 286 at c3fb25c (run 45315478555) and on pull request 204 at bc11c77 (run 45315607136), while main at 354468c passed in between (run 45315442640). All four failures ran on git 2.56.1. Locally, on git 2.43.0, it passed in each of three timed runs, and in three more with six busy loops on four cores, so CPU load alone does not reproduce it and the git version is the first suspect. THE TIMING IS THE CLUE: in a passing run, assertion 18 to 19 takes about 1.35 s, because the second claim finds the cap lock held, sleeps one second, then counts one live claim and is refused. In every failing run it takes 0.5 to 0.6 s, so the second claim never waited. Both outputs show the same agent token and no "breaking the claim lock" warning before "claimed". The mkdir mutex itself is atomic, so the likelier fault is that the process that took the lock second counted zero live claims: its fetch_all (git fetch --prune of +refs/heads/claim/*:refs/hub/claim/* into the shared $CACHE_DIR/locks.git) or count_my_live_claims (for-each-ref over refs/hub/claim/) did not see the claim the first process had just pushed. Check first whether git 2.56 changed what a fetch, the auto-maintenance it may start in the background, or a bare repository''s default ref storage does to a concurrent reader of that cache. Whatever the cause, the cap must stay enforced: a fix that makes the assertion pass by loosening the cap or by retrying is not a fix. The repair also shows the failure first (for example by pinning git 2.56 in a local or CI reproduction) and then the same run passing. Retires when the four signatures above stop recurring on a run that exercises the same git version.'
