retires_when: 'The rule dispatch in R/schema-helpers.R drives its checks from the parsed rule ids, and a test fails when a rule id declared in sdp.rules.yaml has no executing check, so spec and implementation cannot diverge silently again. B-106 was the first prerequisite and Brett ruled it on 2026-09-14 -- reachability by a zero-or-more-step skos:broader path to a resource typed sosa:Procedure -- so this item no longer picks a reading by itself, and the rule text it dispatches on lands with B-106. Claimable stays false for the second prerequisite, B-148: executing the two reworded rules while 22 of the 45 gcdfo: method targets reach no typed ancestor would turn the bundled NuSEDS gold-standard example red the day the check is wired up, so this P1 must not unblock into a failing check. It flips to true when both are done, whichever way the gcdfo estimate branch is ruled.'
