retires_when: 'Brett rules the one choice left after the 2026-09-14 B-106 ruling, which settled what the rule means and not where gcdfo''s estimate methods hang: either the :EstimateMethod top concept at ontology/dfo-salmon.ttl:1227 is typed sosa:Procedure, one line mirroring what smn:EnumerationMethod already carries at ontology/dfo-salmon.ttl:1024 and defensible because SOSA defines a Procedure as covering a computational method and the estimate methods are Petersen estimators, area-under-the-curve integration and state-space calibration, or the estimate branch is promoted into smn:MethodScheme as the enumeration branch was on 2026-08-13 so smn anchors both. The methods-as-SKOS half was decided 2026-08-13 and the smn side shipped, so this is the only open part. One crosswalk row is wrong whichever way it goes and is the first row the retarget touches: R/nuseds-method-crosswalk.R:68 maps Based on Angling Catch to gcdfo:EnumerationMethod, a spelling no gcdfo release declares -- HEAD, the 0.0.9 release and docs/gcdfo.ttl all carry smn:EnumerationMethod instead, re-namespaced by the 2026-08-13 migration, and only the superseded 0.0.999 artifact still has the gcdfo: form -- so it fails as an undeclared IRI rather than as a missing Procedure, and the fix is smn:EnumerationMethod, which then passes by direct typing with no path needed. That changes an emitted ontology_term value, so it is an observable behaviour change needing a NEWS.md entry and the roxygen on nuseds_enumeration_method_crosswalk() updated, and metasalmonpy owes the same row under the mirror contract, as part of the open catch-up window rather than as a new parity register row.'
