retires_when: 'Brett rules what verification requires and who may assert it. Twenty-six cards carry 250 sources and 623 citations and not one has ever been verified, in any commit on any branch. The rule that the writer cannot be the checker is stated but unenforceable, and whether an agent re-reading a source counts as independent checking is genuinely undecided in the documentation rather than merely unwritten.'
