retires_when: 'Brett rules the taxonomic-assignment bundle, which is three parts and not one: the pattern itself, plus Q-06 decisions 1 (whether a gcdfo vocabulary may carry a species assertion) and 2 (whether a bare dwc:scientificName literal is acceptable on a life-history concept), which are the same question asked from two sides and cannot be ruled without the pattern. Ruling it leaves Q-06 with six decisions, none of which turn on the answer. The 2026-09-14 evidence briefing, landing at knowledge/plans/2026-09-14-taxonomic-assignment-briefing.md with metasalmon pull request 115 and the pointer above moving to it when that merges, recommends the Darwin Core Conceptual Model pattern ratified 2026-05-26 -- an organism or defined group, an identification, and a taxon carrying the authority identifiers -- with taxon-reference individuals rather than minted classes, and argues and rejects the alternative of leaving smn pull request 27 literals as they are. One consequence goes to Brett with the bundle rather than being assumed: the recommendation creates smn: IRIs typed dwc:Taxon, so it reopens Q8 (2026-08-24), whose species half ruled that species go to an external taxonomy and that no internal home is created or pointed at. Whether a reference node is an internal home is his call and not the briefing''s, so the ruling either amends Q8 or rejects that part of the recommendation. The vendor-or-stub half of the decision surface B-158''s card names, joining it to this question -- whether dwc:Organism, which carries smn:Deme and smn:Population, and the two NCBITaxon MIREOT IRIs are vendored or stubbed -- was ruled with B-158 on 2026-09-16 and is recorded on that card, not here; what remains of this question is the taxonomic-assignment pattern bundle itself, all three parts.'
