retires_when: 'Brett rules whether the SDP profile admits an instant in temporal_start and temporal_end, or whether the writers must refuse one, and the losing side changes to match in the same ruling. THE MEASUREMENT, verified 2026-09-16 at metasalmon inst/extdata/schema/frictionless/metadata/dataset.schema.json lines 77-98: both fields carry constraints.pattern ^(\d{4}|\d{4}-\d{2}-\d{2})$ -- a year or a date, never an instant -- with sdp:examples 1996 / 1996-01-01 and 2024 / 2024-12-31. So 0999-06-05T13:45:30Z and 2024-12-31T00:00:00Z both FAIL the profile the package ships. THIS IS NOT A REGRESSION AND SAYING SO MATTERS: it was true before B-115 and B-145 and is true after them. Those two items owed one thing, that datapackage.json and metadata/dataset.csv spell the same instant identically; what they could not deliver is a LEGAL string, because the profile admits no instant at all. The work changes WHICH invalid string is written, not whether one is. THE AGREEMENT IS NOT LANDED ON BOTH SIDES YET AND THIS ITEM MUST NOT BE READ AS SAYING IT IS, measured 2026-09-16: B-115 is state done and merged in metasalmon, while B-145 is state ready and claimable with its work in metasalmonpy pull request 34, UNMERGED, so Python''s descriptor and CSV still disagree with each other today. That does not soften the question and it does change what is being asked: the invalidity described here is true of both implementations now and stays true after 34 merges, because no instant is legal either way, so it is only the agreement that is pending. Found by the B-145 run 2026-09-16 and deliberately not absorbed, because it is a specification question in a different repository from either implementation. The three options are not equivalent. (a) Widen the pattern to admit an xs:dateTime, which makes the ruled ISO instant spelling legal and is the smallest change, but commits the profile to instants in a field whose name and description both say date or year. (b) Make both writers refuse a typed instant at the descriptor boundary, coercing to a date, which keeps the profile as it is and discards information the caller supplied. (c) Leave it, and accept that a package carrying a typed instant is invalid against its own profile while both files agree -- which is the status quo and is the one option nobody has chosen on purpose. Neither implementation produces a typed instant on its own, so this reaches a user only through a caller who supplies one; that bounds the severity and does not settle the question. Q50 about the Frictionless profile key is adjacent and whoever rules this should see it.'
