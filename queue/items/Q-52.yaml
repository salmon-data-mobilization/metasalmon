retires_when: 'Brett rules which single artifact holds an item severity, and the artifact that loses stops carrying the fact: the AGENTS.md sentence names the ruled home, and the other copy is deleted or reduced to something that cannot disagree. THE RULING ALSO HAS TO PUT severity INTO THE NORMATIVE FIELD LIST AT HUB.md:551, or say why a field the Select step twenty lines below orders the queue by is not one of the fields an item carries; stream is absent from that list on the same terms. queue/README.md''s illustrative block shows both fields and the sentence under it says HUB.md wins wherever the two differ, so by the queue''s own precedence rule neither is normative -- and nothing checks either list, because the lint has no field-set validation at all. THE RULING ALSO HAS TO DISPOSE OF EVERY RECORDED DIVERGENCE BETWEEN THE TWO COPIES, which is what makes this a defect rather than a tidiness question and which no choice of home settles on its own, because in each one the backlog entry''s prose agrees with its card and contradicts its own position. The divergences, the items carrying them, and the reader that found fewer of them than there are, are in knowledge/backlog.md. THEY ARE DELIBERATELY NOT RESTATED HERE: a card restating another item''s severity or state is the defect this item exists to settle, and it would go stale with no lint failure the moment either item moved. RECOMMENDED AND NOT RULED, because a contract sentence and HUB.md are both Brett''s: the item file, with severity and stream added to the HUB.md list. THE COST IS LOPSIDED AND THAT IS THE ARGUMENT -- ruling for the item file changes one sentence in AGENTS.md, one list in HUB.md and four section headings in knowledge/backlog.md, while ruling for the backlog changes the Select step and every defect card. THE TWO COPIES ARE DIFFERENTLY SHAPED, which is why they drift unobserved: the item file carries a FIELD and the backlog carries the fact by POSITION, so changing a severity is a one-line edit on one side and a move on the other, and nothing compares them. AGENTS.md is the outlier among the artifacts that state or use this, and it is the expensive one to be wrong in, because it is the file an agent reads first and without choosing to.'
