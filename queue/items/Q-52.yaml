retires_when: 'Brett rules which single artifact holds an item severity, and the artifact that loses stops carrying the fact: the AGENTS.md sentence names the ruled home, and the other copy is deleted or reduced to something that cannot disagree. THE RULING ALSO HAS TO PUT severity INTO HUB.md''s NORMATIVE FIELD LIST, or say why a field the queue is ordered by is not one of the fields an item carries -- because that list at HUB.md:551 names id, kind, title, state, claimable, repo, blocked_by, legacy, evidence, venue and, for a defect, retires_when, and stops there, while the Select step twenty lines later orders the queue by severity. queue/README.md''s illustrative block shows severity and stream, and the sentence under it says HUB.md wins whenever the two differ, so by the queue''s own precedence rule neither field is normative and both are carried by nearly every card. Nothing checks either list: the lint has no field-set validation at all. RECOMMENDED AND NOT RULED, because a contract sentence and HUB.md are both Brett''s: the item file, with severity and stream added to the HUB.md list. THE COST IS LOPSIDED AND THAT IS THE ARGUMENT -- ruling for the item file changes one sentence in AGENTS.md, one list in HUB.md, and four section headings in knowledge/backlog.md, while ruling for the backlog changes the Select step and every defect card. THE RULING ALSO HAS TO DISPOSE OF ONE MEASURED DIVERGENCE, which is what makes this a defect rather than a tidiness question: B-83 reads severity: P4 while its backlog entry sits inside a section headed P2, and that entry''s own prose calls the defect cosmetic, so the positional copy is the wrong one under either ruling. THE TWO COPIES ARE DIFFERENTLY SHAPED, which is why they drift unobserved -- the item file carries a FIELD and the backlog carries the fact by POSITION, so changing a severity is a one-line edit on one side and a move on the other, and nothing compares them. AGENTS.md is the outlier of the artifacts that state or use this, and it is the expensive one to be wrong in, because it is the file an agent reads first and without choosing to. The measurements, the instrument that produced them, and the two wrong readings it produced before the right one are in knowledge/backlog.md.'
