retires_when: 'Brett rules which single artifact holds an item severity, and the artifact that loses stops carrying the fact: the AGENTS.md sentence names the ruled home, and the other copy is deleted or reduced to something that cannot disagree. RECOMMENDED AND NOT RULED, because a contract sentence is Brett''s: the item file. THE COST IS LOPSIDED AND THAT IS THE ARGUMENT -- ruling for the item file changes one sentence in AGENTS.md and four section headings in knowledge/backlog.md, while ruling for the backlog changes the Select step in HUB.md and every item file that carries the field. THE RULING ALSO HAS TO DISPOSE OF ONE MEASURED DIVERGENCE, which is what makes this a defect rather than a tidiness question: B-83 reads severity: P4 while its backlog entry sits inside a section headed P2, and that entry''s own prose calls the defect cosmetic, so the positional copy is the wrong one under either ruling. THE TWO COPIES ARE DIFFERENTLY SHAPED, which is why they drift unobserved -- the item file carries a FIELD and the backlog carries the fact by POSITION, so changing a severity is a one-line edit on one side and a move on the other, and nothing compares them. AGENTS.md is the outlier of the artifacts that state or use this, and it is the expensive one to be wrong in, because it is the file an agent reads first and without choosing to. The measurements, the instrument that produced them, and the two wrong readings it produced before the right one are in knowledge/backlog.md.'
