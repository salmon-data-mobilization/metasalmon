retires_when: 'Brett rules which single artifact holds an item severity, and the artifact that loses stops carrying the fact: the AGENTS.md sentence names the ruled home, and the other copy is deleted or reduced to something that cannot disagree. THE RULING ALSO HAS TO PUT severity INTO HUB.md''s NORMATIVE FIELD LIST, or say why a field the queue is ordered by is not one of the fields an item carries -- because that list at HUB.md:551 names id, kind, title, state, claimable, repo, blocked_by, legacy, evidence, venue and, for a defect, retires_when, and stops there, while the Select step twenty lines later orders the queue by severity. queue/README.md''s illustrative block shows severity and stream, and the sentence under it says HUB.md wins whenever the two differ, so by the queue''s own precedence rule neither field is normative and both are carried by nearly every card. Nothing checks either list: the lint has no field-set validation at all. RECOMMENDED AND NOT RULED, because a contract sentence and HUB.md are both Brett''s: the item file, with severity and stream added to the HUB.md list. THE COST IS LOPSIDED AND THAT IS THE ARGUMENT -- ruling for the item file changes one sentence in AGENTS.md, one list in HUB.md, and four section headings in knowledge/backlog.md, while ruling for the backlog changes the Select step and every defect card. THE RULING ALSO HAS TO DISPOSE OF BOTH MEASURED DIVERGENCES, which is what makes this a defect rather than a tidiness question, and BOTH is the operative word because the first inventory found only one: B-83 reads severity: P4 while its backlog entry sits under a P2 heading and that entry''s prose calls the defect cosmetic, and B-116 reads severity: P1 while its entry sits under the P4 ecosystem heading via a nested smn-data-pkg subheading and that entry''s prose calls its severity high. In each case the entry''s prose agrees with the CARD and contradicts its own POSITION, in opposite directions, so the positional copy is the wrong one under either ruling; B-116 is additionally the backlog disagreeing with itself. B-116 is done and B-83 is icebox, so state is no guard against this. The one-divergence figure came from a reader that treated a DEEPER heading as ending a section rather than nesting inside it, which is why the inventory is stated here as a pointer and re-derived rather than trusted: raised by the Codex review of metasalmon pull request 142. THE TWO COPIES ARE DIFFERENTLY SHAPED, which is why they drift unobserved -- the item file carries a FIELD and the backlog carries the fact by POSITION, so changing a severity is a one-line edit on one side and a move on the other, and nothing compares them. AGENTS.md is the outlier of the artifacts that state or use this, and it is the expensive one to be wrong in, because it is the file an agent reads first and without choosing to. The measurements, the instrument that produced them, and the two wrong readings it produced before the right one are in knowledge/backlog.md.'
