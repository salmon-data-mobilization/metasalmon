evidence: knowledge/backlog.md
retires_when: 'Brett rules which side is right, and the ruling is recorded in knowledge/questions.md with its implementing item filed in the repository that can finish it: EITHER metasalmon''s validator reads the bundled schema under the shipped default options and makes no network request, pinned by a sentinel of the kind B-175 used, OR metasalmonpy''s validator loads the schema the way its writers do, OR, where the ruling keeps the difference, a pair of register items is filed, one in metasalmon for knowledge/parity-deviations.md and one in metasalmonpy for PARITY.md, each naming the other, because one item cannot finish a write in two repositories; each registers it with its reason. UNREGISTERED, which is what makes it an item rather than a detail: neither register mentions it, and AGENTS.md calls an undocumented difference a contract violation whether or not the difference is fine, and decides direction per divergence, so neither side is presumed right. R''s validator documents no offline promise; metasalmonpy''s code states one and keeps it. THE RULING ALSO DECIDES WHICH COPY OF THE SCHEMA B-204''s PATTERN CHECK ENFORCES, because that check will read whatever the validator loads, and should say so. RECOMMENDED AND NOT RULED, because the direction is Brett''s: R moves. A validator that waits out a network timeout on a cold session is the failure B-175 removed from review_metadata(), and once B-198''s pin and the vendored bundle are the same bytes the fetch returns nothing the bundle does not. The case the other way is real and is why this is a question: a remote-first validator sees a published schema change before a re-vendor does, which is the property the writers keep.'
