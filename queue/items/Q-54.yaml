retires_when: 'Brett rules each difference below, and each ruling is recorded in knowledge/questions.md with its implementing item filed in the repository that can finish it, or with a row in both parity registers where the ruling keeps a difference on purpose. The differences, one per clause: (1) the temperature -- whether one is sent, and which, on semantic review and on chat decomposition; (2) JSON mode -- whether the request asks for response_format json_object; (3) OpenRouter attribution -- whether HTTP-Referer and X-Title are sent to OpenRouter; (4) the user agent. What each side sends, and where, is in knowledge/backlog.md and deliberately not restated here. NEITHER SIDE HAS EVIDENCE IT IS BETTER on (1) or (2), which change what a model returns; the instrument that could supply it is the Theme A benchmark, whose live capture waits on the credential B-80 names. (3) and (4) change nothing a model sees, and could be registered or ported either way at no behavioural cost. THE RULING ON (1) ALSO DECIDES B-128, which gives R''s chat path the semantic path''s temperature rule on the premise that R keeps sending a temperature, and should say what becomes of it.'
