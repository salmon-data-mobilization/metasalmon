retires_when: 'Brett rules what smn:Run denotes and whether its label changes, and the ruling is recorded in knowledge/questions.md as Q61. The ruling also says whether the scope note that smn pull request 27 adds to smn:LifeHistoryType stands as written; that note says run timing is modelled as smn:Run. The definition itself is then written under B-237 from a source, as B-232''s condition requires. It is not written by this question. THE RULING RETIRES THIS ITEM ONLY WITH AN OWNER FOR EVERY CONSEQUENCE OF THE OPTION CHOSEN, filed or updated in the same change that records it: under (a), B-237 owns the definition and any relabel; under (b), an item owns moving smn:Run''s superclass under a group class and changing pull request 27''s scope note (or the split part that carries it) before that note merges; under (c), an item owns minting the second term, and B-239 owns recording the new concept as an open gap in the commons gap register. The question retires once those owners are filed or updated, not once their writes land, because B-239 and anything else blocked on this question cannot run until it retires. Added 2026-09-24 after the Codex review of metasalmon pull request 150 found that options (b) and (c) need ontology work that no item owned.'
