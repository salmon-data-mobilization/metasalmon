retires_when: 'Brett rules which spellings count as a REVIEW: marker, and the ruling governs EVERY DETECTOR IN BOTH PACKAGES, not only the strip helpers: each package is mixed today, so a marker such as "REVIEW :x" is stripped on one path and passed as an IRI on another within the same package. Measured 2026-09-24 on metasalmon main 43d7fb3: .ms_is_review_iri() and .ms_strip_review_iri() (R/package-helpers.R:3777-3789) accept ^\s*REVIEW\s*: ignoring case; four detectors test ^REVIEW: ignoring case (R/package-helpers.R:1754, R/sdp-extension-helpers.R:37, R/sdp-methods.R:272, R/semantic-bundle-validators.R:696); and the two output guards test the literal substring REVIEW: (R/eml-export.R:2787, R/knb-publication.R:834). On metasalmonpy main 9661633: dictionary.py:622 and package_io.py:2441 accept ^\s*REVIEW\s*: ignoring case; package_io.py:219 and :2528 and review_console.py:140 and :146 test a leading REVIEW: upper-cased; and eml.py:3472 and knb_publication.py:1043 test the literal substring. The ruling is recorded in knowledge/questions.md, and it retires this item only with one queue item per package that routes every detector through one predicate for the ruled spellings and pins each site with a test, or with a row in both parity registers for any difference kept on purpose. B-219 and B-220 each refuse an iri left empty by their own package''s strip, so both can retire with this difference in place, which is why this question owns it. Q-18 is the neighbouring question about the trailing space the writers emit, not about what the readers accept. Filed 2026-09-24 after the Codex review of metasalmon pull request 150, and widened the same day after the next round found that R''s own detectors disagree with its strip helper; the metasalmonpy sites were measured then too.'
